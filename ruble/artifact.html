}

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}

.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}

.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}

.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}

.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
.rr {
  --rr-glass: #eef3f6;
  --rr-water: #a9c0cf;
  --rr-water-top: #d3e0e9;
  --rr-deep: #8eabbf;
  --rr-stream: #9db7c8;
  --rr-cavity: #d9dcdc;
  --rr-void: #6f7378;
  --rr-window: #e9eff2;
  --rr-ring: #7f9aad;
  --rr-accent: #18181a;
}
.iso[data-theme="dark"] .rr,
.rr[data-theme="dark"],
.iso[data-theme="dark"].rr {
  --rr-glass: #1a1e21;
  --rr-water: #2b3d4a;
  --rr-water-top: #3a5062;
  --rr-deep: #33495a;
  --rr-stream: #3d5869;
  --rr-cavity: #0e0f10;
  --rr-void: #050505;
  --rr-window: #1c2125;
  --rr-ring: #6a8aa0;
  --rr-accent: #e6e6e6;
}
.rr-glass { fill: var(--rr-glass); opacity: .5; stroke: none; }
.rr-water { fill: var(--rr-water); opacity: .62; stroke: none; }
.rr-water.rr-sea { opacity: .8; }
.rr-water.rr-deep { fill: var(--rr-deep); opacity: .9; }
.rr-water-top { fill: var(--rr-water-top); opacity: .75; stroke: none; }
.rr-stream { fill: var(--rr-stream); opacity: .8; stroke: none; }
.rr-cavity { fill: var(--rr-cavity); stroke: none; }
.rr-void { fill: var(--rr-void); stroke: none; }
.rr-window { fill: var(--rr-window); stroke: none; }
.rr-ring { stroke: var(--rr-ring); }
.rr-glint { stroke: var(--anatomy-face); stroke-width: 1.1; opacity: .9; }

.rr-stage { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.rr-stage > svg { display: block; width: 100%; height: auto; }

.rr-panel {
  margin: 14px 0 0;
  padding: 16px 18px 14px;
  border-radius: 14px;
  background: var(--anatomy-card);
  box-shadow: var(--anatomy-lift);
  color: var(--anatomy-text);
  font: 13px/1.45 var(--anatomy-mono);
}
.rr-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 24px; }
.rr-group { margin: 0; padding: 0; border: 0; min-width: 0; display: grid; gap: 14px; align-content: start; }
.rr-group legend { padding: 0 0 4px; margin-bottom: 2px; width: 100%; border-bottom: 1px solid var(--anatomy-faint, #d4d4d6); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--anatomy-strong); }
.rr-knob-hint { grid-column: 1 / -1; margin: 0; font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--anatomy-muted); }
.rr-where { color: var(--anatomy-text); }
.rr-knob { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 10px; }
.rr-knob-label { grid-column: 1 / -1; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--anatomy-muted); }
.rr-knob input { width: 100%; accent-color: var(--rr-accent); }
.rr-knob output { min-width: 4.4em; text-align: right; color: var(--anatomy-strong); font-variant-numeric: tabular-nums; }
.rr-scenes { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.rr-scene {
  font: inherit; font-size: 12px; color: var(--anatomy-text); background: transparent;
  border: 1px solid var(--anatomy-faint, #d4d4d6); border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
.rr-scene[aria-pressed="true"] { color: var(--anatomy-card); background: var(--anatomy-strong); border-color: var(--anatomy-strong); }
.rr-scene:focus-visible, .rr-knob input:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 3px; }
.rr-tour { margin-left: auto; }
.rr-say { margin: 10px 0 0; min-height: 1.45em; color: var(--anatomy-strong); }
.rr-flows { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--anatomy-faint, #d4d4d6); font-size: 12px; }
.rr-flow { display: inline-flex; gap: 8px; }
.rr-flow b { font-weight: 500; color: var(--anatomy-strong); font-variant-numeric: tabular-nums; }

@media (max-width: 640px) {
  .rr-groups { grid-template-columns: 1fr; }
  .rr-tour { margin-left: 0; }
}
.rr-spoke { fill: none; stroke: var(--anatomy-mid); stroke-width: 2.1; stroke-linecap: round; }
.rr-spoke-hi { fill: none; stroke: var(--anatomy-top); stroke-width: .8; stroke-linecap: round; }
.rr { --rr-paper: #ffffff; --rr-grid: #e3e1da; --rr-trace: #18181a; }
.iso[data-theme="dark"] .rr, .iso[data-theme="dark"].rr { --rr-paper: #1d1d1d; --rr-grid: #2b2b2b; --rr-trace: #f0f0f0; }
.rr-paper { fill: var(--rr-paper); stroke: none; }
.rr-grid { fill: none; stroke: var(--rr-grid); stroke-width: .5; }
.rr-trace { fill: none; stroke: var(--rr-trace); stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
.rr-trace-ref { fill: none; stroke: var(--anatomy-red); stroke-width: .6; stroke-dasharray: 2 2; opacity: .7; }
.rr-head { margin: 0 0 22px; }
.rr-kicker { margin: 0 0 4px; font: 11px/1.4 var(--anatomy-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--anatomy-muted); }
.rr-head h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; font-weight: 600; color: var(--anatomy-strong); letter-spacing: -.01em; }
.rr-lede { margin: 0; max-width: 62ch; color: var(--anatomy-text); }
.rr .iso-legend { margin-top: 16px; }
@media (max-width: 640px) {
  .rr .iso-plate { overflow: hidden; }
  .rr-stage > svg { width: 118%; margin: -7% -12% -3% -6%; }
  .rr-head h1 { font-size: 24px; }
}

</style><div class="rr"><header class="rr-head"><p class="rr-kicker">Как устроен курс</p><h1>Резервуар рубля</h1><p class="rr-lede">Экспорт, импорт, ставка, санкции, бюджетное правило и резервы ЦБ — восемь рычагов одной машины. Крутите ручки или смотрите тур: стрелка на крышке показывает, сколько рублей стоит доллар.</p></header><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Рис. 1</span><span class="iso-plate-corner" data-corner="title">Резервуар рубля</span><span class="iso-plate-corner" data-corner="hint">Модель условная · единицы относительные</span><span class="iso-plate-corner" data-corner="readout" data-readout></span></div><div class="iso-stage rr-stage"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg rr-svg" viewBox="0 0 900 720" role="img" aria-label="Механическая модель валютного рынка. Главный стеклянный резервуар — предложение валюты; поплавок через шток поворачивает стрелку циферблата «рублей за доллар». Насос «Экспорт» качает валюту из бассейна «Остальной мир», его скорость задаёт ручка цены нефти; на напорной трубе стоит санкционная задвижка. Два слива, «Импорт» и «Вывод капитала», возвращают валюту в мир; их задвижки подняты одной траверсой, которую опускает маховик ключевой ставки. Реверсивный насос Минфина по бюджетному правилу перекачивает валюту в бак ФНБ, когда нефть дороже цены отсечения, и обратно, когда дешевле."><path class="iso-halo" d="M116.4 429.1L116.9 427.7L118 426.4L119.5 425.2L121.5 424.2L369.6 320.1L371.9 319.3L374.5 318.7L377.3 318.4L380.1 318.4L382.9 318.7L385.6 319.2L387.9 320L390 321L780.3 553.6L781.9 554.7L783 556L783.6 557.4L783.6 558.8L783.6 576.4L783.1 577.8L782 579.1L780.5 580.3L778.5 581.3L530.4 685.4L528.1 686.2L525.5 686.7L522.7 687L519.9 687L517.1 686.8L514.4 686.2L512.1 685.5L510 684.5L119.7 451.9L118.1 450.7L117 449.4L116.4 448L116.4 446.6Z"/><g class="iso-solid"><path class="iso-fill" d="M363 357.4L363.3 355.9 // Модель «Резервуара рубля». Условная, не прогноз: показывает знаки и порядок связей.
// h — уровень в главном резервуаре (0…1), n — бак ФНБ (0…1), c — резервы ЦБ (0…1).
const RANGE = {
  oil: [30, 120], // цена Urals, $/барр
  vol: [50, 150], // физический объём экспорта, % от текущего
  sanc: [0, 100], // санкционное трение, %
  dem: [50, 150], // спрос на импорт, % от текущего
  rate: [5, 25], // ключевая ставка, %
  cutoff: [40, 80], // цена отсечения бюджетного правила, $/барр
  mscale: [0, 200], // операции Минфина, % от объёма по правилу
  cb: [0, 100], // продажи валюты из резервов ЦБ, % от максимума
};
const START = { oil: 62, vol: 100, sanc: 40, dem: 100, rate: 16, cutoff: 59, mscale: 100, cb: 0 };
const LEVEL0 = 0.6;
const FUND0 = 0.55;
const RESERVE0 = 0.8;

const K_EXPORT = 1;
const K_IMPORT = 1.124;
const K_CAPITAL = 0.495;
const K_MINFIN = 0.012;
const K_CB = 0.2;
const AREA = 3;
const AREA_FUND = 10;
const AREA_RESERVE = 12;

const openingOf = (rate) => Math.max(0.3, 1 - 0.015 * (rate - 5)); // задвижки слива: выше ставка — уже щель
const throttleOf = (sanc) => 1 - 0.0045 * sanc; // санкционная задвижка на притоке
const rubOf = (h) => 140 - 95 * h; // ₽ за $ по уровню

function flowsOf(x, h, n, c = 1) {
  const exp = K_EXPORT * (x.oil / 60) * (x.vol / 100) * throttleOf(x.sanc);
  let minfin = K_MINFIN * (x.mscale / 100) * (x.oil - x.cutoff); // > 0 — Минфин покупает валюту в ФНБ
  if (minfin < 0 && n <= 0.001) minfin = 0;
  if (minfin > 0 && n >= 0.999) minfin = 0;
  const cb = c > 0.001 ? K_CB * (x.cb / 100) : 0; // продажи из резервов ЦБ
  const open = openingOf(x.rate);
  const head = Math.max(0, h); // слив растёт с напором
  return { exp, minfin, cb, imp: K_IMPORT * open * (x.dem / 100) * head, cap: K_CAPITAL * open * head, open };
}

function step(state, input, dt) {
  const f = flowsOf(input, state.h, state.n, state.c);
  state.h = Math.min(1, Math.max(0, state.h + ((f.exp + f.cb - f.minfin - f.imp - f.cap) / AREA) * dt));
  state.n = Math.min(1, Math.max(0, state.n + (f.minfin / AREA_FUND) * dt));
  state.c = Math.min(1, Math.max(0, state.c - (f.cb / AREA_RESERVE) * dt));
  return f;
}

// равновесный уровень при непустых баках (для проверки калибровки)
function balanceOf(input) {
  const f = flowsOf(input, 1, 0.5, 1);
  return Math.min(1, Math.max(0, (f.exp + f.cb - f.minfin) / (f.imp + f.cap)));
}

function ribbon(points, width) {

  const y = recY(rub);
  const carriage = slabOf({ x: REC.penX + 2, y: y - 3, w: 8, d: 6, r: 1 }, REC.z + 8.6, 6.4, P, 2, 0.4);
  const arm = slabOf({ x: REC.penX - 0.7, y: y - 0.7, w: 3.4, d: 1.4, r: 0.5 }, REC.z + 0.4, 9, P, 2);
  el.recPen.innerHTML = solidSvg(arm, { tone: "hi", lit: true, crease: "none" }) + solidSvg(carriage, { tone: "hi" }) + `<path class="iso-line" data-tone="mid" d="${lineOnTop([REC.penX + 6, y - 3], [REC.penX + 6, y + 3], REC.z + 15, P)}"/>`;
}
function setSpin(id, phase) {
  const s = spin[id];
  if (!s || !s.els.length) return;
  const n = s.frames.length;
  const index = ((Math.floor(phase * n) % n) + n) % n;
  if (index !== s.shown) {
    for (const node of s.els) node.setAttribute("d", s.frames[index]);
    s.shown = index;
  }
}

// ── состояние, тур, панель ───────────────────────────────────────────────────
const S0 = START;
const SCENES = [
  { key: "base", say: "Нефть ~62 $, ставка 16%, правило работает: приток и отток в равновесии.", input: { ...S0 } },
  { key: "boom", say: "Нефть 100 $: насос экспорта разгоняется, но Минфин уводит излишек в ФНБ, и рубль крепнет умеренно.", input: { ...S0, oil: 100 } },
  { key: "pause", say: "Нефть 100 $, правило на паузе: весь приток остаётся на рынке, рубль резко крепнет, как в 2022 году.", input: { ...S0, oil: 100, mscale: 0 } },
  { key: "crash", say: "Нефть 35 $: Минфин продаёт валюту из ФНБ и держит курс, пока бак не опустеет.", input: { ...S0, oil: 35 } },
  { key: "cbsell", say: "Нефть 45 $ и продажи из резервов ЦБ: курс поддержан, но бак «Резервы ЦБ» тает.", input: { ...S0, oil: 45, cb: 70 } },
  { key: "imports", say: "Спрос на импорт +40%: рычаг крана открыт до упора, слив растёт, рубль слабеет.", input: { ...S0, dem: 140 } },
  { key: "hawk", say: "Ставка 21%: траверса прижимает задвижки импорта и вывода капитала, рубль крепнет.", input: { ...S0, rate: 21 } },
  { key: "dove", say: "Ставка 9%: сливы открываются шире, уровень и рубль снижаются.", input: { ...S0, rate: 9 } },
  { key: "sanc", say: "Санкционное трение 90%: задвижка почти закрыта, выручка застревает за рубежом, приток пересыхает.", input: { ...S0, sanc: 90 } },
];
const TOUR = ["base", "boom", "pause", "base", "crash", "cbsell", "base", "imports", "hawk", "sanc"];
const KEYS = Object.keys(RANGE);
const input = { ...START };
const want = { ...START };
const state = { h: LEVEL0, n: FUND0, c: RESERVE0 };
const phase = { cpl: 0, m: { "m-exp": 0, "m-imp": 0, "m-cap": 0, "m-min": 0, "m-cb": 0 }, fan: 0, clock: 0 };
let touring = !still.matches;
let tourAt = 0;
let tourIndex = 0;
let idle = 0;
let scene = SCENES[0];
let flows = flowsOf(input, state.h, state.n, state.c);

const ui = {
  ...Object.fromEntries(KEYS.map((key) => [key, document.querySelector(`[data-in="${key}"]`)])),
  reset: document.querySelector("[data-reset]"),
  out: Object.fromEntries([...document.querySelectorAll("[data-out]")].map((node) => [node.dataset.out, node])),
  scenes: [...document.querySelectorAll("[data-scene]")],
  tour: document.querySelector("[data-tour]"),
  say: document.querySelector("[data-say]"),
};
function syncUi() {
  for (const key of KEYS) if (ui[key] && document.activeElement !== ui[key]) ui[key].value = String(want[key]);
  const shown = { oil: `${Math.round(input.oil)} $`, vol: `${Math.round(input.vol)}%`, sanc: `${Math.round(input.sanc)}%`, dem: `${Math.round(input.dem)}%`, rate: `${fmt(input.rate)}%`, cutoff: `${Math.round(input.cutoff)} $`, mscale: `${Math.round(input.mscale)}%`, cb: `${Math.round(input.cb)}%` };
  for (const key of KEYS) if (ui.out[key] && ui.out[key].textContent !== shown[key]) ui.out[key].textContent = shown[key];
  ui.scenes.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scene === scene?.key)));
  ui.tour.setAttribute("aria-pressed", String(touring));
  ui.tour.textContent = touring ? "Тур идёт" : "Запустить тур";
}
function chooseScene(key, fromTour = false) {
  scene = SCENES.find((s) => s.key === key);
  Object.assign(want, scene.input);
  ui.say.textContent = scene.say;
  if (!fromTour) stopTour();
  syncUi();
  run();
}
function stopTour() {
  touring = false;
  idle = 0;
}
for (const key of KEYS) {
  ui[key]?.addEventListener("input", () => {
    want[key] = Number(ui[key].value);
    scene = null;
    ui.say.textContent = "ручной режим";
    stopTour();
    syncUi();
    run();
  });
}
ui.scenes.forEach((b) => b.addEventListener("click", () => chooseScene(b.dataset.scene)));
ui.reset?.addEventListener("click", () => {
  state.n = FUND0;
  state.c = RESERVE0;
  chooseScene("base");
});
ui.tour.addEventListener("click", () => {
  touring = !touring;
  if (touring) { tourAt = 0; tourIndex = 0; chooseScene(TOUR[0], true); }
  syncUi();
  run();
});

let lastText = "";
function draw(dt) {
  const inflow = flows.exp;
  drawTank(state.h, inflow, phase.clock);
  const rub = rubOf(state.h);
  const share = (140 - rub) / 95;
  el.needle.setAttribute("d", pointer(D.C, D.GAUGE_TOP + 0.2, 3.4, D.GAUGE.r - 4, 1 - share));
  const oilShare = (input.oil - RANGE.oil[0]) / (RANGE.oil[1] - RANGE.oil[0]);
  el.oil.setAttribute("d", pointer(D.OIL_KNOB, D.OIL_TOP + 4, 0, 6, oilShare));
  el.cut.setAttribute("d", pointer(D.CUT_DIAL, D.CUT_TOP + 0.6, 1.6, 7.4, oilShare));
  el.cutMark.setAttribute("d", pointer(D.CUT_DIAL, D.CUT_TOP + 0.6, -4.6, 8.4, (input.cutoff - RANGE.oil[0]) / (RANGE.oil[1] - RANGE.oil[0])));
  el.vol.setAttribute("d", pointer(D.VOL_KNOB, D.OIL_TOP + 4, 0, 5, (input.vol - RANGE.vol[0]) / (RANGE.vol[1] - RANGE.vol[0])));
  el.gain.setAttribute("d", pointer(D.GAIN_KNOB, D.CUT_TOP + 3.4, 0, 3.8, input.mscale / RANGE.mscale[1]));
  el.lever.innerHTML = leverSvg(D.BALL, input.dem / RANGE.dem[1]);
  el.stemCb.innerHTML = stemSvg(D.CBV.x, D.CBV.y, D.CBV.z, D.CBV.z + 2 + (D.CBV.max - 2) * (input.cb / 100), false);
  setSpin("hw-cb", (input.cb / 100) * 2);
  // санкционная задвижка: шток поднят пропорционально пропуску
  const pass = throttleOf(input.sanc);
  el.stemSanc.innerHTML = stemSvg(D.SV.x, D.SV.y, D.SV.z, D.SV.z + 2 + (D.SV.max - 2) * clamp((pass - 0.55) / 0.45, 0, 1), false);
  // траверса ставки
  const open = openingOf(input.rate);
  const zx = D.XHEAD_Z[0] + (D.XHEAD_Z[1] - D.XHEAD_Z[0]) * clamp((open - 0.7) / 0.3, 0, 1);
  el.xhead.setAttribute("transform", translateAlong(P, [0, 0, zx]));
  for (const stem of D.STEMS) {
    const target = stem.live === "stem-import" ? el.stemImp : el.stemCap;
    target.innerHTML = stemSvg(stem.x, stem.y, stem.z, zx, false);
  }
  setSpin("hw-sanc", (input.sanc / 100) * 2.5);
  setSpin("hw-rate", (input.rate / 5) * 1.2);
  setSpin("cpl", phase.cpl);
  setSpin("fan", phase.fan);
  for (const id of Object.keys(phase.m)) setSpin(id, phase.m[id]);
  for (const sight of D.SIGHTS) drawSight(sight, state[sight.key]);
  drawRecorder(rub);
  setSpin("roller", paperShift / (TAU * 3.4) * 1);
  // струи и круги на воде бассейна
  const a = drainStream(D.DRAINS[0], flows.imp);
  const b = drainStream(D.DRAINS[1], flows.cap);
  el.streamImp.innerHTML = a.d;
  el.streamCap.innerHTML = b.d;
  let rings = "";
  for (const [land, f] of [[a.land, flows.imp], [b.land, flows.cap]]) {
    if (f < 0.01) continue;
    for (let i = 0; i < 2; i++) {
      const s = ((phase.clock * 0.9 + i * 0.5) % 1);
      rings += `<path class="iso-line rr-ring" style="opacity:${(0.75 * (1 - s)).toFixed(2)}" d="${ring(land[0], land[1], 2 + s * 9, D.SUMP_WATER, P, 28)}"/>`;
    }
  }
  const [sx, sy, sr] = D.RIPPLES[0];
  rings += `<path class="iso-line" data-tone="lo" d="${ring(sx, sy, sr, D.SUMP_WATER, P, 24)}"/>`;
  el.ripples.innerHTML = rings;
  // табло
  const text = `1 $ = ${fmt(rub)} ₽ · ФНБ ${Math.round(state.n * 100)}% · резервы ЦБ ${Math.round(state.c * 100)}%`;
  if (text !== lastText) { readout.textContent = text; lastText = text; }
  ui.out.exp.textContent = fmt(flows.exp, 2);
  ui.out.cbflow.textContent = fmt(flows.cb, 2);
  ui.out.minfin.textContent = (flows.minfin >= 0 ? "в ФНБ " : "из ФНБ ") + fmt(Math.abs(flows.minfin), 2);
  ui.out.imp.textContent = fmt(flows.imp, 2);
  ui.out.cap.textContent = fmt(flows.cap, 2);
  ui.out.rub.textContent = `${fmt(rub)} ₽`;
  syncUi();
}

let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) {
    tourAt += dt;
    if (tourAt > 9) {
      tourAt = 0;
      tourIndex = (tourIndex + 1) % TOUR.length;
      chooseScene(TOUR[tourIndex], true);
    }
  }
  for (const key of KEYS) input[key] = calm ? want[key] : input[key] + (want[key] - input[key]) * (1 - Math.exp(-dt / 0.6));
  // модель шагает чаще кадра для устойчивости
  const sub = 4;
  for (let i = 0; i < sub; i++) flows = step(state, input, calm ? (dt * 6) / sub : dt / sub);
  phase.clock += dt;
  if (!calm) {
    phase.cpl += dt * flows.exp * 1.6;
    phase.m["m-exp"] += dt * flows.exp * 1.4;
    phase.m["m-imp"] += dt * flows.imp * 1.6;
    phase.m["m-cap"] += dt * flows.cap * 2.2;
    phase.m["m-min"] += dt * flows.minfin * 3;
    phase.fan += dt * flows.minfin * 4;
    phase.m["m-cb"] += dt * flows.cb * 3;
  }
  paperShift += dt * PAPER_SPEED;
  const sample = history[history.length - 1];
  if (!sample || phase.clock - sample[0] > 0.12) history.push([phase.clock, rubOf(state.h)]);
  while (history.length && (phase.clock - history[0][0]) * PAPER_SPEED > REC.penX - REC.paper.x + 4) history.shift();
  draw(dt);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); else { cancelAnimationFrame(frame); frame = 0; } }, { rootMargin: "120px 0px" }).observe(stage);
chooseScene("base", true);
draw(0);
</script>
