name: Карта товарных потоков — обновление данных

on:
  schedule:
    - cron: "17 3 * * *"   # каждый день в 06:17 мск
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flows-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать данные
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python3 flows/fetch/update.py
      - name: Собрать однофайловую версию
        run: python3 flows/build.py
      - name: Закоммитить
        run: |
          git config user.name "flows-bot"
          git config user.email "flows-bot@users.noreply.github.com"
          git add flows/data flows/dist
          git diff --cached --quiet || git commit -m "Карта товарных потоков: данные на $(date -u +%F)"
          git push
