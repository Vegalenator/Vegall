<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Квест про западное кино 80-х и 90-х: видеосалон «Космос», 1991 год, пропавший дядя Гоша и видик, который мотает время.">
<meta name="theme-color" content="#1b120c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c1c1e'/%3E%3Crect x='4' y='9' width='24' height='14' rx='2' fill='%23efe6cc'/%3E%3Ccircle cx='11' cy='16' r='3' fill='%231c1c1e'/%3E%3Ccircle cx='21' cy='16' r='3' fill='%231c1c1e'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Перемотка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Press+Start+2P&family=Neucha&display=swap">
<style>
/* Раскладка: одна комната-хаб под абажуром (SVG-сцена) + верхняя «панель видика»;
   испытания открываются поверх как предметы крупным планом; сюжет идёт на экране «Рубина». */
:root{
  --room:#1b120c;        /* темнота подвала */
  --room-2:#2a1b12;
  --wood:#6e3f22;        /* полировка серванта */
  --wood-hi:#9a5c32;
  --carpet:#8c1d22;      /* ковёр на стене */
  --paper:#efe2c2;       /* тетрадный лист, афиша */
  --paper-ink:#2b2a6e;   /* шариковая ручка */
  --lamp:#ffc46b;        /* свет абажура */
  --crt:#0f1f8f;         /* синий экран видика */
  --osd:#e9fff1;         /* экранные надписи */
  --osd-green:#5dff8f;
  --neon:#ff3ea5;        /* обложки 80-х */
  --neon-2:#36e4ff;
  --chrome:#dfe6ee;
  --ok:#57d17a;
  --bad:#ff5a4a;
  --fg:#f3e6cf;
  --fg-dim:#bda98a;
  --line:rgba(255,214,150,.18);

  --f-display:"Rubik Mono One", "Arial Black", Impact, sans-serif;
  --f-body:"PT Sans", "Trebuchet MS", Arial, sans-serif;
  --f-osd:"Press Start 2P", "Courier New", monospace;
  --f-mono:"PT Mono", "Courier New", monospace;
  --f-hand:"Neucha", "Comic Sans MS", cursive;

  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--room); color:var(--fg);
  font:16px/1.5 var(--f-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--neon-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== общий кинескопный налёт ===== */
.scan::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
#grain{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.07;mix-blend-mode:overlay}

/* ===== верхняя панель — фасад видика ===== */
.deck{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 16px;
  background:linear-gradient(#c9cdd2,#9ea3a9 55%,#868b91);
  color:#1d1f22;border-bottom:2px solid #3a3d41;
  box-shadow:0 6px 18px rgba(0,0,0,.55);
}
.deck__brand{font:700 13px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.deck__brand b{font:12px/1 var(--f-display);letter-spacing:.06em}
.deck__brand small{font-size:9px;letter-spacing:.3em;opacity:.7}
.lcd{
  display:flex;align-items:center;gap:10px;
  background:#0b1410;border:2px solid #2b2f33;border-radius:4px;
  padding:6px 10px;color:var(--osd-green);font:10px/1 var(--f-osd);
  text-shadow:0 0 6px rgba(93,255,143,.7);
  box-shadow:inset 0 0 12px rgba(0,0,0,.9);
}
.lcd__counter{font-size:14px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.lcd__mode{opacity:.85}
.deck__sp{flex:1}
.deck__btns{display:flex;gap:6px;flex-wrap:wrap}
.key{
  border:1px solid #4a4e53;border-radius:3px;padding:7px 10px;
  background:linear-gradient(#2d3034,#17191c);color:#e8e8e8;
  font:11px/1 var(--f-body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.15);
  display:inline-flex;align-items:center;gap:6px;
}
.key:active{transform:translateY(2px);box-shadow:0 0 0 #000}
.key .led{width:6px;height:6px;border-radius:50%;background:#3b0b0b}
.key[aria-pressed="true"] .led{background:#ff4a3a;box-shadow:0 0 6px #ff4a3a}
.wraps{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--f-body);color:#1d1f22}
.wraps__ico{width:26px;height:18px;border-radius:2px;background:linear-gradient(90deg,#ffde00 0 33%,#e3001b 33% 66%,#0055b8 66%);position:relative;box-shadow:0 1px 0 #000}
.wraps__ico::after{content:"TURBO";position:absolute;inset:0;display:grid;place-items:center;font:7px/1 var(--f-display);color:#fff;text-shadow:0 1px 0 #000}

/* ===== экраны ===== */
.screen{min-height:calc(100% - 60px);padding-block:18px 40px;padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto}

/* ===== титульник ===== */
.title{display:grid;place-items:center;min-height:calc(100vh - 80px);padding-block:20px}
.tv{
  position:relative;width:min(760px,100%);
  background:linear-gradient(135deg,#5a3219,#3b200f 60%,#2b170b);
  border-radius:22px;padding:22px 22px 70px;
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 0 rgba(0,0,0,.4);
}
.tv::before{ /* шпон */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(95deg,transparent 0 9px,rgba(0,0,0,.25) 9px 10px,transparent 10px 23px,rgba(255,200,140,.06) 23px 25px);
}
.tv__glass{
  position:relative;aspect-ratio:4/3;max-width:100%;
  border-radius:38px/30px;overflow:hidden;
  background:#05070f;border:10px solid #1a1a1a;
  box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 0 3px #3b3b3b;
}
.tv__screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6%;
  filter:saturate(1.15) contrast(1.05);
}
.tv__screen.blue{background:radial-gradient(ellipse at center,#2a3ad6,#0f1f8f 70%,#08105a)}
.tv__glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.14),transparent 45%);border-radius:inherit}
.tv__curve{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 10px rgba(0,0,0,.75);border-radius:inherit}
.tv__panel{position:absolute;left:22px;right:22px;bottom:14px;height:44px;display:flex;align-items:center;gap:14px}
.tv__brand{font:15px/1 var(--f-display);color:#d9c39c;letter-spacing:.12em;text-shadow:0 1px 0 #000}
.tv__grille{flex:1;height:26px;background:repeating-linear-gradient(90deg,#1a0e06 0 3px,#4a2a14 3px 6px);border-radius:3px;opacity:.9}
.knob{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9e4da,#8a847a 60%,#3d3a35);box-shadow:0 3px 4px rgba(0,0,0,.6);position:relative}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:3px;height:11px;margin-left:-1.5px;background:#2a2622;border-radius:2px}
.knob--2::after{transform:rotate(130deg);transform-origin:50% 13px}

.logo{
  font:clamp(30px,8.5vw,74px)/.95 var(--f-display);letter-spacing:-.01em;margin:0;
  background:linear-gradient(180deg,#fff 0%,#c9e7ff 38%,#3a5d8c 50%,#ffd9f1 52%,#ff6ac0 70%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(255,62,165,.55)) drop-shadow(0 4px 0 #2a0738);
  text-wrap:balance;
}
.logo-sub{font:clamp(9px,1.6vw,12px)/1.8 var(--f-osd);color:var(--osd);margin:14px 0 0;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,255,255,.5)}
.osd-top{position:absolute;top:6%;left:7%;right:7%;display:flex;justify-content:space-between;font:clamp(8px,1.5vw,12px)/1 var(--f-osd);color:var(--osd);text-shadow:0 0 6px rgba(255,255,255,.6)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.title__actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.btn-play{
  border:0;border-radius:4px;padding:14px 22px;
  background:linear-gradient(#ffe8a8,#ffb400);color:#2a1300;
  font:13px/1 var(--f-osd);letter-spacing:.06em;
  box-shadow:0 4px 0 #8a4a00,0 0 26px rgba(255,180,0,.45);
}
.btn-play:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a00}
.btn-ghost{border:2px solid var(--osd);background:transparent;color:var(--osd);border-radius:4px;padding:12px 18px;font:11px/1 var(--f-osd)}
.title__warn{max-width:620px;margin:22px auto 0;font:12px/1.6 var(--f-mono);color:var(--fg-dim);text-align:center}

/* ===== сюжетный экран ===== */
.story{display:grid;place-items:center;padding-block:10px}
.story .tv{width:min(860px,100%)}
.story__text{
  font:clamp(12px,2vw,17px)/1.75 var(--f-mono);color:var(--osd);text-align:left;width:100%;
  text-shadow:0 0 5px rgba(233,255,241,.55),1px 0 0 rgba(255,0,80,.35),-1px 0 0 rgba(0,200,255,.35);
  white-space:pre-wrap;max-height:100%;overflow:auto;
}
.story__text .who{color:#ffe36b}
.story__osd{position:absolute;top:5%;left:6%;right:6%;display:flex;justify-content:space-between;gap:10px;font:clamp(7px,1.3vw,11px)/1.3 var(--f-osd);color:var(--osd)}
.story__nav{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.tv__screen.play{justify-content:flex-start;padding:13% 7% 8%;background:#06070c}
.tv__screen.play::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(40,60,120,.35),transparent 70%);pointer-events:none}
.roll{animation:roll 6s linear infinite}
@keyframes roll{0%,92%{transform:none}94%{transform:translateY(-6px) skewX(4deg)}96%{transform:translateY(4px)}100%{transform:none}}
.noisebar{position:absolute;left:0;right:0;height:14%;background:linear-gradient(transparent,rgba(255,255,255,.08),transparent);animation:bar 4.5s linear infinite;pointer-events:none}
@keyframes bar{from{top:-15%}to{top:110%}}

/* ===== комната ===== */
.room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.room{grid-template-columns:1fr}}
.scene{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);background:#140c07}
.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;outline:none}
.hot .hl{fill:none;stroke:transparent;stroke-width:3;transition:stroke .2s}
.hot:hover .hl,.hot:focus-visible .hl{stroke:rgba(255,215,140,.9)}
.hot.active .hl{stroke:var(--neon-2);stroke-dasharray:8 6;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-28}}
.pin{pointer-events:none}
.pin circle{fill:var(--neon);}
.pin text{font:bold 22px var(--f-body);fill:#fff}
.pin{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.lampglow{mix-blend-mode:screen;pointer-events:none}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.note{
  position:relative;background:var(--paper);color:var(--paper-ink);
  background-image:linear-gradient(rgba(70,110,200,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,200,.18) 1px,transparent 1px);
  background-size:16px 16px;
  padding:16px 16px 14px;border-radius:2px;transform:rotate(-.6deg);
  box-shadow:0 8px 20px rgba(0,0,0,.5);
  font:19px/1.3 var(--f-hand);
}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,248,200,.6);transform:rotate(3deg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.note h3{margin:0 0 6px;font:12px/1.3 var(--f-body);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8c1d22}
.note p{margin:0}
.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.obj{
  text-align:left;border:1px solid var(--line);background:rgba(255,220,160,.04);border-radius:var(--r);
  padding:8px 10px;font-size:13px;line-height:1.25;color:var(--fg);
}
.obj:hover{background:rgba(255,220,160,.1)}
.obj.active{border-color:var(--neon-2);box-shadow:0 0 0 1px var(--neon-2) inset;color:#fff}
.obj small{display:block;color:var(--fg-dim);font-size:11px}
.shelfrow{display:flex;gap:4px;flex-wrap:wrap}
.spine-mini{width:22px;height:64px;border-radius:2px;background:#1a1a1a;border:1px solid #333;position:relative}
.spine-mini.got{background:var(--c,#444);box-shadow:0 0 10px var(--c,#444)}
.spine-mini.got::after{content:"";position:absolute;left:3px;right:3px;top:8px;height:24px;background:rgba(255,255,255,.85);border-radius:1px}
.panel-h{font:11px/1.3 var(--f-body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-dim);margin:0 0 8px}

/* ===== модальное окно (предмет крупным планом) ===== */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(8,4,2,.82);backdrop-filter:blur(3px);overflow:auto}
.sheet{
  position:relative;width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;
  background:linear-gradient(#2b1d14,#1f150e);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);
  padding:22px clamp(16px,3vw,28px) 22px;
}
.sheet__head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet__head h2{margin:0;font:clamp(16px,2.6vw,22px)/1.15 var(--f-display);color:var(--fg);text-wrap:balance}
.sheet__head p{margin:4px 0 0;color:var(--fg-dim);font-size:14px}
.sheet__x{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;border-radius:50%;width:36px;height:36px;font-size:18px;line-height:1}
.sheet__foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{
  border:0;border-radius:4px;padding:10px 16px;font:700 14px/1 var(--f-body);letter-spacing:.04em;
  background:linear-gradient(#ffe39a,#f2a91a);color:#2a1300;box-shadow:0 3px 0 #7b4300;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7b4300}
.btn--dim{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn--hint{background:linear-gradient(#fff,#ffe9a0);color:#3a2000;box-shadow:0 3px 0 #9a7a20}
.msg{min-height:1.5em;font-size:14px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.hintbox{margin-top:12px;border-left:3px solid #ffd54a;background:rgba(255,213,74,.07);padding:8px 12px;font:18px/1.35 var(--f-hand);color:#ffe9a8;display:flex;flex-direction:column;gap:6px}

/* — афиша — */
.afisha{
  background:#f4ecd4;color:#1d1a3d;border-radius:3px;padding:18px clamp(12px,3vw,24px);
  box-shadow:inset 0 0 40px rgba(120,80,20,.25);
  background-image:radial-gradient(rgba(150,100,40,.12) 1px,transparent 1px);background-size:5px 5px;
}
.afisha__top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;border-bottom:3px double #1d1a3d;padding-bottom:8px;margin-bottom:10px}
.afisha__top b{font:clamp(16px,3vw,26px)/1 var(--f-display);color:#b0122a}
.afisha__top span{font:16px/1 var(--f-hand)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.slot{border:2px dashed rgba(29,26,61,.35);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.solved{border-style:solid;border-color:#1f8a46;background:rgba(31,138,70,.08)}
.slot__day{font:700 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#b0122a}
.slot__pic{font-size:30px;line-height:1.2;min-height:42px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot__rule{font:20px/1 var(--f-hand);color:#1d1a3d}
.slot input{width:100%;min-width:0;font:20px/1.2 var(--f-hand);color:var(--paper-ink);background:transparent;border:0;border-bottom:2px solid rgba(29,26,61,.4);padding:2px 0}
.slot.solved input{color:#1f8a46;border-color:transparent}
.afisha__legend{margin-top:12px;font:17px/1.3 var(--f-hand);color:#4b4672}

/* — наклейки и коробки — */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.stickers,.boxes{display:flex;flex-direction:column;gap:8px}
.sticker{
  text-align:left;border:0;border-radius:2px;padding:10px 12px;background:#fdf6d8;color:#22205a;
  font:19px/1.2 var(--f-hand);box-shadow:0 2px 0 rgba(0,0,0,.35);position:relative;
}
.sticker small{display:block;font:11px/1.3 var(--f-mono);color:#7a6a3a;margin-top:4px}
.sticker.sel{outline:3px solid var(--neon-2)}
.sticker.done{opacity:.55;text-decoration:line-through}
.vbox{
  display:flex;align-items:center;gap:10px;text-align:left;border:1px solid rgba(255,255,255,.12);
  border-radius:3px;padding:8px 10px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;
  font:700 14px/1.2 var(--f-body);text-shadow:0 1px 2px rgba(0,0,0,.7);min-height:46px;
}
.vbox i{font:10px/1 var(--f-osd);font-style:normal;opacity:.9;margin-left:auto}
.vbox.done{filter:grayscale(.6) brightness(.7)}
.vbox.flash{animation:flash .5s}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--bad)}}

/* — журнал должников — */
.ledger{background:#f2ead3;color:#1f1d4f;border-radius:2px;padding:16px clamp(12px,3vw,22px);
  background-image:linear-gradient(transparent 27px,rgba(80,110,200,.35) 28px);background-size:100% 28px;
  box-shadow:inset 6px 0 0 #c43b3b;font:19px/28px var(--f-hand)}
.ledger ol{margin:0;padding-left:22px}
.ledger li{padding-left:4px}
.ltable{width:100%;border-collapse:collapse;margin-top:14px;font:15px/1.3 var(--f-body)}
.ltable th,.ltable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.ltable th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
.ltable select{width:100%;padding:8px;background:#120c08;color:var(--fg);border:1px solid var(--line);border-radius:4px;font:15px var(--f-body)}
.tablewrap{overflow-x:auto}

/* — кассета, карандаш, трекинг — */
.cass-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:700px){.cass-wrap{grid-template-columns:1fr}}
.cass svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.meter{height:10px;border-radius:5px;background:#120c08;border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb400,#ff3ea5)}
.track{position:relative;aspect-ratio:4/3;border-radius:18px/14px;overflow:hidden;background:#06070c;border:8px solid #1a1a1a}
.track canvas{position:absolute;inset:0;width:100%;height:100%}

.dialed{font:22px/1 var(--f-osd);letter-spacing:.2em;color:var(--osd-green);background:#0b1410;padding:12px;border-radius:4px;text-align:center;min-height:46px;text-shadow:0 0 6px rgba(93,255,143,.6)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.line{font:15px/1.45 var(--f-body);padding:8px 12px;border-radius:6px;background:rgba(255,255,255,.05);max-width:92%}
.line.them{border-left:3px solid #ffb400}
.line.me{align-self:flex-end;background:rgba(54,228,255,.1);border-right:3px solid var(--neon-2)}

.choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choice{text-align:left;border:1px solid var(--line);background:rgba(255,220,160,.05);border-radius:4px;padding:9px 12px;font:15px/1.3 var(--f-body)}

/* — пятнашки — */
.fifteen{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}

.board{position:relative;width:100%;max-width:340px;aspect-ratio:1;background:#0d0805;border:10px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 20px #000,0 10px 30px rgba(0,0,0,.6);margin:0 auto}
.tile{position:absolute;width:33.333%;height:33.333%;border:0;padding:0;border-radius:3px;background-size:300% 300%;transition:left .14s,top .14s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.2)}
.tile span{position:absolute;top:4px;left:6px;font:12px/1 var(--f-osd);color:#fff;text-shadow:0 1px 2px #000;display:none}
.board.nums .tile span{display:block}
.board.peek::after{content:"";position:absolute;inset:0;background:var(--img) center/cover;border-radius:3px}

}

}
.spine:hover{transform:translateY(-4px)}

const screen = $("#screen"), modal = $("#modal"), sheet = $("#sheet"), deck = $("#deck");
let timers = [];

const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
let staticTimer = null;

function toast(txt, ms = 2600) {
  const t = $("#toast"); t.textContent = txt; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms);
}
function flash() { const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function updDeck() {
  $("#wrapN").textContent = S.wraps;
  $("#lcdCount").textContent = S.year;
  const v = $("#vcrTxt"); if (v) v.textContent = S.year;
}
function setMode(m) { $("#lcdMode").textContent = m; }

let onClose = null;
function openSheet({ title, sub, body, hint, wide, closable = true, after }) {
  sheet.innerHTML = "";
  sheet.style.width = wide ? "min(980px,100%)" : "";
  const head = h("div", { class: "sheet__head" },
    h("div", {}, h("h2", { id: "sheetTitle" }, title), sub ? h("p", {}, sub) : null),
    closable ? h("button", { class: "sheet__x", type: "button", "aria-label": "Закрыть", onclick: closeSheet }, "×") : null
  );
  sheet.append(head, body);
  if (hint) sheet.append(hintBlock(hint));
  modal.hidden = false; modal.dataset.closable = closable ? "1" : "";
  onClose = after || null;
  const f = sheet.querySelector("input,button:not(.sheet__x),select"); if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  A.click();
}
function closeSheet() {
  modal.hidden = true; sheet.innerHTML = ""; A.stopWhirr();
  const cb = onClose; onClose = null; if (cb) cb();
}
modal.addEventListener("click", e => { if (e.target === modal && modal.dataset.closable) closeSheet(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden && modal.dataset.closable) closeSheet(); });

function hintBlock(key) {
  const wrap = h("div", {});
  const box = h("div", { class: "hintbox", hidden: true });
  const btn = h("button", { class: "btn btn--hint", type: "button" });
  const list = HINTS[key];
  const paint = () => {
    const n = S.hintIdx[key] || 0;
    box.innerHTML = "";
    for (let i = 0; i < n; i++) { const v = list[i]; box.append(h("div", {}, "— " + (typeof v === "function" ? v() : v))); }
    box.hidden = n === 0;
    btn.hidden = n >= list.length;
    btn.textContent = S.wraps > 0 ? `Подсказка Гоши · 1 вкладыш (${n + 1}/${list.length})` : `Подсказка в долг у Вовки (${n + 1}/${list.length})`;
  };
  btn.addEventListener("click", () => {
    const n = S.hintIdx[key] || 0; if (n >= list.length) return;
    if (S.wraps > 0) S.wraps--; else S.debt++;
    S.hints++; S.hintIdx[key] = n + 1; save(); updDeck(); paint(); A.page();
    if (key === "fifteen" && n + 1 === list.length && FIFTEEN.solveNow) FIFTEEN.solveNow();
  });
  paint();
  wrap.append(h("div", { class: "sheet__foot" }, btn), box);
  return wrap;
}
function giveCard() {
  const c = CARDS[S.cards.length % CARDS.length];
  S.cards.push(c.n); S.wraps++; save(); updDeck();
  toast(`+1 вкладыш Turbo №${c.n} · ${c.car}`);
}
function giveTape(id) { if (!S.tapes.includes(id)) S.tapes.push(id); save(); }

(function grain() {
  const c = $("#grain"), x = c.getContext("2d"); c.width = 160; c.height = 100;
  c.style.width = "100%"; c.style.height = "100%";
  const draw = () => {
    const d = x.createImageData(160, 100);

    x.putImageData(d, 0, 0);
  };
  draw(); if (!RM) setInterval(draw, 110);
})();

function newGame() {
  S = fresh(); S.t0 = Date.now(); save(); updDeck();
  playStory(PROLOGUE, () => showNote());
}
function resume() {
  updDeck();
  if (S.ch >= 12) renderCredits(); else if (S.ch < 1) newGame(); else renderRoom();
}

function playStory(story, done, opts = {}) {
  clearTimers(); stopRoomFx(); closeSheetSilently();
  deck.hidden = false; setMode(story.osd[0].includes("PLAY") ? "PLAY ►" : story.osd[0].includes("FF") ? "FF ►►" : "STOP ■");
  flash(); A.clunk(); if (!opts.quiet) A.hiss(.5);
  let i = 0, typing = false, full = "";
  const text = h("div", { class: "story__text", "aria-live": "polite" });
  const glass = h("div", { class: "tv__glass" },
    h("div", { class: "tv__screen play scan" + (RM ? "" : " roll") },
      h("div", { class: "story__osd" }, h("span", { class: "blink" }, story.osd[0]), h("span", {}, story.osd[1])),
      text
    ),
    h("div", { class: "noisebar" }), h("div", { class: "tv__glare" }), h("div", { class: "tv__curve" })
  );
  const next = h("button", { class: "btn-play", type: "button" }, "► ДАЛЬШЕ");
  const skip = h("button", { class: "btn-ghost", type: "button" }, "⏩ ВСЁ СРАЗУ");
  const counter = h("span", { class: "lcd" }, "");
  screen.innerHTML = "";
  screen.append(h("div", { class: "story wrap" }, h("div", { style: "width:min(860px,100%)" },
    h("div", { class: "tv" }, glass, h("div", { class: "tv__panel" }, h("span", { class: "tv__brand" }, "РУБИН"), h("span", { class: "tv__grille" }), counter, h("span", { class: "knob" }))),
    h("div", { class: "story__nav" }, skip, next)
  )));
  const show = () => {
    full = story.pages[i]; text.textContent = ""; counter.textContent = `${i + 1}/${story.pages.length}`;
    next.textContent = i === story.pages.length - 1 ? (opts.last || "■ STOP") : "► ДАЛЬШЕ";
    if (RM) { text.textContent = full; return; }
    typing = true; let k = 0;
    const step = () => {
      if (!typing) return;
      k += 2; text.textContent = full.slice(0, k);
      if (k % 12 === 0) A.tick();
      if (k < full.length) later(step, 22); else typing = false;
    };
    step();
  };
  next.addEventListener("click", () => {
    if (typing) { typing = false; text.textContent = full; return; }
    A.page();
    if (i < story.pages.length - 1) { i++; show(); } else { setMode("STOP ■"); done && done(); }
  });
  skip.addEventListener("click", () => { typing = false; text.textContent = full; });
  show(); next.focus({ preventScroll: true });
  scrollTo({ top: 0 });
}
function closeSheetSilently() { modal.hidden = true; sheet.innerHTML = ""; onClose = null; A.stopWhirr(); }

  sheet.append(foot);
}

const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]/g, "");
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

  { t: "Терминатор 2", y: 1991, l: "О", c: "#5a6470" },
  { t: "Парк Юрского периода", y: 1993, l: "Т", c: "#c9a200" },
  { t: "Титаник", y: 1997, l: "К", c: "#1b4f8a" },
  { t: "Матрица", y: 1999, l: "А", c: "#1f8a46" }
];
function puzzleSort() {
  let order = shuffle(SHELF.map((_, i) => i)); while (order.every((v, i) => v === i)) order = shuffle(order);
  let sel = -1, won = false;
  const shelf = h("div", { class: "shelf" }), word = h("div", { class: "word", "aria-label": "Буквы на корешках по порядку" });
  const msg = h("p", { class: "msg" }, "Щёлкни по кассете, потом по другой — они поменяются местами.");
  const paint = () => {
    shelf.innerHTML = ""; word.innerHTML = "";
    order.forEach((si, pos) => {
      const s = SHELF[si];
      const b = h("button", { class: "spine" + (pos === sel ? " sel" : ""), type: "button", style: `--c:${s.c}`, "aria-label": `${s.t}, позиция ${pos + 1}` },
        h("span", { class: "spine__l" }, s.l), h("span", { class: "spine__t" }, s.t), h("span", { class: "spine__y" }, won ? s.y : ""));
      b.addEventListener("click", () => {
        if (won) return;
        if (sel < 0) { sel = pos; A.click(); }
        else if (sel === pos) sel = -1;
        else { [order[sel], order[pos]] = [order[pos], order[sel]]; sel = -1; A.tick(); }
        paint(); shelf.children[pos].focus();
      });
      shelf.append(b);
      word.append(h("b", { class: won ? "on" : "" }, s.l));
    });
  };
  const check = h("button", { class: "btn", type: "button" }, "Проверить порядок");
  check.addEventListener("click", () => {
    const right = order.filter((v, i) => v === i).length;
    if (right === 9) { won = true; paint(); A.big(); msg.className = "msg ok"; msg.textContent = "1980 → 1999. Буквы вспыхнули: ПЕРЕМОТКА."; later(winSort, 1600); }
    else { A.bad(); S.miss++; save(); msg.className = "msg bad"; msg.textContent = `На своём месте: ${right} из 9.`; }
  });
  paint();
  const body = h("div", {}, h("p", { style: "margin-top:0;font-size:16px" }, "Девять кассет с новыми надписями. Расставь слева направо: от самой старой к самой новой по году выхода."), shelf, word, h("div", { class: "sheet__foot" }, check), msg);
  openSheet({ title: "Стеллаж: по годам", sub: "Буквы на корешках сложатся в команду.", body, hint: "sort", wide: true });
}
function winSort() {
  if (S.ch !== 10) return;
  S.ch = 11; giveCard(); save(); closeSheetSilently(); renderRoom();
  toast("Слово — команда. К видику: зажми ◄◄.", 4000);
}

/* ================= ФИНАЛ ================= */
function finale() {
  let y = S.year >= 1991 ? Math.max(S.year, 1999) : 1999, hold = false, timer = null, done = false;
  const cnt = h("div", { class: "bigcount", "aria-live": "polite" }, y);
  const btn = h("button", { class: "holdbtn", type: "button" }, "◄◄ REW · держать");
  const msg = h("p", { class: "msg" }, "Зажми и держи. Отпустишь раньше — Гошу отбросит обратно.");
  const pills = h("div", { class: "pills", hidden: true });
  const tickF = () => {
    if (done) return;
    if (hold) { y--; A.setWhirr(160 + (1999 - y) * 30); }
    else if (y < 1999) y++;
    cnt.textContent = y; S.year = y; updDeck();
    if (y <= 1991) { done = true; stop(); A.big(); flash(); finish(); return; }
    if (!hold && y >= 1999) { clearInterval(timer); timer = null; }
  };
  const start = e => { if (done) return; e && e.preventDefault(); hold = true; btn.classList.add("on"); sheet.classList.add("shake"); A.startWhirr(160); setMode("REW ◄◄"); msg.className = "msg"; msg.textContent = "Мотает… не отпускай!"; if (!timer) timer = setInterval(tickF, RM ? 300 : 520); };
  const stop = () => { if (!hold) return; hold = false; btn.classList.remove("on"); sheet.classList.remove("shake"); A.stopWhirr(); setMode("STOP ■"); if (!done) { msg.className = "msg bad"; msg.textContent = "Отпустил! Счётчик ползёт назад к 1999-му. Жми снова."; } };
  btn.addEventListener("pointerdown", start); ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
  btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); });
  btn.addEventListener("contextmenu", e => e.preventDefault());
  function finish() {
    clearInterval(timer); sheet.classList.remove("shake");
    btn.hidden = true; msg.className = "msg ok"; msg.textContent = "1991. Видик щёлкнул и замер. На экране «Рубина» две кнопки — как две таблетки.";
    pills.hidden = false;
  }
  pills.append(
    h("button", { class: "pill pill--blue", type: "button", onclick: () => endGame("blue") }, "◄◄ Остановить на 1991-м и вернуть Гошу"),
    h("button", { class: "pill pill--red", type: "button", onclick: () => endGame("red") }, "►► Одним глазом глянуть, что будет дальше")
  );
  const body = h("div", { class: "rew" }, h("p", { class: "panel-h", style: "margin:0" }, "Счётчик «Электроники»"), cnt, btn, msg, pills);
  openSheet({ title: "ПЕРЕМОТКА", sub: "Команда принята. Остался один шаг.", body, closable: true, after: () => { clearInterval(timer); A.stopWhirr(); sheet.classList.remove("shake"); if (!done) { S.year = 1999; save(); updDeck(); } } });
}
function endGame(kind) {
  S.ending = kind; S.year = 1991; S.ch = 12; S.t1 = Date.now(); save(); updDeck(); closeSheetSilently();
  if (kind === "red") { S.peeked = true; save(); playStory(ENDING_RED, () => playStory(ENDING_BLUE, renderCredits, { last: "КОНЕЦ ФИЛЬМА" }), { last: "◄◄ НАЗАД В 1991" }); }
  else playStory(ENDING_BLUE, renderCredits, { last: "КОНЕЦ ФИЛЬМА" });
}

/* ================= ТИТРЫ ================= */
function renderCredits() {
  clearTimers(); stopRoomFx(); deck.hidden = false; setMode("STOP ■"); updDeck();
  const secs = Math.max(0, Math.round(((S.t1 || Date.now()) - (S.t0 || Date.now())) / 1000));
  const mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, "0");
  const score = 100 - S.hints * 6 - S.miss * 2 - S.debt * 4;
  const rank = score >= 85 ? ["Почётный киномеханик «Космоса»", "Гоша выдаёт тебе запасной ключ и личную прищепку."]
    : score >= 65 ? ["Завсегдатай второго ряда", "Пускают на сеанс после десяти. Иногда."]
    : score >= 40 ? ["Зритель с первого сеанса", "Кино знаешь. Вкладыши тратишь щедро."]
    : ["Безбилетник с душой", "Зато Гоша дома. А это главное."];
  screen.innerHTML = "";
  screen.append(h("div", { class: "wrap credits" },
    h("div", { class: "tv" }, h("div", { class: "tv__glass" }, h("div", { class: "tv__screen blue scan" },
      h("div", { class: "osd-top" }, h("span", {}, "■ STOP"), h("span", {}, "END")),
      h("h1", { class: "logo", style: "font-size:clamp(24px,6vw,52px)" }, "КОНЕЦ ФИЛЬМА"),
      h("p", { class: "logo-sub" }, "ПЕРЕВОД — ДЯДЯ ГОША · ПРОКАТ — «КОСМОС»")
    ), h("div", { class: "tv__glare" }), h("div", { class: "tv__curve" })),
      h("div", { class: "tv__panel" }, h("span", { class: "tv__brand" }, "РУБИН"), h("span", { class: "tv__grille" }), h("span", { class: "knob" }))),
    h("div", { class: "stats" },
      h("div", {}, h("b", {}, `${mm}:${ss}`), h("span", {}, "время в салоне")),
      h("div", {}, h("b", {}, S.hints), h("span", {}, "подсказок Гоши")),
      h("div", {}, h("b", {}, S.miss), h("span", {}, "промахов"))),
    h("p", { class: "rank" }, rank[0]), h("p", { style: "color:var(--fg-dim)" }, rank[1] + (S.peeked ? " И ты видел 2026-й. Никому не рассказывай." : "")),
    h("div", { class: "title__actions" },
      h("button", { class: "btn", type: "button", onclick: () => renderRoom() }, "Побродить по салону"),
      h("button", { class: "btn btn--dim", type: "button", onclick: openBook }, "Блокнот"),
      h("button", { class: "btn btn--dim", type: "button", onclick: () => { S = fresh(); save(); renderTitle(); } }, "◄◄ Сначала"))
  ));
  scrollTo({ top: 0 });
}

/* ================= БЛОКНОТ ================= */
function openBook() {
  const tapes = S.msgs.slice().sort().map(n => h("div", { class: "tape" }, h("h4", {}, `${TAPES[MSG[n].tape].t} · ${MSG[n].osd[1]}`), h("div", {}, MSG[n].pages.join("\n\n"))));
  const cards = S.cards.map(n => { const c = CARDS.find(x => x.n === n); return h("div", { class: "wcard" }, h("b", {}, "TURBO №" + c.n), h("i", { style: `--car:${c.c}` }), h("span", {}, c.car)); });
  const body = h("div", { class: "book" },
    h("div", { class: "note", style: "transform:none" }, h("h3", {}, "Сейчас"), h("p", {}, GOALS[S.ch] || "Нажми ► PLAY.")),
    h("div", {}, h("p", { class: "panel-h" }, "Вкладыши Turbo"), cards.length ? h("div", { class: "wrapcards" }, cards) : h("p", { style: "color:var(--fg-dim);margin:0" }, `Пока только три безымянных из банки. Новые лежат в коробках с кассетами.`)),
    h("div", {}, h("p", { class: "panel-h" }, "Записи Гоши"), tapes.length ? tapes : h("p", { style: "color:var(--fg-dim);margin:0" }, "Ещё ни одной. Сначала найди кассету.")),
    h("details", {}, h("summary", { style: "cursor:pointer;color:var(--fg-dim)" }, "Записка в клетку"), h("p", { style: "white-space:pre-wrap;font-family:var(--f-hand);font-size:19px" }, NOTE))
  );
  openSheet({ title: "Блокнот", sub: `Подсказок взято: ${S.hints}${S.debt ? ` (в долг у Вовки: ${S.debt})` : ""} · промахов: ${S.miss}`, body, wide: true });
}

/* ================= ПАНЕЛЬ ================= */
$("#kBook").addEventListener("click", openBook);
$("#kSound").addEventListener("click", e => { A.on = !A.on; if (!A.on) A.stopWhirr(); e.currentTarget.setAttribute("aria-pressed", A.on); if (A.on) A.click(); });
$("#kEject").addEventListener("click", () => { A.clunk(); closeSheetSilently(); renderTitle(); });

/* ================= СТАРТ ================= */
const boot = data => {
  if (data && data.S) { S = Object.assign(fresh(), data.S); save(); }
  updDeck();
  if (data && data.S && S.ch >= 1) resume(); else renderTitle();
};
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
