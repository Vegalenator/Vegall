<!DOCTYPE html>
<meta charset="utf-8">
<title>Атласы героев «Света и Тени»</title>
<!--
  Собирает svet-i-ten/art/hero-luma.webp и hero-nox.webp из концепт-артов:
  вырезает героя из белого фона и раскладывает на части (туловище, бёдра, голени).
  Открыть через локальный сервер из корня репозитория:
    python3 -m http.server  →  http://localhost:8000/build/svet-atlas.html
  и сохранить файлы по ссылкам в svet-i-ten/art/. Координаты суставов — SPR в game.js.
-->
<body style="margin:0;background:#1a1d36"><script>
function cut(src){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{
  const w=img.width,h=img.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h),p=d.data; const bg=new Uint8Array(w*h);
  const white=i=>{const r=p[i*4],gg=p[i*4+1],b=p[i*4+2];return Math.min(r,gg,b)>222 && Math.max(r,gg,b)-Math.min(r,gg,b)<26;};
  const st=[];for(let x=0;x<w;x++){st.push(x,(h-1)*w+x);}for(let y=0;y<h;y++){st.push(y*w,y*w+w-1);}
  while(st.length){const i=st.pop();if(bg[i]||!white(i))continue;bg[i]=1;const x=i%w,y=(i/w)|0;if(x>0)st.push(i-1);if(x<w-1)st.push(i+1);if(y>0)st.push(i-w);if(y<h-1)st.push(i+w);}
  let x0=w,y0=h,x1=0,y1=0;
  for(let i=0;i<w*h;i++){ if(bg[i]){p[i*4+3]=0;continue;}
    const x=i%w,y=(i/w)|0; let nb=0; for(const o of [-1,1,-w,w]) if(bg[i+o]) nb++;
    if(nb){ const r=p[i*4],gg=p[i*4+1],b=p[i*4+2]; const m=Math.min(r,gg,b); p[i*4+3]=m>200?Math.max(0,255-(m-200)*4.6):255; }
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y; }
  g.putImageData(d,0,0);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,-x0,-y0);
  res({url:o.toDataURL('image/png'),w:o.width,h:o.height,box:[x0,y0,x1,y1]}); }; img.src=src; }); }

const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
function canvasOf(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);return c;}
function shrink(c,w,h){let cur=c;while(cur.width/2>w*1.02){const n=document.createElement('canvas');n.width=Math.round(cur.width/2);n.height=Math.round(cur.height/2);const g=n.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cur,0,0,n.width,n.height);cur=n;}
  const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cur,0,0,w,h);return o;}
function parts(img,cls,n){ // cls(x,y,r,g,b)-> индекс части или -1
  const w=img.width,h=img.height,src=canvasOf(img),d=src.getContext('2d').getImageData(0,0,w,h),p=d.data;
  const outs=[...Array(n)].map(()=>new ImageData(w,h));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(!p[i+3])continue;
    const k=cls(x,y,p[i],p[i+1],p[i+2],p[i+3]);if(k<0)continue;
    const ks=Array.isArray(k)?k:[k];for(const kk of ks){const o=outs[kk].data;o[i]=p[i];o[i+1]=p[i+1];o[i+2]=p[i+2];o[i+3]=p[i+3];}}
  return outs.map(od=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(od,0,0);return c;});}
function atlas(cs,H){const s=H/cs[0].height,W=Math.round(cs[0].width*s);const a=document.createElement('canvas');a.width=W*cs.length;a.height=H;const g=a.getContext('2d');
  cs.forEach((c,i)=>g.drawImage(shrink(c,W,H),i*W,0));return {url:a.toDataURL('image/webp',0.92),W,H,s};}
(async()=>{
  const L=await load((await cut('../svet-i-ten/art/luma.webp')).url),N=await load((await cut('../svet-i-ten/art/nox.webp')).url);
  const white=(r,g,b,m)=>Math.min(r,g,b)>m&&Math.max(r,g,b)-Math.min(r,g,b)<26;
  const tights=(x,r,g,b)=>!(r>120&&r-b>90&&b<110);
  const lp=parts(L,(x,y,r,g,b)=>{
    if(y<275&&!(x>165&&x<335&&y>85&&y<215)&&white(r,g,b,228))return -1;
    if(y<690)return 0;
    const leg=y>805||(tights(x,r,g,b)&&x>=120&&x<=365);
    if(!leg)return 0;
    const right=x>=252, ks=[];
    if(y<=962)ks.push(right?3:1);
    if(y>=945)ks.push(right?4:2);
    return ks;},5);
  const np=parts(N,(x,y,r,g,b)=>{
    if(y>930&&white(r,g,b,222))return -1;
    if(y<890)return 0;
    const u=Math.min(1,(y-890)/200),lo=250-130*u,hi=470+70*u;
    if(y<1090&&(x<lo||x>hi))return 0;
    const split=y<1090?340:305;
    return x<split?1:2;},3);
  window.R={luma:atlas(lp,184),nox:atlas(np,232)};document.title='ok';
  for(const n of ['luma','nox']){const a=document.createElement('a');a.href=R[n].url;a.download='hero-'+n+'.webp';a.textContent='hero-'+n+'.webp ('+R[n].W+'×'+R[n].H+')';a.style.cssText='display:block;color:#fff;font:16px sans-serif;margin:12px';document.body.appendChild(a);}})();
</script></body>
