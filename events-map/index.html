<title>Карта событий</title>
<meta name="description" content="Редакционный календарь событий: заседания, выборы, форумы и публикации данных со статусом даты, повесткой, сценариями и итогами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Карта событий — лист консалтингового отчёта.
   Две колонки: слева лента дней, справа постоянно открытая карточка выбранного события.
   На узком экране карточка выезжает листом поверх ленты. Один акцент (глубокий ультрамарин),
   статусы — приглушённые и кодируются ещё и формой знака. */
:root {
  --ground:#eef0f3;            /* фон вокруг листа */
  --sheet:#ffffff;             /* лист */
  --sheet-2:#f6f7f9;           /* тихая подложка внутри листа */
  --glass:rgba(255,255,255,.72);
  --scrim:rgba(18,24,38,.28);
  --ink:#131a26;               /* основной текст */
  --ink-2:#4b5363;             /* вторичный */
  --muted:#8a91a0;             /* подписи */
  --hair:rgba(19,26,38,.09);   /* волосяные линии */
  --hair-2:rgba(19,26,38,.16);
  --accent:#243f9c;            /* ультрамарин */
  --accent-2:rgba(36,63,156,.08);
  --accent-3:rgba(36,63,156,.16);
  --st-confirmed:#1f7a52;
  --st-preliminary:#a3690f;
  --st-expected:#6d7686;
  --st-cancelled:#a8423a;
  --live:#c8412c;
  --shadow-lg:0 24px 60px -20px rgba(18,24,38,.35), 0 2px 8px rgba(18,24,38,.06);
  --shadow-sm:0 1px 2px rgba(18,24,38,.05), 0 4px 16px -8px rgba(18,24,38,.10);

  --ff-display:'Source Serif 4', 'PT Serif', Georgia, 'Times New Roman', serif;
  --ff-ui:'Golos Text', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --ff-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,.8,.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0a0d13; --sheet:#11151d; --sheet-2:#161b25; --glass:rgba(17,21,29,.72); --scrim:rgba(0,0,0,.5);
    --ink:#eceff4; --ink-2:#b4bbc7; --muted:#7c8493; --hair:rgba(236,239,244,.08); --hair-2:rgba(236,239,244,.15);
    --accent:#8ea6ff; --accent-2:rgba(142,166,255,.09); --accent-3:rgba(142,166,255,.18);
    --st-confirmed:#5cc493; --st-preliminary:#e3a84a; --st-expected:#98a1b0; --st-cancelled:#ec8a7f; --live:#ff7a62;
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --ground:#0a0d13; --sheet:#11151d; --sheet-2:#161b25; --glass:rgba(17,21,29,.72); --scrim:rgba(0,0,0,.5);
  --ink:#eceff4; --ink-2:#b4bbc7; --muted:#7c8493; --hair:rgba(236,239,244,.08); --hair-2:rgba(236,239,244,.15);
  --accent:#8ea6ff; --accent-2:rgba(142,166,255,.09); --accent-3:rgba(142,166,255,.18);
  --st-confirmed:#5cc493; --st-preliminary:#e3a84a; --st-expected:#98a1b0; --st-cancelled:#ec8a7f; --live:#ff7a62;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:var(--toph,110px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ff-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:var(--accent);text-decoration-color:var(--accent-3);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.caps{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500}

/* ------------------------------------------------------- шапка из стекла */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--hair)}
.top-in{max-width:1440px;margin:0 auto;padding:14px 28px 0;display:grid;gap:12px}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:14px;min-width:0}
.mark h1{margin:0;font-family:var(--ff-display);font-weight:500;font-size:24px;letter-spacing:-.01em;line-height:1}
.mark .caps{white-space:nowrap}
.grow{flex:1 1 auto}
.status{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-2)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--st-confirmed);display:inline-block;margin-right:7px;box-shadow:0 0 0 3px color-mix(in srgb, var(--st-confirmed) 18%, transparent)}
.status .dot.stale{background:var(--st-preliminary);box-shadow:0 0 0 3px color-mix(in srgb, var(--st-preliminary) 18%, transparent)}
.status .dot.off{background:var(--muted);box-shadow:none}
.ghost{font-size:12px;color:var(--ink-2);padding:6px 10px;border-radius:6px;transition:background .2s,color .2s}
.ghost:hover{background:var(--accent-2);color:var(--ink)}

.nav{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.tabs{position:relative;display:flex;gap:26px}
.tabs button{padding:8px 0 12px;font-size:14px;color:var(--ink-2);transition:color .2s;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500}
.tabs button sup{font-family:var(--ff-mono);font-size:10px;color:var(--muted);margin-left:4px;vertical-align:super}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.search{margin-left:auto;margin-bottom:8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair-2);padding:4px 2px;min-width:0;flex:0 1 260px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);width:100%;min-width:0;outline:none}

/* --------------------------------------------------------------- каркас */
.wrap{max-width:1440px;margin:0 auto;padding:22px 28px 40px;display:grid;grid-template-columns:minmax(440px,5fr) minmax(0,6fr);gap:22px;align-items:start}
.sheet{background:var(--sheet);border-radius:10px;box-shadow:var(--shadow-sm);min-width:0}

/* ---- темы */
.topics{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--hair)}
.topics .caps{margin-right:8px}
.tgl{font-size:12.5px;color:var(--ink-2);padding:5px 11px;border-radius:999px;transition:background .25s,color .25s,box-shadow .25s}
.tgl:hover{color:var(--ink);background:var(--sheet-2)}
.tgl[aria-pressed="true"]{color:var(--accent);background:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent-3)}
.tgl .c{font-family:var(--ff-mono);font-size:10px;color:var(--muted);margin-left:5px}
.tgl.clear{color:var(--muted)}

/* ---- лента */
.feed{padding:4px 0 10px}
.day{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 6px;padding:16px 14px 6px 20px}
.day + .day{border-top:1px solid var(--hair)}
.dh{position:sticky;top:calc(var(--toph,110px) + 12px);align-self:start;padding-top:8px}
.dh .d{font-family:var(--ff-display);font-size:34px;line-height:.9;font-weight:400;letter-spacing:-.03em}
.dh .mw{margin-top:6px}
.dh .rel{font-size:12px;color:var(--ink-2);margin-top:2px}
.dh.now .d{font-size:19px;line-height:1.1;color:var(--live)}
.dh.nodate .d{font-size:17px;line-height:1.15}
.rows{min-width:0}
.row{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) 16px;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 12px 12px 10px;border-radius:8px;transition:background .25s var(--ease)}
.row + .row{box-shadow:0 -1px 0 var(--hair)}
.row:hover{background:var(--sheet-2)}
.row:hover + .row,.row:hover{box-shadow:none}
.row:hover .go{opacity:1;transform:translateX(0)}
.row.cancelled .t{text-decoration:line-through;text-decoration-color:var(--st-cancelled);color:var(--ink-2)}
.row[aria-current="true"]{background:var(--accent-2)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent);animation:barIn .3s var(--ease) both}
@keyframes barIn{from{transform:scaleY(0)}to{transform:none}}
.row[aria-current="true"] .go{opacity:1;transform:none;color:var(--accent)}
.row[aria-current="true"] + .row,.row + .row[aria-current="true"]{box-shadow:none}
.row.enter{animation:rowIn .45s var(--ease) both}
@keyframes rowIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.tm{display:grid;gap:3px;padding-top:1px}
.tm .h{font-family:var(--ff-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tm .h.approx{color:var(--st-preliminary)}
.tm .h.none{font-family:var(--ff-ui);font-size:12px;font-weight:400;font-style:italic;color:var(--st-expected);line-height:1.3}
.st{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;color:var(--c);white-space:nowrap}
.st svg{flex:none}
.s-confirmed{--c:var(--st-confirmed)} .s-preliminary{--c:var(--st-preliminary)} .s-expected{--c:var(--st-expected)} .s-cancelled{--c:var(--st-cancelled)}
.t{font-size:14.5px;font-weight:500;line-height:1.35;letter-spacing:-.005em;text-wrap:balance}
.sub{margin-top:4px;font-size:12.5px;color:var(--muted)}
.gist{margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.flags{display:inline-flex;gap:6px;margin-left:8px;vertical-align:2px}
.flag{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;padding:2px 7px;border-radius:999px;white-space:nowrap}
.flag.live{color:#fff;background:var(--live);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 40%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.flag.await{color:var(--accent);background:var(--accent-2)}
.flag.risk{color:var(--st-cancelled);background:color-mix(in srgb,var(--st-cancelled) 10%,transparent)}
.go{color:var(--muted);opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s var(--ease);padding-top:2px}

.empty{padding:56px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--ff-display);font-weight:500;font-size:20px;color:var(--ink);margin-bottom:6px}

/* ------------------------------------------------------------- панель */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1}
.detail{position:sticky;top:calc(var(--toph,110px) + 22px);height:calc(100vh - var(--toph,110px) - 44px);display:flex;flex-direction:column;overflow:hidden;padding:0}
.dr-top{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 26px;border-bottom:1px solid var(--hair)}
.dr-top .caps{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drClose{display:none}
.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);transition:background .2s,color .2s}
.icon:hover{background:var(--accent-2);color:var(--ink)}
.icon:disabled{opacity:.3;cursor:default;background:none}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:24px 30px 36px;display:grid;gap:26px;align-content:start}
.dr-body.swap > *{animation:secIn .42s var(--ease) both}
.dr-body.swap > *:nth-child(2){animation-delay:.03s}.dr-body.swap > *:nth-child(3){animation-delay:.06s}.dr-body.swap > *:nth-child(4){animation-delay:.09s}.dr-body.swap > *:nth-child(n+5){animation-delay:.12s}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero .k{font-size:12.5px;color:var(--muted)}
.hero h2{margin:6px 0 14px;font-family:var(--ff-display);font-weight:500;font-size:28px;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.when{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.when .big{font-family:var(--ff-mono);font-size:16px;font-weight:500;letter-spacing:-.01em}
.when .big.none{font-family:var(--ff-ui);font-style:italic;font-weight:400;color:var(--st-expected)}
.lab{margin:0 0 10px;display:flex;align-items:center;gap:10px}
.lab::after{content:"";flex:1;height:1px;background:var(--hair)}
.air{position:relative;padding:16px 18px 16px 20px;border-radius:10px;background:var(--accent-2)}
.air::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c,var(--accent))}
.air p{margin:0;font-family:var(--ff-display);font-size:17px;line-height:1.45}
.air .row2{display:flex;align-items:center;gap:10px;margin-top:10px}
.air .hint{font-size:12px;color:var(--ink-2);flex:1}
.pillbtn{font-size:12px;padding:6px 12px;border-radius:999px;color:var(--accent);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--accent-3);transition:background .2s,box-shadow .2s;white-space:nowrap}
.pillbtn:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.pillbtn[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink)}
.items{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.items li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:baseline;font-size:13.5px}
.bs{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;white-space:nowrap}
.bs.agenda{color:var(--st-confirmed)}
.bs.analysis{color:var(--muted)}
.bs.analysis::after{content:" ~"}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.three > div{padding:2px 16px 2px 0;font-size:13px;min-width:0}
.three > div + div{padding-left:16px;border-left:1px solid var(--hair)}
.three b{display:block;margin-bottom:5px}
.cp{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font-size:13.5px}
.cp .w{font-family:var(--ff-mono);font-size:12.5px;color:var(--accent)}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:13px}
.outcome{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1.3fr) 20px minmax(0,1fr);align-items:stretch;border-radius:10px;background:var(--sheet-2);padding:16px 14px}
.outcome .arr{display:grid;place-items:center;color:var(--muted)}
.outcome > div{min-width:0;font-size:13px}
.outcome b{display:block;margin-bottom:6px}
.outcome .dec{color:var(--ink)}
.outcome .dec b{color:var(--st-confirmed)}
.outcome ul{margin:0;padding-left:15px;display:grid;gap:4px}
.small{font-size:11.5px;color:var(--muted);margin-top:8px}
.pending{padding:14px 16px;border-radius:10px;border:1px dashed var(--accent-3);font-size:13px;color:var(--ink-2)}
.dr-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 26px;border-top:1px solid var(--hair)}

.legend{display:grid;gap:14px}
.legend div{display:grid;gap:3px}
.legend p{margin:0;font-size:13px;color:var(--ink-2)}
.legend .ex{font-family:var(--ff-mono);font-size:11.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:13px;transition:opacity .25s,transform .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;z-index:51;top:0;right:0;bottom:0;left:auto;width:min(640px,100vw);height:auto;border-radius:0;box-shadow:var(--shadow-lg);transform:translateX(104%);transition:transform .42s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .detail.open{transform:none}
  .detail.closing{transition:transform .28s var(--ease-in)}
  #drClose{display:grid}
  .row[aria-current="true"]{background:none}
  .row[aria-current="true"]::before{display:none}
}
@media (max-width:720px){
  .top-in{padding:12px 16px 0}
  .wrap{padding:16px 16px 60px;gap:20px}
  .mark .caps{display:none}
  .status .clock{display:none}
  .search{flex:1 1 100%;margin-left:0}
  .topics{padding-left:16px;padding-right:16px}
  .day{grid-template-columns:minmax(0,1fr);padding:14px 10px 6px}
  .dh{position:static;display:flex;align-items:baseline;gap:10px;padding:0 6px 6px}
  .dh .d{font-size:26px}
  .dh .mw,.dh .rel{margin:0}
  .row{grid-template-columns:62px minmax(0,1fr) 14px;gap:10px;padding:11px 6px}
  .dr-body{padding:20px 18px 32px}
  .hero h2{font-size:23px}
  .three,.outcome{grid-template-columns:minmax(0,1fr)}
  .three > div + div{border-left:0;padding-left:0;padding-top:10px;margin-top:10px;border-top:1px solid var(--hair)}
  .outcome .arr{transform:rotate(90deg);padding:4px 0}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .items li{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="4" fill="var(--st-expected)" opacity=".55"/></pattern>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <div class="bar">
      <div class="mark"><h1>Карта событий</h1><span class="caps">редакционный календарь · время московское</span></div>
      <div class="grow"></div>
      <div class="status">
        <span class="clock mono" id="clock">—</span>
        <span id="autorun"><i class="dot off"></i>автоитоги</span>
        <button class="ghost" type="button" id="helpBtn">Как читать</button>
        <button class="ghost" type="button" id="themeBtn" aria-label="Сменить тему">Тема</button>
      </div>
    </div>
    <nav class="nav" aria-label="Горизонт">
      <div class="tabs" role="tablist" id="tabs"></div>
      <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Страна, орган, тема" aria-label="Поиск по событиям"></label>
    </nav>
  </div>
</header>

<div class="wrap">
  <main class="sheet" id="sheet">
    <div class="topics" id="topics"></div>
    <div class="feed" id="feed" aria-live="polite">
      <div class="empty"><b>Загружаю события</b>Карточки хранятся в базе терминала и обновляются автоматически.</div>
    </div>
  </main>
  <aside class="sheet detail" id="detail" aria-labelledby="drTitle">
    <div class="dr-top">
      <span class="caps" id="drCrumb">Событие</span>
      <button class="icon" type="button" id="drPrev" aria-label="Предыдущее событие" title="Предыдущее (↑)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 10l5-5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" type="button" id="drNext" aria-label="Следующее событие" title="Следующее (↓)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" type="button" id="drClose" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="dr-body" id="drBody"><div class="empty"><b>Карточка события</b>Выберите событие в списке слева.</div></div>
    <div class="dr-foot" id="drFoot" hidden></div>
  </aside>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const MSK = 'Europe/Moscow';
  const H = 3600e3, D = 24 * H;
  const HORIZONS = [
    { id: 'h72', label: '72 часа', ms: 72 * H },
    { id: 'w2', label: '2 недели', ms: 14 * D },
    { id: 'm3', label: '3 месяца', ms: 92 * D },
    { id: 'hist', label: 'История' },
  ];
  const CATS = [
    { id: 'russia', label: 'Россия' },
    { id: 'intl', label: 'Международные организации' },
    { id: 'elections', label: 'Выборы' },
    { id: 'cb', label: 'Центробанки' },
    { id: 'business', label: 'Крупный бизнес' },
  ];
  const STATUSES = [
    { id: 'confirmed', label: 'Подтверждена', short: 'подтв.' },
    { id: 'preliminary', label: 'Предварительная', short: 'предв.' },
    { id: 'expected', label: 'Без даты', short: 'без даты' },
    { id: 'cancelled', label: 'Не состоится', short: 'отменено' },
  ];
  const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.label]));
  const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));

  const store = {
    get(k, d) { try { const v = localStorage.getItem('em.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('em.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    events: [], meta: null, loaded: false,
    horizon: store.get('horizon', 'h72'),
    cats: new Set(store.get('cats', [])),
    q: '', openId: null, order: [], animate: true, help: false,
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------ время */
  const fmt = o => new Intl.DateTimeFormat('ru-RU', { timeZone: MSK, ...o });
  const fDay = fmt({ day: 'numeric', month: 'long' });
  const fNum = fmt({ day: 'numeric' });
  const fMon = fmt({ month: 'long' });
  const fMonS = fmt({ month: 'short' });
  const fWd = fmt({ weekday: 'short' });
  const fWdLong = fmt({ weekday: 'long' });
  const fTime = fmt({ hour: '2-digit', minute: '2-digit', hour12: false });
  const fShort = fmt({ day: 'numeric', month: 'short' });
  const fHour = fmt({ hour: '2-digit', hour12: false });
  const dayKey = d => { const p = fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d); const g = t => p.find(x => x.type === t).value; return `${g('year')}-${g('month')}-${g('day')}`; };
  const parseDay = s => s ? new Date(s + 'T23:59:59+03:00') : null;
  const dayStart = d => new Date(dayKey(d) + 'T00:00:00+03:00');

  function times(e) {
    const s = e.start ? new Date(e.start) : null;
    let end = e.end ? new Date(e.end) : null;
    if (s && !end) end = e.allDay ? new Date(dayKey(s) + 'T23:59:59+03:00') : new Date(s.getTime() + 2 * H);
    return { s, end, w: parseDay(e.window) };
  }
  const when = e => { const t = times(e); return (t.s || t.w || new Date(8.64e15)).getTime(); };
  function phase(e, now) {
    const { s, end } = times(e);
    if (e.dateStatus === 'cancelled') return 'cancelled';
    if (e.outcome && e.outcome.decided) return 'closed';
    if (!s || now < s) return 'upcoming';
    if (now <= end) return 'live';
    return 'awaiting';
  }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }
  function relDays(d, now) {
    const n = Math.round((dayStart(d) - dayStart(now)) / D);
    if (n === 0) return 'сегодня'; if (n === 1) return 'завтра'; if (n === -1) return 'вчера';
    return n > 0 ? `через ${n} ${plural(n, 'день', 'дня', 'дней')}` : `${-n} ${plural(n, 'день', 'дня', 'дней')} назад`;
  }

  /* ---------------------------------------------------------- отбор */
  function inHorizon(e, now, hz) {
    const { s, end, w } = times(e);
    const ph = phase(e, now);
    if (hz.id === 'hist') return ph === 'closed' || ph === 'awaiting' || (ph === 'cancelled' && w && w < now);
    if (ph === 'closed' || ph === 'awaiting') return false;
    const lim = now.getTime() + hz.ms;
    if (s) return end >= now && s.getTime() <= lim;
    if (!w || w < now) return false;
    return w.getTime() <= lim + (hz.id === 'h72' ? 0 : 20 * D);
  }
  function passTopic(e) {
    if (state.cats.size && !(e.cats || []).some(c => state.cats.has(c))) return false;
    if (state.q) {
      const hay = [e.title, e.where, e.kind, e.participants, (e.agenda || []).map(a => a.text).join(' ')].join(' ').toLowerCase();
      if (!state.q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    return true;
  }

  /* ------------------------------------------------------- знаки статуса */
  function glyph(st, size = 10) {
    const s = size, r = s / 2 - 1, c = s / 2;
    if (st === 'confirmed') return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="currentColor"/></svg>`;
    if (st === 'preliminary') return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r - .3}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.6"/></svg>`;
    if (st === 'expected') return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><rect x="1" y="1" width="${s - 2}" height="${s - 2}" rx="1.5" fill="url(#hatch)" stroke="currentColor" stroke-width="1"/></svg>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r - .3}" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M${c - r * .7} ${c + r * .7}L${c + r * .7} ${c - r * .7}" stroke="currentColor" stroke-width="1.3"/></svg>`;
  }
  const stTag = (st, long) => `<span class="st s-${st}">${glyph(st)}${long ? ST[st].label : ST[st].short}</span>`;

  /* -------------------------------------------------------- «в эфире» */
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  function airLine(e) {
    const { s, end } = times(e);
    const d = s ? fDay.format(s) : '';
    const t = s && !e.allDay ? fTime.format(s) : '';
    const multi = s && e.end && dayKey(s) !== dayKey(end);
    const w = e.dateWording || (multi ? `с ${d} по ${fDay.format(end)}` : t ? `${d}, в ${t} по Москве` : d);
    switch (e.dateStatus) {
      case 'confirmed': return { c: 'var(--st-confirmed)', hint: e.risk ? 'Дата назначена, но есть риск переноса — оговорите это.' : 'Дату можно называть уверенно.', text: `${cap(w)} — ${e.title}.` };
      case 'preliminary': return { c: 'var(--st-preliminary)', hint: 'Не называйте число без оговорки.', text: `Ориентировочно ${d} — ${e.title}. Дата официально не закреплена.` };
      case 'expected': return { c: 'var(--st-expected)', hint: 'Конкретного дня нет — говорите об окне.', text: `${e.title}: ожидается ${e.dateWording || 'позже'}, конкретная дата пока не назначена.` };
      default: return { c: 'var(--st-cancelled)', hint: 'Событие в ожидавшиеся сроки не состоится.', text: `${e.title} в ожидавшиеся сроки не состоятся.` };
    }
  }

  /* ------------------------------------------------------------ шапка */
  function renderTabs(now) {
    const el = $('#tabs');
    el.innerHTML = HORIZONS.map(h => {
      const n = state.loaded ? state.events.filter(e => inHorizon(e, now, h)).length : '';
      return `<button type="button" role="tab" data-hz="${h.id}" aria-selected="${state.horizon === h.id}">${h.label}<sup>${n}</sup></button>`;
    }).join('') + '<span class="ink" id="ink"></span>';
    moveInk(false);
  }
  function moveInk(anim = true) {
    const act = $('#tabs [aria-selected="true"]'), ink = $('#ink');
    if (!act || !ink) return;
    if (!anim) ink.style.transition = 'none';
    ink.style.left = act.offsetLeft + 'px'; ink.style.width = act.offsetWidth + 'px';
    if (!anim) requestAnimationFrame(() => ink.style.transition = '');
  }

  function renderTopics(pool) {
    $('#topics').innerHTML = '<span class="caps">Тема</span>' + CATS.map(c => {
      const n = pool.filter(e => (e.cats || []).includes(c.id)).length;
      return `<button type="button" class="tgl" data-cat="${c.id}" aria-pressed="${state.cats.has(c.id)}">${c.label}<span class="c">${n}</span></button>`;
    }).join('')
      + (state.cats.size ? `<button type="button" class="tgl clear" data-cat="__clear">сбросить</button>` : '');
  }

  /* ------------------------------------------------------------- лента */
  function timeCell(e) {
    const { s, w } = times(e);
    if (!s) return `<div class="tm"><span class="h none">${esc(e.dateWording || ('до ' + fShort.format(w)))}</span>${stTag(e.dateStatus)}</div>`;
    const ap = e.dateStatus === 'preliminary';
    const h = e.allDay ? (ap ? '≈ весь день' : 'весь день') : (ap ? '≈' : '') + fTime.format(s);
    return `<div class="tm"><span class="h${ap ? ' approx' : ''}${e.allDay ? ' allday' : ''}" style="${e.allDay ? 'font-size:12px' : ''}">${h}</span>${stTag(e.dateStatus)}</div>`;
  }
  function rowHtml(e, now, i) {
    const ph = phase(e, now);
    const flags = [ph === 'live' ? '<span class="flag live">идёт</span>' : '', ph === 'awaiting' ? '<span class="flag await">ждёт итога</span>' : '', e.risk ? `<span class="flag risk">${esc(e.risk)}</span>` : ''].join('');
    const subs = [e.kind, e.where, (e.cats || []).map(c => CAT_LABEL[c]).filter(Boolean).slice(0, 2).join(', ')].filter(Boolean).map(esc).join(' · ');
    const gist = ph === 'closed' && e.outcome ? `<div class="gist"><span style="color:var(--st-confirmed);font-weight:500">Решили:</span> ${esc(trim(e.outcome.decided, 170))}</div>` : '';
    const cls = ['row', e.dateStatus === 'cancelled' ? 'cancelled' : '', state.animate ? 'enter' : ''].join(' ');
    const delay = state.animate ? ` style="animation-delay:${Math.min(i, 14) * 22}ms"` : '';
    return `<button type="button" class="${cls}" data-open="${esc(e.id)}" aria-current="${state.openId === e.id && !state.help}"${delay}>
      ${timeCell(e)}
      <div style="min-width:0"><div class="t">${esc(e.title)}${flags ? `<span class="flags">${flags}</span>` : ''}</div><div class="sub">${subs}</div>${gist}</div>
      <span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>`;
  }
  const trim = (s, n) => (s || '').length > n ? s.slice(0, n - 1).trimEnd() + '…' : (s || '');

  function render() {
    const now = new Date();
    const hz = HORIZONS.find(h => h.id === state.horizon) || HORIZONS[0];
    renderTabs(now); renderRun(now);
    if (!state.loaded) return;
    const inHz = state.events.filter(e => inHorizon(e, now, hz));
    const shown = inHz.filter(passTopic);
    renderTopics(inHz);
    const feed = $('#feed');
    if (!shown.length) {
      feed.innerHTML = `<div class="empty"><b>${inHz.length ? 'Под выбранные темы ничего не подходит' : 'В этом горизонте событий нет'}</b>${inHz.length ? 'Снимите часть фильтров по темам.' : 'Переключите горизонт или откройте историю.'}</div>`;
      state.order = []; showEmptyDetail(); return;
    }
    shown.sort((a, b) => hz.id === 'hist' ? when(b) - when(a) : (when(a) - when(b)) || a.title.localeCompare(b.title));
    const dated = shown.filter(e => times(e).s), undated = shown.filter(e => !times(e).s);
    const groups = [];
    for (const e of dated) {
      const s = times(e).s, k = hz.id !== 'hist' && s < now ? 'now' : dayKey(s);
      let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, d: s, items: [] });
      g.items.push(e);
    }
    state.order = [...groups.flatMap(g => g.items), ...undated].map(e => e.id);
    if (!state.help && !state.order.includes(state.openId)) state.openId = state.order[0];
    let i = 0, html = '';
    for (const g of groups) {
      const head = g.k === 'now' ? `<div class="dh now"><div class="d">Сейчас</div><div class="caps mw">уже идут</div></div>`
        : `<div class="dh"><div class="d">${fNum.format(g.d)}</div><div class="caps mw">${esc(fMon.format(g.d).slice(0, 3))} · ${esc(fWd.format(g.d))}</div><div class="rel">${esc(relDays(g.d, now))}</div></div>`;
      html += `<section class="day">${head}<div class="rows">${g.items.map(e => rowHtml(e, now, i++)).join('')}</div></section>`;
    }
    if (undated.length) html += `<section class="day"><div class="dh nodate"><div class="d">Без даты</div><div class="caps mw">окно известно</div></div><div class="rows">${undated.map(e => rowHtml(e, now, i++)).join('')}</div></section>`;
    feed.innerHTML = html;
    state.animate = false;
    if (!state.help) showEvent(state.openId, { quiet: true });
  }
  function markCurrent() {
    document.querySelectorAll('#feed .row').forEach(r => r.setAttribute('aria-current', String(!state.help && r.dataset.open === state.openId)));
  }
  function renderRun(now) {
    const m = state.meta, dot = m && m.lastRunAt ? ((now - new Date(m.lastRunAt)) / H > 14 ? 'stale' : '') : 'off';
    const el = $('#autorun');
    el.innerHTML = `<i class="dot ${dot}"></i>${m && m.lastRunAt ? 'итоги обновлены ' + fShort.format(new Date(m.lastRunAt)) + ', ' + fTime.format(new Date(m.lastRunAt)) : 'автоитоги: ждём прогона'}`;
    el.title = (m && m.log && m.log[0]) ? m.log[0].text : 'Автоматические итоги: 06:47 и 15:47 мск';
  }

  /* --------------------------------------------------- карточка справа */
  const detail = $('#detail'), scrim = $('#scrim');
  const narrow = () => matchMedia('(max-width: 1100px)').matches;
  let shownKey = null, closeT = null, lastFocus = null;
  function paint(html, foot, crumb, key, quiet) {
    const body = $('#drBody');
    const same = key === shownKey;
    body.innerHTML = html; $('#drFoot').innerHTML = foot || ''; $('#drFoot').hidden = !foot;
    $('#drCrumb').textContent = crumb || '';
    if (!same) { body.scrollTop = 0; body.classList.remove('swap'); void body.offsetWidth; body.classList.add('swap'); }
    shownKey = key;
  }
  function showEmptyDetail() { shownKey = null; $('#drBody').innerHTML = '<div class="empty"><b>Карточка события</b>Выберите событие в списке слева.</div>'; $('#drFoot').hidden = true; $('#drCrumb').textContent = ''; }
  function sheetOpen() {
    if (!narrow()) return;
    clearTimeout(closeT);
    if (!detail.classList.contains('open')) {
      lastFocus = document.activeElement;
      scrim.hidden = false; detail.classList.remove('closing'); document.body.classList.add('locked');
      requestAnimationFrame(() => requestAnimationFrame(() => { detail.classList.add('open'); scrim.classList.add('open'); }));
      setTimeout(() => $('#drClose').focus({ preventScroll: true }), 60);
    }
  }
  function sheetClose() {
    if (!detail.classList.contains('open')) return;
    detail.classList.add('closing'); detail.classList.remove('open'); scrim.classList.remove('open');
    document.body.classList.remove('locked');
    closeT = setTimeout(() => { scrim.hidden = true; }, reduced() ? 0 : 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function items(arr) {
    if (!arr || !arr.length) return '<p class="small" style="margin:0">Пока нет данных.</p>';
    return '<ul class="items">' + arr.map(a => `<li><span class="bs ${a.basis}">${a.basis === 'agenda' ? 'повестка' : 'анализ'}</span><span>${esc(a.text)}</span></li>`).join('') + '</ul>';
  }
  const links = arr => (arr || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('');
  const lab = t => `<h3 class="lab caps">${t}</h3>`;

  function showEvent(id, opt = {}) {
    const e = state.events.find(x => x.id === id); if (!e) { showEmptyDetail(); return; }
    state.openId = id; state.help = false;
    if (!opt.quiet) { try { history.replaceState(null, '', '#' + id); } catch (err) {} }
    const now = new Date(), ph = phase(e, now), { s, end } = times(e);
    const air = airLine(e), imp = e.impact || {}, cp = e.checkpoint || {}, o = e.outcome;
    const multi = s && end && !e.allDay && dayKey(s) !== dayKey(end) ? ` — ${fShort.format(end)}` : '';
    const whenBig = s ? `<span class="big">${esc(fDay.format(s))}${e.allDay ? '' : ', ' + fTime.format(s) + ' мск'}${multi}</span>` : `<span class="big none">${esc(e.dateWording || '')}</span>`;
    const flag = ph === 'live' ? '<span class="flag live">идёт</span>' : ph === 'awaiting' ? '<span class="flag await">ждёт итога</span>' : '';
    let outcome = '';
    if (o && o.decided) {
      outcome = `<section>${lab('Итог')}<div class="outcome">
        <div><b class="caps">Ожидали</b>${esc(o.expected || '—')}</div><div class="arr">→</div>
        <div class="dec"><b class="caps">Решили</b>${esc(o.decided)}</div><div class="arr">→</div>
        <div><b class="caps">Осталось открытым</b>${(o.open || []).length ? '<ul>' + o.open.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : '—'}</div></div>
        <div class="small">${o.filledAt ? 'Записано ' + esc(String(o.filledAt).slice(0, 16).replace('T', ' ')) + (o.filledBy === 'claude' ? ' · собрано Claude по источникам' : '') + '. ' : ''}${(o.sources || []).length ? 'Источники: ' + (o.sources || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(', ') : ''}</div></section>`;
    } else if (ph === 'awaiting') {
      outcome = `<section>${lab('Итог')}<div class="pending">Событие завершилось. Итог в формате «ожидали → решили → осталось открытым» запишет ближайший автопрогон — в 06:47 или 15:47 мск.</div></section>`;
    }
    const html = `
      <section class="hero"><div class="k">${esc([e.kind, e.where].filter(Boolean).join(' · '))}</div>
        <h2 id="drTitle">${esc(e.title)}</h2>
        <div class="when">${whenBig}${stTag(e.dateStatus, true)}${flag}${e.risk ? `<span class="flag risk">${esc(e.risk)}</span>` : ''}</div></section>
      ${outcome}
      <section class="air" style="--c:${air.c}"><p>${esc(air.text)}</p><div class="row2"><span class="hint">${esc(air.hint)}</span><button type="button" class="pillbtn" data-copy="${esc(e.id)}">Копировать для эфира</button></div></section>
      <section>${lab('Дата и основание')}<dl class="kv">
        ${e.timeNote ? `<dt>Время</dt><dd>${esc(e.timeNote)}</dd>` : ''}
        ${e.dateNote ? `<dt>Оговорка</dt><dd>${esc(e.dateNote)}</dd>` : ''}
        ${e.ideaWording ? `<dt>IDEA</dt><dd>«${esc(e.ideaWording)}»${e.ideaCheck ? '<br><span style="color:var(--ink-2)">' + esc(e.ideaCheck) + '</span>' : ''}</dd>` : ''}
        <dt>Основание</dt><dd>${e.dateSource ? `<a href="${esc(e.dateSource.url)}" target="_blank" rel="noopener">${esc(e.dateSource.name)}</a>` : '—'}</dd>
        <dt>Сверено</dt><dd class="mono" style="font-size:12.5px">${esc(e.checkedAt || '—')}</dd></dl></section>
      <section>${lab('Что на обсуждении')}${e.participants && e.participants !== '—' ? `<p style="margin:0 0 12px;font-size:13.5px"><span style="color:var(--muted)">Участники.</span> ${esc(e.participants)}</p>` : ''}${items(e.agenda)}</section>
      <section>${lab('Какие решения возможны')}${items(e.scenarios)}</section>
      <section>${lab('Что изменится')}<div class="three">
        <div><b class="caps">Россия</b>${esc(imp.russia || '—')}</div><div><b class="caps">Бизнес</b>${esc(imp.business || '—')}</div><div><b class="caps">Рынки</b>${esc(imp.markets || '—')}</div></div></section>
      <section>${lab('Контрольная точка')}<div class="cp"><span>${esc(cp.what || '—')}</span><span class="w">${esc(cp.when || '')}</span></div></section>
      <section>${lab('Источники')}<div class="srcs">${links(e.sources)}</div></section>`;
    const foot = `<button type="button" class="pillbtn" data-copylink="${esc(e.id)}">Ссылка на карточку</button>`;
    const idx = state.order.indexOf(id);
    $('#drPrev').disabled = idx <= 0; $('#drNext').disabled = idx < 0 || idx >= state.order.length - 1;
    const crumb = s ? `${fWdLong.format(s)}, ${relDays(s, now)}` : 'дата не назначена';
    paint(html, foot, crumb, 'e:' + id + ':' + (e.outcome ? 1 : 0), opt.quiet);
    markCurrent();
    if (!opt.quiet) sheetOpen();
  }
  function openHelp() {
    state.help = true; markCurrent();
    const html = `<section class="hero"><div class="k">Справка</div><h2 id="drTitle">Как читать карту</h2></section>
      <section>${lab('Статус даты')}<div class="legend">
        <div>${stTag('confirmed', true)}<p>Назначена официальным документом: указом, календарём организатора, решением избиркома.</p><span class="ex">в эфире: «23 октября в 13:30»</span></div>
        <div>${stTag('preliminary', true)}<p>Дата известна, но не закреплена: практика прошлых лет, агрегаторы, оговорки организатора. Время помечено знаком ≈.</p><span class="ex">в эфире: «ориентировочно…»</span></div>
        <div>${stTag('expected', true)}<p>Событие ожидается в окне — «к декабрю», «в октябре», — конкретный день не назначен.</p><span class="ex">в эфире: «ожидается до…, дата не назначена»</span></div>
        <div>${stTag('cancelled', true)}<p>Отменено или перенесено за пределы горизонта.</p></div></div></section>
      <section>${lab('Пометки в карточке')}<ul class="items"><li><span class="bs agenda">повестка</span><span>Подтверждено повесткой или документом организатора.</span></li><li><span class="bs analysis">анализ</span><span>Предположение редакции: сценарий, а не факт.</span></li></ul></section>
      <section>${lab('Итоги')}<p style="margin:0;font-size:13.5px">Когда событие закончилось, оно уходит в «Историю» с отметкой «ждёт итога». Дважды в день, в 06:47 и 15:47 мск, Claude собирает итог по официальным документам и СМИ и записывает его в формате «ожидали → решили → что осталось открытым». Так календарь помнит, что от события ждали и чем оно закончилось.</p></section>
      <section>${lab('Управление')}<dl class="kv"><dt>Клавиши</dt><dd>↑ ↓ — предыдущее и следующее событие в списке</dd><dt>Ссылка</dt><dd>У каждой карточки своя ссылка — её можно переслать</dd></dl></section>`;
    $('#drPrev').disabled = true; $('#drNext').disabled = true;
    paint(html, `<button type="button" class="pillbtn" id="backBtn">Вернуться к событию</button>`, 'Справка', 'help', false);
    sheetOpen();
  }

  /* ------------------------------------------------------ взаимодействие */
  const toastEl = $('#toast');
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1800); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать — выделите текст вручную'); } }

  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-open],[data-hz],[data-cat],[data-st],[data-pin],[data-copy],[data-copylink],button');
    if (!t) return;
    const d = t.dataset;
    if (d.open) { showEvent(d.open); return; }
    if (d.hz) { if (state.horizon !== d.hz) { state.horizon = d.hz; store.set('horizon', d.hz); state.animate = true; render(); requestAnimationFrame(() => moveInk(true)); } return; }
    if (d.cat) { d.cat === '__clear' ? state.cats.clear() : (state.cats.has(d.cat) ? state.cats.delete(d.cat) : state.cats.add(d.cat)); store.set('cats', [...state.cats]); state.animate = true; render(); return; }
    if (d.copy) { const e = state.events.find(x => x.id === d.copy); if (e) copy(airLine(e).text); return; }
    if (d.copylink) { copy(location.href.split('#')[0] + '#' + d.copylink); return; }
    if (t.id === 'drClose') { sheetClose(); return; }
    if (t.id === 'backBtn') { state.help = false; showEvent(state.openId || state.order[0]); return; }
    if (t.id === 'drPrev' || t.id === 'drNext') { step(t.id === 'drNext' ? 1 : -1); return; }
    if (t.id === 'helpBtn') { openHelp(); return; }
    if (t.id === 'themeBtn') {
      const r = document.documentElement, cur = r.getAttribute('data-theme');
      const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.setAttribute('data-theme', dark ? 'light' : 'dark'); store.set('theme', r.getAttribute('data-theme'));
    }
  });
  scrim.addEventListener('click', sheetClose);
  function step(dir) {
    if (!state.order.length) return;
    const i = Math.max(0, Math.min(state.order.length - 1, state.order.indexOf(state.openId) + dir));
    showEvent(state.order[i], { keepSheet: true });
    const row = document.querySelector(`#feed .row[data-open="${CSS.escape(state.order[i])}"]`);
    if (row && !narrow()) row.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }
  document.addEventListener('keydown', ev => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
    if (typing) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); step(ev.key === 'ArrowDown' ? 1 : -1); }
    else if (ev.key === 'Escape') sheetClose();
  });
  let qt; $('#q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); state.animate = true; render(); }, 160); });
  addEventListener('resize', () => { moveInk(false); setTopH(); if (!narrow()) { sheetClose(); } });
  function setTopH() { document.documentElement.style.setProperty('--toph', $('.top').offsetHeight + 'px'); }
  setTopH();

  /* ---------------------------------------------------------- старт */
  function tick() { const n = new Date(); $('#clock').textContent = `${fWd.format(n)}, ${fShort.format(n)} · ${fTime.format(n)} мск`; }
  tick(); setInterval(tick, 20e3);
  setInterval(() => { if (state.loaded) render(); }, 5 * 60e3);
  const th = store.get('theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveInk(false); setTopH(); });

  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { $('#feed').innerHTML = '<div class="empty"><b>База событий недоступна в этом просмотре</b>Карточки и итоги хранятся в базе терминала. Откройте страницу по ссылке claude.ai, войдя в аккаунт.</div>'; return; }
    db.collection('events').onSnapshot(snap => {
      const first = !state.loaded;
      state.events = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => e.title);
      state.loaded = true; if (first) state.animate = true;
      if (!state.events.length) { $('#feed').innerHTML = '<div class="empty"><b>Карта пока пуста</b>События появятся после первого прогона наполнения.</div>'; return; }
      const h = location.hash.slice(1);
      if (first && h && state.events.some(e => e.id === h)) {
        const e = state.events.find(x => x.id === h), now = new Date();
        const hz = HORIZONS.find(z => inHorizon(e, now, z));
        if (hz && hz.id !== state.horizon) state.horizon = hz.id;
        state.cats.clear(); state.openId = h;
      }
      render();
    }, err => { $('#feed').innerHTML = `<div class="empty"><b>Связь с базой прервалась</b>Обновите страницу. Код: ${esc(err && err.code)}</div>`; });
    db.doc('meta/status').onSnapshot(d => { state.meta = d.exists ? d.data() : null; renderRun(new Date()); }, () => {});
  })();
})();
</script>
