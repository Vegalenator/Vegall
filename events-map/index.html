<title>Карта событий</title>
<meta name="description" content="Редакционный календарь событий: заседания, выборы, форумы и публикации данных со статусом даты, повесткой, сценариями и итогами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Карта событий — лист консалтингового отчёта.
   Две колонки: слева лента дней, справа постоянно открытая карточка выбранного события.
   На узком экране карточка выезжает листом поверх ленты. Один акцент (глубокий ультрамарин),
   статусы — приглушённые и кодируются ещё и формой знака. */
:root {
  --ground:#eef0f3;            /* фон вокруг листа */
  --sheet:#ffffff;             /* лист */
  --sheet-2:#f6f7f9;           /* тихая подложка внутри листа */
  --glass:rgba(255,255,255,.72);
  --scrim:rgba(18,24,38,.28);
  --ink:#131a26;               /* основной текст */
  --ink-2:#4b5363;             /* вторичный */
  --muted:#8a91a0;             /* подписи */
  --hair:rgba(19,26,38,.09);   /* волосяные линии */
  --hair-2:rgba(19,26,38,.16);
  --accent:#243f9c;            /* ультрамарин */
  --accent-2:rgba(36,63,156,.08);
  --accent-3:rgba(36,63,156,.16);
  /* типы событий: пыльная приглушённая гамма, разнесённая по тону */
  --tint:14%; --tint-h:20%; --tint-a:25%;
  --t-monetary:#5c6fa3; --t-elections:#a96a87; --t-summits:#4e8783; --t-state:#ad7057; --t-data:#83854f; --t-energy:#b08a45; --t-corp:#7b68a3; --t-tech:#5a8a66;
  --st-confirmed:#1f7a52;
  --st-preliminary:#a3690f;
  --st-expected:#6d7686;
  --st-cancelled:#a8423a;
  --live:#c8412c;
  --shadow-lg:0 24px 60px -20px rgba(18,24,38,.35), 0 2px 8px rgba(18,24,38,.06);
  --shadow-sm:0 1px 2px rgba(18,24,38,.05), 0 4px 16px -8px rgba(18,24,38,.10);

  --ff-display:'Source Serif 4', 'PT Serif', Georgia, 'Times New Roman', serif;
  --ff-ui:'Golos Text', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --ff-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,.8,.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0a0d13; --sheet:#11151d; --sheet-2:#161b25; --glass:rgba(17,21,29,.72); --scrim:rgba(0,0,0,.5);
    --ink:#eceff4; --ink-2:#b4bbc7; --muted:#7c8493; --hair:rgba(236,239,244,.08); --hair-2:rgba(236,239,244,.15);
    --accent:#8ea6ff; --accent-2:rgba(142,166,255,.09); --accent-3:rgba(142,166,255,.18);
    --tint:17%; --tint-h:23%; --tint-a:29%; --t-monetary:#9aabd8; --t-elections:#d59bb6; --t-summits:#86bdb8; --t-state:#d9a088; --t-data:#b9bb84; --t-energy:#d9b777; --t-corp:#af9dd6; --t-tech:#93c49e;
    --st-confirmed:#5cc493; --st-preliminary:#e3a84a; --st-expected:#98a1b0; --st-cancelled:#ec8a7f; --live:#ff7a62;
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --ground:#0a0d13; --sheet:#11151d; --sheet-2:#161b25; --glass:rgba(17,21,29,.72); --scrim:rgba(0,0,0,.5);
  --ink:#eceff4; --ink-2:#b4bbc7; --muted:#7c8493; --hair:rgba(236,239,244,.08); --hair-2:rgba(236,239,244,.15);
  --accent:#8ea6ff; --accent-2:rgba(142,166,255,.09); --accent-3:rgba(142,166,255,.18);
    --tint:17%; --tint-h:23%; --tint-a:29%; --t-monetary:#9aabd8; --t-elections:#d59bb6; --t-summits:#86bdb8; --t-state:#d9a088; --t-data:#b9bb84; --t-energy:#d9b777; --t-corp:#af9dd6; --t-tech:#93c49e;
  --st-confirmed:#5cc493; --st-preliminary:#e3a84a; --st-expected:#98a1b0; --st-cancelled:#ec8a7f; --live:#ff7a62;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:var(--toph,56px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ff-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:var(--accent);text-decoration-color:var(--accent-3);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.caps{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500}

/* ------------------------------------------------------- шапка из стекла */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--hair)}
.top-in{max-width:1440px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:22px;min-height:54px}
.mark{margin:0;font-family:var(--ff-display);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.grow{flex:1 1 auto}
.status{display:flex;align-items:center;gap:12px;white-space:nowrap;font-size:12px;color:var(--ink-2)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--st-confirmed);display:inline-block;margin-right:7px;box-shadow:0 0 0 3px color-mix(in srgb, var(--st-confirmed) 18%, transparent)}
.status .dot.stale{background:var(--st-preliminary);box-shadow:0 0 0 3px color-mix(in srgb, var(--st-preliminary) 18%, transparent)}
.status .dot.off{background:var(--muted);box-shadow:none}
.ghost{display:grid;place-items:center;min-width:28px;height:28px;font-size:13px;font-weight:500;color:var(--ink-2);padding:0 6px;border-radius:6px;transition:background .2s,color .2s}
.ghost:hover{background:var(--accent-2);color:var(--ink)}

.tabs{position:relative;display:flex;gap:20px;align-self:stretch}
.tabs button{padding:0;height:100%;font-size:14px;color:var(--ink-2);transition:color .2s;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500}
.tabs button sup{font-family:var(--ff-mono);font-size:10px;color:var(--muted);margin-left:4px;vertical-align:super}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair-2);padding:4px 2px;min-width:0;flex:0 1 200px;min-width:130px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);width:100%;min-width:0;outline:none}

/* --------------------------------------------------------------- каркас */
.wrap{max-width:1440px;margin:0 auto;padding:22px 28px 40px;display:grid;grid-template-columns:minmax(440px,5fr) minmax(0,6fr);gap:22px;align-items:start}
.sheet{background:var(--sheet);border-radius:10px;box-shadow:var(--shadow-sm);min-width:0}

/* ---- темы */
.topics{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--hair)}
.topics .caps{margin-right:8px}
.tgl{flex:none;white-space:nowrap;font-size:12.5px;color:var(--ink-2);padding:5px 11px;border-radius:999px;transition:background .25s,color .25s,box-shadow .25s}
.tgl:hover{color:var(--ink);background:var(--sheet-2)}
.tgl[aria-pressed="true"]{color:var(--accent);background:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent-3)}
.tgl .c{font-family:var(--ff-mono);font-size:10px;color:var(--muted);margin-left:5px}
.tgl.clear{color:var(--muted)}

/* ---- лента */
.feed{padding:4px 0 10px}
.day{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 6px;padding:16px 14px 6px 20px}
.day + .day{border-top:1px solid var(--hair)}
.dh{position:sticky;top:calc(var(--toph,56px) + 10px);align-self:start;padding-top:8px}
.dh .d{font-family:var(--ff-display);font-size:34px;line-height:.9;font-weight:400;letter-spacing:-.03em}
.dh .mw{margin-top:6px}
.dh .rel{font-size:12px;color:var(--ink-2);margin-top:2px}
.dh.now .d{font-size:19px;line-height:1.1;color:var(--live)}
.dh.nodate .d{font-size:17px;line-height:1.15}
.rows{min-width:0}
.rows{display:grid;gap:5px}
.row{--tc:var(--muted);position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) 16px;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 12px 12px 12px;border-radius:9px;background:color-mix(in srgb,var(--tc) var(--tint),var(--sheet));box-shadow:inset 3px 0 0 color-mix(in srgb,var(--tc) 80%,transparent);transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.row:hover{background:color-mix(in srgb,var(--tc) var(--tint-h),var(--sheet))}
.row:hover .go{opacity:1;transform:translateX(0)}
.row.cancelled .t{text-decoration:line-through;text-decoration-color:var(--st-cancelled);color:var(--ink-2)}
.row[aria-current="true"]{background:color-mix(in srgb,var(--tc) var(--tint-a),var(--sheet));box-shadow:inset 5px 0 0 var(--tc),inset 0 0 0 1px color-mix(in srgb,var(--tc) 60%,transparent)}
@keyframes barIn{from{transform:scaleY(0)}to{transform:none}}
.row[aria-current="true"] .go{opacity:1;transform:none;color:var(--tc)}
.row.enter{animation:rowIn .45s var(--ease) both}
@keyframes rowIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.tm{display:grid;gap:3px;padding-top:1px}
.tm .h{font-family:var(--ff-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tm .h.approx{color:var(--st-preliminary)}
.tm .h.none{font-family:var(--ff-ui);font-size:12px;font-weight:400;font-style:italic;color:var(--st-expected);line-height:1.3}
.st{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;color:var(--c);white-space:nowrap}
.st svg{flex:none}
.s-confirmed{--c:var(--st-confirmed)} .s-preliminary{--c:var(--st-preliminary)} .s-expected{--c:var(--st-expected)} .s-cancelled{--c:var(--st-cancelled)}
.t{font-size:14.5px;font-weight:500;line-height:1.35;letter-spacing:-.005em;text-wrap:balance}
.sub{margin-top:4px;font-size:12.5px;color:var(--muted)}
.ty{display:inline-flex;align-items:center;gap:6px;color:var(--tc);font-weight:500;white-space:nowrap}
.ty i{width:7px;height:7px;border-radius:2px;background:var(--tc);flex:none}
.detail::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc,transparent);opacity:.85;z-index:3;transition:background .4s var(--ease)}
.hero .k .ty{margin-right:2px}
.tlegend{display:grid;gap:8px}
.tlegend div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;font-size:13px;align-items:baseline}
.tlegend span.d{color:var(--ink-2)}
.gist{margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.flags{display:inline-flex;flex-wrap:wrap;gap:4px 6px;margin-left:8px;vertical-align:2px;max-width:100%}
.flag{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;padding:2px 7px;border-radius:999px;white-space:nowrap}
.flag.live{color:#fff;background:var(--live);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 40%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.flag.await{color:var(--accent);background:var(--accent-2)}
.flag.risk{white-space:normal;color:var(--st-cancelled);background:color-mix(in srgb,var(--st-cancelled) 10%,transparent)}
.go{color:var(--muted);opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s var(--ease);padding-top:2px}

.empty{padding:56px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--ff-display);font-weight:500;font-size:20px;color:var(--ink);margin-bottom:6px}

/* ------------------------------------------------------------- панель */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1}
.detail{position:sticky;top:calc(var(--toph,56px) + 16px);height:calc(100vh - var(--toph,56px) - 32px);display:flex;flex-direction:column;overflow:hidden;padding:0;position:sticky}
.dtools{display:inline-flex;gap:2px;margin-left:auto}
#drClose{display:none}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 26px 30px;display:grid;gap:12px;align-content:start}
.dr-body > .hero{margin-bottom:8px}
.dr-body.swap > *{animation:secIn .42s var(--ease) both}
.dr-body.swap > *:nth-child(2){animation-delay:.03s}.dr-body.swap > *:nth-child(3){animation-delay:.06s}.dr-body.swap > *:nth-child(4){animation-delay:.09s}.dr-body.swap > *:nth-child(n+5){animation-delay:.12s}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero .k{font-size:12.5px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:18px;align-items:start}
.hero .main{min-width:0;padding-top:2px}
.geo{margin:0;display:grid;gap:5px}
.geo svg{display:block;width:100%;height:auto;border-radius:8px;background:var(--sheet-2);box-shadow:inset 0 0 0 1px var(--hair)}
.geo .land{fill:color-mix(in srgb,var(--ink) 17%,transparent)}
.geo .grid{stroke:var(--hair);stroke-width:.5;fill:none}
.geo .cross{stroke:var(--tc,var(--accent));stroke-width:.8;stroke-dasharray:2 2.5;opacity:.6}
.geo .pin{fill:var(--tc,var(--accent));stroke:var(--sheet);stroke-width:2.4}
.geo .ring{fill:none;stroke:var(--tc,var(--accent));stroke-width:2.2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.geo figcaption{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.geo figcaption.off{color:var(--muted);font-style:italic}
.hero h2{margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--ff-display);font-weight:500;font-size:22px;line-height:1.15;letter-spacing:-.015em}
.when{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.when .st,.when .flag{flex:none}
.when .big{font-family:var(--ff-mono);font-size:14.5px;white-space:nowrap;font-weight:500;letter-spacing:-.01em}
.when .big.none{font-family:var(--ff-ui);font-style:italic;font-weight:400;color:var(--st-expected)}
.lab.caps{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.blk{padding:16px 18px;border-radius:10px;background:var(--sheet-2)}
.blk.cpb{background:var(--accent-2)}
.blk.cpb .lab.caps{color:var(--accent)}
.blk.res{background:color-mix(in srgb,var(--st-confirmed) 7%,var(--sheet-2))}
.blk.res .outcome{background:none;padding:0}
.blk.cons{background:color-mix(in srgb,var(--tc) 7%,var(--sheet-2))}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;margin:2px 0 4px}
.ctab th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);text-align:left;padding:0 10px 6px 0;border-bottom:1px solid var(--hair)}
.ctab td{padding:8px 10px 8px 0;border-bottom:1px dashed var(--hair);vertical-align:top;color:var(--ink)}
.ctab tr:last-child td{border-bottom:0}
.ctab td:first-child{color:var(--ink-2);width:34%}
.ctab .num{font-family:var(--ff-mono);font-size:13px;white-space:nowrap}
.ctab .cv{font-weight:600}
.ctab .rg{display:block;font-family:var(--ff-ui);font-size:11.5px;color:var(--muted);white-space:normal;font-weight:400;margin-top:2px}
.ctab .act{font-weight:600;color:var(--st-confirmed)}
.ctab .act.off{color:var(--st-cancelled)}
.cmeta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 14px;font-size:13px;line-height:1.5;margin:10px 0 0}
.cmeta dt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);padding-top:3px}
.cmeta dd{margin:0}
.verdict{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--vc);background:color-mix(in srgb,var(--vc) 13%,transparent);margin:0 0 10px}
.verdict + span{font-size:13px;color:var(--ink-2);margin-left:8px}
.csh{color:var(--ink-2);font-family:var(--ff-mono);font-size:11.5px}
@media (max-width:720px){.cmeta{grid-template-columns:minmax(0,1fr);gap:2px}.cmeta dd{margin-bottom:8px}.ctab td:first-child{width:auto}}
.disc{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px 16px;margin:0;font-size:13.5px;line-height:1.5}
.disc dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.disc dd{margin:0;min-width:0}
.wl{color:inherit;text-decoration:underline dotted;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--tc,var(--accent)) 70%,transparent);text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
.wl:hover{color:var(--accent);text-decoration-style:solid;text-decoration-color:var(--accent)}
.say figcaption b .wl{text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.chgbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:0 10px}
.chgbtn b{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--st-preliminary);color:#fff;font-size:10.5px;font-weight:600;display:inline-grid;place-items:center;font-family:var(--ff-mono)}
.chgbtn[aria-pressed="true"]{background:var(--accent-2);color:var(--ink)}
.flag.chg{color:var(--st-preliminary);background:color-mix(in srgb,var(--st-preliminary) 13%,transparent)}
.flag.new{color:var(--accent);background:var(--accent-2)}
.clog{display:grid}
.citem{display:grid;grid-template-columns:64px minmax(0,1fr);gap:2px 12px;padding:11px 0;border-top:1px dashed var(--hair)}
.citem:first-child{border-top:0;padding-top:2px}
.citem .ct{font-family:var(--ff-mono);font-size:12px;white-space:nowrap;color:var(--ink-2);padding-top:2px}
.citem .ck{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.citem .ck button{font-weight:600;font-size:13.5px;text-align:left;color:var(--ink)}
.citem .ck button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.kchip{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;color:var(--kc);background:color-mix(in srgb,var(--kc) 12%,transparent)}
.citem .cd{grid-column:2;font-size:13.5px;line-height:1.5;color:var(--ink)}
.citem .cd s{color:var(--muted);text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.citem .cn{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.citem .cn a{font-size:12px}

<script>
(() => {
  const MSK = 'Europe/Moscow';
  const H = 3600e3, D = 24 * H;
  const HORIZONS = [
    { id: 'h72', label: '72 часа', ms: 72 * H },
    { id: 'w2', label: '2 недели', ms: 14 * D },
    { id: 'm1', label: '1 месяц', ms: 31 * D },
    { id: 'm3', label: '3 месяца', ms: 92 * D },
    { id: 'hist', label: 'История' },
  ];
  const CATS = [
    { id: 'russia', label: 'RUS', full: 'Россия' },
    { id: 'intl', label: 'INT', full: 'Международные организации' },
    { id: 'elections', label: 'Выборы', full: 'Выборы' },
    { id: 'cb', label: 'ЦБ', full: 'Центробанки' },
    { id: 'business', label: 'CORP', full: 'Крупный бизнес' },
    { id: 'tech', label: 'TECH', full: 'Технологии и отраслевые события' },
  ];
  const STATUSES = [
    { id: 'confirmed', label: 'Подтверждена', short: 'подтв.' },
    { id: 'preliminary', label: 'Предварительная', short: 'предв.' },
    { id: 'expected', label: 'Без даты', short: 'без даты' },
    { id: 'cancelled', label: 'Не состоится', short: 'отменено' },
  ];
  const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.full]));
  const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
  const TYPES = [
    { id: 'monetary', label: 'Денежная политика', d: 'Решения ЦБ, ФРС, ЕЦБ и выступления их глав' },
    { id: 'elections', label: 'Выборы', d: 'Национальные выборы и референдумы' },
    { id: 'summits', label: 'Саммиты и форумы', d: 'Встречи лидеров и министров, международные форумы' },
    { id: 'state', label: 'Власть и бюджет', d: 'Парламенты, правительства, бюджетные сроки' },
    { id: 'data', label: 'Статистика', d: 'Публикации макроэкономических данных' },
    { id: 'energy', label: 'Нефть и энергетика', d: 'ОПЕК плюс, энергетические форумы' },
    { id: 'corp', label: 'Компании', d: 'Корпоративная отчётность' },
    { id: 'tech', label: 'Технологии и отрасли', d: 'Технологические и отраслевые форумы, конференции, выставки' },
  ];
  const TY = Object.fromEntries(TYPES.map(t => [t.id, t]));
  function typeOf(e) {
    if (e.type && TY[e.type]) return e.type;
    const k = (e.kind || '').toLowerCase(), c = e.cats || [];
    if (k.includes('выбор')) return 'elections';
    if (c.includes('cb')) return 'monetary';
    if (k.includes('данн')) return 'data';
    if (k.includes('отчёт')) return 'corp';
    if (k.includes('саммит') || k.includes('форум')) return 'summits';
    return 'state';
  }
  const tyTag = e => { const t = typeOf(e); return `<span class="ty" style="--tc:var(--t-${t})"><i></i>${TY[t].label}</span>`; };

  const store = {
    get(k, d) { try { const v = localStorage.getItem('em.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('em.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    events: [], meta: null, loaded: false,
    horizon: store.get('horizon', 'h72'),
    cats: new Set(store.get('cats', [])),
    q: '', openId: null, order: [], animate: true, help: false, pane: '', briefs: {},
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------ время */
  const fmt = o => new Intl.DateTimeFormat('ru-RU', { timeZone: MSK, ...o });
  const fDay = fmt({ day: 'numeric', month: 'long' });
  const fNum = fmt({ day: 'numeric' });
  const fMon = fmt({ month: 'long' });
  const fMonS = fmt({ month: 'short' });
  const fWd = fmt({ weekday: 'short' });
  const fWdLong = fmt({ weekday: 'long' });
  const fTime = fmt({ hour: '2-digit', minute: '2-digit', hour12: false });
  const fShort = fmt({ day: 'numeric', month: 'short' });
  const fHour = fmt({ hour: '2-digit', hour12: false });
  const dayKey = d => { const p = fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d); const g = t => p.find(x => x.type === t).value; return `${g('year')}-${g('month')}-${g('day')}`; };
  const parseDay = s => s ? new Date(s + 'T23:59:59+03:00') : null;
  const dayStart = d => new Date(dayKey(d) + 'T00:00:00+03:00');

  function times(e) {
    const s = e.start ? new Date(e.start) : null;
    let end = e.end ? new Date(e.end) : null;
    if (s && !end) end = e.allDay ? new Date(dayKey(s) + 'T23:59:59+03:00') : new Date(s.getTime() + 2 * H);
    return { s, end, w: parseDay(e.window) };
  }
  const when = e => { const t = times(e); return (t.s || t.w || new Date(8.64e15)).getTime(); };
  function phase(e, now) {
    const { s, end } = times(e);
    if (e.dateStatus === 'cancelled') return 'cancelled';
    if (e.outcome && e.outcome.decided) return 'closed';
    if (!s || now < s) return 'upcoming';
    if (now <= end) return 'live';
    return 'awaiting';
  }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }
  function relDays(d, now) {
    const n = Math.round((dayStart(d) - dayStart(now)) / D);
    if (n === 0) return 'сегодня'; if (n === 1) return 'завтра'; if (n === -1) return 'вчера';
    return n > 0 ? `через ${n} ${plural(n, 'день', 'дня', 'дней')}` : `${-n} ${plural(n, 'день', 'дня', 'дней')} назад`;
  }

  /* ---------------------------------------------------------- отбор */
  function inHorizon(e, now, hz) {
    const { s, end, w } = times(e);
    const ph = phase(e, now);
    if (hz.id === 'hist') return ph === 'closed' || ph === 'awaiting' || (ph === 'cancelled' && w && w < now);
    if (ph === 'closed' || ph === 'awaiting') return false;
    const lim = now.getTime() + hz.ms;
    if (s) return end >= now && s.getTime() <= lim;
    if (!w || w < now) return false;
    return w.getTime() <= lim + (hz.id === 'h72' ? 0 : 20 * D);
  }
  function passTopic(e) {
    if (state.cats.size && !(e.cats || []).some(c => state.cats.has(c))) return false;
    if (state.q) {
      const hay = [e.title, e.where, e.kind, e.participants, (e.agenda || []).map(a => a.text).join(' ')].join(' ').toLowerCase();
      if (!state.q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    return true;
  }

  /* ------------------------------------------------------- знаки статуса */
  function glyph(st, size = 10) {
    const s = size, r = s / 2 - 1, c = s / 2;
    if (st === 'confirmed') return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="currentColor"/></svg>`;

  /* снимок дат для отметки «с прошлого визита»: хранится только в этом браузере */
  const snapKey = e => [e.start || '', e.end || '', e.window || '', e.dateStatus || ''].join('|');
  let localDiffs = store.get('diffs', {});
  function diffSinceVisit() {
    const prev = store.get('snap', null), now = Date.now(), snap = {};
    state.events.forEach(e => {
      snap[e.id] = snapKey(e);
      if (prev && prev[e.id] !== undefined && prev[e.id] !== snap[e.id]) localDiffs[e.id] = { at: new Date().toISOString(), from: prev[e.id], to: snap[e.id] };
    });
    Object.keys(localDiffs).forEach(id => { if (now - new Date(localDiffs[id].at) > 48 * H) delete localDiffs[id]; });
    store.set('snap', snap); store.set('diffs', localDiffs);
  }
  function describeSnap(v) {
    const [st, , w, ds] = String(v || '').split('|');
    const d = st ? new Date(st) : (w ? parseDay(w) : null);
    return (d ? (st ? fDay.format(d) + (st.includes('T00:00:00') ? '' : ', ' + fTime.format(d)) : 'до ' + fDay.format(d)) : '—') + (ds && ST[ds] ? ' · ' + ST[ds].label.toLowerCase() : '');
  }
  function allChanges(days) {
    const lim = Date.now() - days * D, out = [];
    state.events.forEach(e => (e.changes || []).forEach(c => { if (c && c.at && new Date(c.at) >= lim) out.push({ e, c }); }));
    Object.entries(localDiffs).forEach(([id, d]) => { const e = state.events.find(x => x.id === id); if (e && !(e.changes || []).some(c => BIG.has(c.kind) && Math.abs(new Date(c.at) - new Date(d.at)) < 36 * H)) out.push({ e, c: { at: d.at, kind: 'other', from: describeSnap(d.from), to: describeSnap(d.to), note: 'Замечено с вашего прошлого визита', local: true } }); });
    return out.sort((a, b) => new Date(b.c.at) - new Date(a.c.at));
  }
  function rowChangeFlag(e) {
    const lim = Date.now() - 48 * H, recent = (e.changes || []).filter(c => c && c.at && new Date(c.at) >= lim);
    if (recent.some(c => BIG.has(c.kind)) || localDiffs[e.id]) {
      const c = recent.find(c => BIG.has(c.kind));
      return `<span class="flag chg" title="${esc(c ? (KIND[c.kind] || KIND.other).l + (c.from || c.to ? ': ' + (c.from || '') + ' → ' + (c.to || '') : '') : 'Дата или статус изменились с вашего прошлого визита')}">изменено</span>`;
    }
    if (recent.some(c => c.kind === 'new')) return '<span class="flag new">новое</span>';
    return '';
  }
  function changeItem(e, c, withTitle) {
    const k = KIND[c.kind] || KIND.other, t = new Date(c.at);
    const diff = (c.from || c.to) ? `<div class="cd">${c.from ? `<s>${esc(c.from)}</s> → ` : ''}<b>${esc(c.to || '')}</b></div>` : '';
    const note = (c.note || c.source) ? `<div class="cn">${c.note ? wl(c.note) : ''}${c.source && c.source.url ? ` <a href="${esc(c.source.url)}" target="_blank" rel="noopener">${esc(c.source.name || 'источник')}</a>` : ''}</div>` : '';
    return `<div class="citem" style="--tc:var(--t-${typeOf(e)})"><span class="ct">${withTitle ? fTime.format(t) : fShort.format(t)}</span>
      <div class="ck"><span class="kchip" style="--kc:${k.c}">${k.l}</span>${withTitle ? `<button type="button" data-open="${esc(e.id)}">${esc(e.title)}</button>` : ''}</div>${diff}${note}</div>`;
  }
  function renderChgCount() {
    const n = allChanges(1).length, b = $('#chgCount');
    if (!b) return; b.hidden = !n; b.textContent = n;
  }
  function openChanges() {
    state.help = true; state.pane = 'changes'; markCurrent();

    detail.style.setProperty('--tc', 'var(--st-preliminary)');
    try { history.replaceState(null, '', '#changes'); } catch (err) {}
    wikiUsed = new Set();
    const list = allChanges(14), groups = [];
    list.forEach(x => { const k = dayKey(new Date(x.c.at)); let g = groups.find(y => y.k === k); if (!g) groups.push(g = { k, items: [] }); g.items.push(x); });
    const body = groups.map(g => { const d = new Date(g.k + 'T12:00:00+03:00'); return `<div class="cday">${esc(fDay.format(d))} · ${esc(relDays(d, new Date()))}</div><div class="clog">${g.items.map(x => changeItem(x.e, x.c, true)).join('')}</div>`; }).join('');
    const html = `<section class="hero" style="grid-template-columns:minmax(0,1fr)"><div class="main"><h2 id="drTitle">Лента изменений</h2>
        <div class="when"><span class="big">за 14 дней</span>${navHtml(null)}</div>
        <div class="brief-meta"><span>Переносы, смена статуса и времени, отмены, новые события, итоги. Изменения дат — главная защита от устаревшей даты в эфире.</span></div></div></section>
      <section class="blk">${body || '<p class="small" style="margin:0">Изменений за две недели нет.</p>'}</section>`;
    paint(html, `<button type="button" class="pillbtn" id="backBtn">Вернуться к событию</button>`, '', 'changes:' + list.length, false);
    sheetOpen();
  }

  /* ------------------------------------------------------ бриф к эфиру */
  const todayKey = () => dayKey(new Date());
  function autoBrief(now) {
    const H24 = now.getTime() + 24 * H, tomorrowEnd = dayStart(new Date(now.getTime() + 2 * D)).getTime() - 1;
    const imp = e => ({ monetary: 0, state: 1, summits: 2, elections: 2, data: 3, energy: 3, tech: 4, corp: 4 }[typeOf(e)] ?? 5);
    const upcoming = state.events.filter(e => { const t = times(e); if (!t.s || e.dateStatus === 'cancelled') return false; const ph = phase(e, now); return ph === 'live' || (ph === 'upcoming' && t.s.getTime() <= H24); })
      .sort((a, b) => (phase(b, now) === 'live') - (phase(a, now) === 'live') || imp(a) - imp(b) || when(a) - when(b)).slice(0, 5);
    const outcomes = state.events.filter(e => e.outcome && e.outcome.decided && !e.outcome.backfilled && (now - new Date(e.outcome.filledAt || 0)) < 36 * H)
      .sort((a, b) => imp(a) - imp(b)).slice(0, 4);
    const sayDays = new Set([todayKey(), dayKey(new Date(now.getTime() - D))]);
    const says = [];
    state.events.forEach(e => (e.statements || []).forEach(x => { if (sayDays.has(x.date)) says.push({ e, x }); }));
    says.sort((a, b) => (b.x.date || '').localeCompare(a.x.date || '') || (b.x.kind === 'quote') - (a.x.kind === 'quote'));
    const upIds = new Set(upcoming.map(e => e.id));
    const tomorrow = state.events.filter(e => { const t = times(e); return t.s && !upIds.has(e.id) && e.dateStatus !== 'cancelled' && t.s.getTime() > H24 && t.s.getTime() <= tomorrowEnd; })
      .sort((a, b) => imp(a) - imp(b) || when(a) - when(b)).slice(0, 4);
    const tm = e => { const t = times(e); if (!t.s) return e.dateWording || ''; if (phase(e, now) === 'live') return 'идёт'; return (dayKey(t.s) === todayKey() ? 'сегодня' : fDay.format(t.s)) + (e.allDay ? '' : ', ' + fTime.format(t.s)); };
    return {
      date: todayKey(), auto: true,
      sections: [
        { title: 'Главное на сегодня', items: upcoming.map(e => ({ eventId: e.id, time: tm(e), title: e.title, text: airText(e) })) },
        { title: 'Итоги за сутки', items: outcomes.map(e => ({ eventId: e.id, title: e.title, text: e.outcome.decided })) },
        { title: 'Заявления дня', items: says.slice(0, 5).map(({ e, x }) => ({ eventId: e.id, title: e.title, quote: x.kind === 'quote', text: x.text, who: [x.who, x.role].filter(Boolean).join(', ') })) },
        { title: 'Что ждать завтра', items: tomorrow.map(e => ({ eventId: e.id, time: tm(e), title: e.title, text: airText(e) })) },
      ].filter(sec => sec.items.length),
    };
  }
  function currentBrief(now) {
    const b = state.briefs[todayKey()];
    return b && Array.isArray(b.sections) && b.sections.length ? b : autoBrief(now);
  }
  function briefText(b) {
    const out = [];
    const d = new Date(b.date + 'T12:00:00+03:00');
    out.push(`БРИФ К ЭФИРУ — ${fWdLong.format(d)}, ${fDay.format(d)}`);
    if (b.lead) out.push('', b.lead);
    b.sections.forEach(sec => {
      out.push('', sec.title.toUpperCase());
      sec.items.forEach((it, i) => {
        out.push(`${i + 1}. ${it.title}${it.time ? ' — ' + it.time : ''}`);
        out.push(it.quote ? `«${it.text}»${it.who ? ' — ' + it.who : ''}` : it.text + (it.who ? ' — ' + it.who : ''));
      });
    });
    return out.join('\n');
  }
  function openBrief() {
    state.help = true; state.pane = 'brief'; markCurrent(); $('#chgBtn').setAttribute('aria-pressed', 'false');
    detail.style.setProperty('--tc', 'var(--accent)');
    try { history.replaceState(null, '', '#brief'); } catch (err) {}
    $('#briefBtn').setAttribute('aria-pressed', 'true');
    const now = new Date(), b = currentBrief(now), d = new Date(b.date + 'T12:00:00+03:00');
    wikiUsed = new Set();
    const gen = b.auto ? '<span class="src">собран автоматически из карточек</span><span>выверенный бриф Claude появится в 16:43</span>'
      : `<span class="src">собран Claude</span><span>${b.generatedAt ? esc(fTime.format(new Date(b.generatedAt))) + ' мск' : ''}</span>`;
    const secs = b.sections.map(sec => `<section class="blk${sec.title === 'Главное на сегодня' ? ' cpb' : ''}">${lab(esc(sec.title))}${sec.items.map((it, i) => {
      const ev = state.events.find(x => x.id === it.eventId);
      const tc = ev ? `--tc:var(--t-${typeOf(ev)})` : '';
      return `<div class="bitem" style="${tc}"><span class="num">${i + 1}</span><div class="bt">${ev ? `<button type="button" data-open="${esc(ev.id)}">${esc(it.title)}</button>` : `<b>${esc(it.title)}</b>`}${it.time ? `<span class="tm2">${esc(it.time)}</span>` : ''}</div>
        <p>${it.quote ? '«' + wl(it.text) + '»' : wl(it.text)}</p>${it.who ? `<span class="who">${wl(it.who)}</span>` : ''}</div>`;
    }).join('')}</section>`).join('');
    const empty = b.sections.length ? '' : '<div class="pending">На ближайшие сутки в карте нет событий. Загляните в горизонт «2 недели».</div>';
    const html = `<section class="hero" style="grid-template-columns:minmax(0,1fr)"><div class="main"><h2 id="drTitle">Бриф к эфиру</h2>
        <div class="when"><span class="big">${esc(fWdLong.format(d))}, ${esc(fDay.format(d))}</span>${navHtml(null)}</div>
        <div class="brief-meta">${gen}</div></div></section>
      ${b.lead ? `<p class="brief-lead">${wl(b.lead)}</p>` : ''}${secs}${empty}`;
    const foot = `<button type="button" class="pillbtn" id="copyBrief">Копировать весь бриф</button><button type="button" class="pillbtn" id="backBtn">Вернуться к событию</button>`;
    paint(html, foot, '', 'brief:' + b.date + ':' + (b.auto ? 'a' : b.generatedAt), false);
    sheetOpen();
  }
  function openHelp() {
    state.help = true; state.pane = 'help'; $('#briefBtn').setAttribute('aria-pressed', 'false'); $('#chgBtn').setAttribute('aria-pressed', 'false'); markCurrent(); detail.style.setProperty('--tc', 'var(--accent)');
    const html = `<section class="hero" style="grid-template-columns:minmax(0,1fr)"><div class="main"><h2 id="drTitle">Как читать карту</h2><div class="when">${navHtml(null)}</div></div></section>
      <section>${lab('Статус даты')}<div class="legend">
        <div>${stTag('confirmed', true)}<p>Назначена официальным документом: указом, календарём организатора, решением избиркома.</p><span class="ex">в эфире: «23 октября в 13:30»</span></div>
        <div>${stTag('preliminary', true)}<p>Дата известна, но не закреплена: практика прошлых лет, агрегаторы, оговорки организатора. Время помечено знаком ≈.</p><span class="ex">в эфире: «ориентировочно…»</span></div>
        <div>${stTag('expected', true)}<p>Событие ожидается в окне — «к декабрю», «в октябре», — конкретный день не назначен.</p><span class="ex">в эфире: «ожидается до…, дата не назначена»</span></div>
        <div>${stTag('cancelled', true)}<p>Отменено или перенесено за пределы горизонта.</p></div></div></section>
      <section>${lab('Тип события — цвет')}<div class="tlegend">${TYPES.map(t => `<div><span class="ty" style="--tc:var(--t-${t.id})"><i></i>${t.label}</span><span class="d">${t.d}</span></div>`).join('')}</div></section>
      <section>${lab('Блоки карточки')}<dl class="kv"><dt>Что на обсуждении</dt><dd>Участники и пункты повестки — только то, что подтверждено организатором.</dd><dt>Консенсус</dt><dd>У решений ЦБ и публикаций статистики: прошлое значение, ожидание аналитиков и рынка, после события — факт и вердикт «совпало», «выше» или «ниже ожиданий». Короткий ориентир виден прямо в строке ленты.</dd><dt>Возможные решения</dt><dd>Сценарии редакции: чего можно ждать по итогам. Это оценка, а не факт.</dd><dt>Изменения</dt><dd>Метка «изменено» на строке — за двое суток у события сдвинулась дата, время или статус либо это замечено с вашего прошлого визита; «новое» — событие только что добавлено. Кнопка «Изменения» в шапке открывает ленту за 14 дней, в карточке — «История изменений».</dd><dt>Бриф к эфиру</dt><dd>Кнопка в шапке: главное на сегодня, итоги за сутки, заявления дня и что ждать завтра — одним текстом, который копируется целиком. В 16:43 мск Claude собирает выверенный бриф; до этого бриф собирается автоматически из карточек.</dd><dt>Ссылки</dt><dd>Названия организаций, форумов, компаний и имена персон ведут на статьи Википедии — только первое упоминание в карточке.</dd><dt>Заявления</dt><dd>Главные высказывания по итогам каждого дня события. В кавычках — дословная цитата по источнику, без кавычек — пересказ.</dd><dt>Контрольная точка</dt><dd>Следующий момент, когда по событию появится определённость: итоговый документ, результаты голосования, следующее заседание. Туда стоит вернуться после эфира.</dd><dt>Для эфира</dt><dd>Короткая справка радийным языком: что происходит, когда и чего ждать. Дата в ней сформулирована по статусу — с оговоркой, если она не подтверждена.</dd></dl></section>
      <section>${lab('Итоги')}<p style="margin:0;font-size:13.5px">Когда событие закончилось, оно уходит в «Историю» с отметкой «ждёт итога». Дважды в день, в 06:47 и 15:47 мск, Claude собирает итог по официальным документам и СМИ и записывает его в формате «ожидали → решили → что осталось открытым». Так календарь помнит, что от события ждали и чем оно закончилось.</p></section>
      <section>${lab('Управление')}<dl class="kv"><dt>Клавиши</dt><dd>↑ ↓ — предыдущее и следующее событие в списке</dd><dt>Ссылка</dt><dd>У каждой карточки своя ссылка — её можно переслать</dd></dl></section>`;
    paint(html, `<button type="button" class="pillbtn" id="backBtn">Вернуться к событию</button>`, 'Справка', 'help', false);
    sheetOpen();
  }

  /* ------------------------------------------------------ взаимодействие */
  const toastEl = $('#toast');
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1800); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать — выделите текст вручную'); } }

  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-open],[data-hz],[data-cat],[data-st],[data-pin],[data-copy],[data-copylink],button');
    if (!t) return;
    const d = t.dataset;
    if (d.open) { showEvent(d.open); return; }
    if (d.hz) { if (state.horizon !== d.hz) { state.horizon = d.hz; store.set('horizon', d.hz); state.animate = true; render(); requestAnimationFrame(() => moveInk(true)); } return; }
    if (d.cat) { d.cat === '__clear' ? state.cats.clear() : (state.cats.has(d.cat) ? state.cats.delete(d.cat) : state.cats.add(d.cat)); store.set('cats', [...state.cats]); state.animate = true; render(); return; }
    if (d.copy) { const e = state.events.find(x => x.id === d.copy); if (e) copy(airText(e)); return; }
    if (d.copylink) { copy(location.href.split('#')[0] + '#' + d.copylink); return; }
    if (t.id === 'drClose') { sheetClose(); return; }
    if (t.id === 'backBtn') { state.help = false; showEvent(state.openId || state.order[0]); return; }
    if (t.id === 'drPrev' || t.id === 'drNext') { step(t.id === 'drNext' ? 1 : -1); return; }
    if (t.id === 'helpBtn') { openHelp(); return; }
    if (t.id === 'briefBtn') { if (state.pane === 'brief') { state.help = false; state.pane = ''; showEvent(state.openId || state.order[0]); } else openBrief(); return; }
    if (t.id === 'chgBtn') { if (state.pane === 'changes') { state.help = false; state.pane = ''; showEvent(state.openId || state.order[0]); } else openChanges(); return; }
    if (t.id === 'copyBrief') { copy(briefText(currentBrief(new Date()))); return; }
    if (t.id === 'themeBtn') {
      const r = document.documentElement, cur = r.getAttribute('data-theme');
      const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.setAttribute('data-theme', dark ? 'light' : 'dark'); store.set('theme', r.getAttribute('data-theme'));
    }
  });
  scrim.addEventListener('click', sheetClose);
  function step(dir) {
    if (!state.order.length) return;
    const i = Math.max(0, Math.min(state.order.length - 1, state.order.indexOf(state.openId) + dir));
    showEvent(state.order[i], { keepSheet: true });
    const row = document.querySelector(`#feed .row[data-open="${CSS.escape(state.order[i])}"]`);
    if (row && !narrow()) row.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }
  document.addEventListener('keydown', ev => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
    if (typing) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); step(ev.key === 'ArrowDown' ? 1 : -1); }
    else if (ev.key === 'Escape') sheetClose();
  });
  let qt; $('#q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); state.animate = true; render(); }, 160); });
  addEventListener('resize', () => { moveInk(false); fitTitle(); setTopH(); if (!narrow()) { sheetClose(); } });
  function setTopH() { document.documentElement.style.setProperty('--toph', $('.top').offsetHeight + 'px'); }
  setTopH();

  /* ---------------------------------------------------------- старт */
  function tick() { const n = new Date(); const c = $('#clock'); c.textContent = `${fTime.format(n)} мск`; c.title = `${fWd.format(n)}, ${fShort.format(n).replace('.', '')}`; }
  tick(); setInterval(tick, 20e3);
  setInterval(() => { if (state.loaded) render(); }, 5 * 60e3);
  const th = store.get('theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveInk(false); setTopH(); });

  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { $('#feed').innerHTML = '<div class="empty"><b>База событий недоступна в этом просмотре</b>Карточки и итоги хранятся в базе терминала. Откройте страницу по ссылке claude.ai, войдя в аккаунт.</div>'; return; }
    db.collection('events').onSnapshot(snap => {
      const first = !state.loaded;
      state.events = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => e.title);
      state.loaded = true; if (first) state.animate = true;
      if (!state.events.length) { $('#feed').innerHTML = '<div class="empty"><b>Карта пока пуста</b>События появятся после первого прогона наполнения.</div>'; return; }
      const h = location.hash.slice(1);
      if (first && h && state.events.some(e => e.id === h)) {
        const e = state.events.find(x => x.id === h), now = new Date();
        const hz = HORIZONS.find(z => inHorizon(e, now, z));
        if (hz && hz.id !== state.horizon) state.horizon = hz.id;
        state.cats.clear(); state.openId = h;
      }
      if (first) diffSinceVisit();
      render(); renderChgCount();
      if (first && h === 'brief') openBrief();
      if (first && h === 'changes') openChanges();
      if (!first && state.pane === 'changes') openChanges();
    }, err => { $('#feed').innerHTML = `<div class="empty"><b>Связь с базой прервалась</b>Обновите страницу. Код: ${esc(err && err.code)}</div>`; });
    db.doc('meta/links').onSnapshot(d => { const ex = d.exists ? (d.data().entries || []).map(x => [x.terms, x.url]).filter(x => Array.isArray(x[0]) && typeof x[1] === 'string' && /^https:\/\/[a-z]{2,3}\.wikipedia\.org\/wiki\//.test(x[1])) : []; buildWiki(ex); if (state.openId && !state.help) showEvent(state.openId, { quiet: true }); }, () => {});
    db.collection('briefs').onSnapshot(snap => { state.briefs = {}; snap.docs.forEach(d => { state.briefs[d.id] = { date: d.id, ...d.data() }; }); if (state.pane === 'brief') openBrief(); }, () => {});
    db.doc('meta/status').onSnapshot(d => { state.meta = d.exists ? d.data() : null; renderRun(new Date()); }, () => {});
  })();
})();
</script>
