<title>Головоломки Веги и Наи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* ============================================================
   Головоломки Веги и Наи
   Один визуальный мир: рисунок на прищепке, красный стол.
   Тема одна, все цвета заданы явно.
   ============================================================ */
:root{
  --table:#8d2b2c;
  --table-deep:#5f1b20;
  --paper:#f7f1e4;
  --paper-2:#ebe0cc;
  --paper-3:#ded0b8;
  --ink:#2a2622;
  --ink-soft:#6f6459;
  --orange:#e4572e;
  --orange-deep:#b83d1c;
  --blue:#2e9bc9;
  --blue-deep:#1c6f94;
  --green:#4f9e63;
  --amber:#e2a32b;
  --jeans:#9a928c;
  --hoof:#2f2a26;
  --skin:#f9ece0;
  --hair:#e7dbc7;
  --radius-hand:220px 18px 200px 20px/20px 200px 22px 220px;
  --radius-hand-2:16px 190px 20px 210px/210px 20px 190px 18px;
  --shadow-paper:0 22px 50px rgba(40,8,10,.42), 0 3px 0 rgba(255,255,255,.35) inset;
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 90% at 50% -10%, #a8393a 0%, var(--table) 42%, var(--table-deep) 100%),
    var(--table);
  padding:26px 16px 60px;
}
body::before{
  /* мелкая крошка лака на столе */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(rgba(0,0,0,.5) .6px, transparent .7px);
  background-size:4px 4px;
}

/* ---------- лист бумаги ---------- */
.sheet{
  position:relative;
  max-width:1140px;margin:0 auto;
  background:
    linear-gradient(103deg, rgba(255,255,255,.55) 0 12%, rgba(0,0,0,0) 40%),
    repeating-linear-gradient(0deg, rgba(42,38,34,.045) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(42,38,34,.035) 0 1px, transparent 1px 26px),
    var(--paper);
  border-radius:6px 10px 8px 12px;
  box-shadow:var(--shadow-paper);
  padding:44px 30px 34px;
  transform:rotate(-.35deg);
}
.sheet::after{
  content:"";position:absolute;inset:8px;border:1px dashed rgba(42,38,34,.16);
  border-radius:4px;pointer-events:none;
}
.peg{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(2deg);
  width:34px;height:70px;filter:drop-shadow(0 6px 6px rgba(40,8,10,.45));
}

/* ---------- шапка ---------- */
.head{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;
  justify-content:space-between;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:22px;
}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{
  font-family:Unbounded,Nunito,sans-serif;font-weight:700;
  font-size:clamp(21px,3.4vw,32px);margin:0;letter-spacing:-.02em;text-wrap:balance;
}
.brand h1 em{font-style:normal;color:var(--orange)}
.brand h1 b{font-weight:700;color:var(--blue-deep)}
.brand p{margin:0;font-family:Caveat,cursive;font-size:19px;color:var(--ink-soft)}
.head-right{display:flex;align-items:center;gap:14px}
.stickers{display:flex;gap:6px}
.stickers .slot{
  width:34px;height:34px;border-radius:50%;
  border:2px dashed rgba(42,38,34,.3);
  display:grid;place-items:center;background:rgba(255,255,255,.4);
}
.stickers .slot.on{border:2px solid var(--ink);background:#fff;box-shadow:0 2px 0 rgba(42,38,34,.5)}
.stickers .slot svg{width:22px;height:22px;opacity:.18}
.stickers .slot.on svg{opacity:1}
.iconbtn{
  border:2px solid var(--ink);background:var(--paper);cursor:pointer;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 3px 0 var(--ink);transition:transform .12s, box-shadow .12s;
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.iconbtn svg{width:20px;height:20px;fill:var(--ink)}

/* ---------- сетка ---------- */
.grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:26px;align-items:stretch}
@media (max-width:860px){
  .grid{grid-template-columns:1fr;gap:14px}
  .sheet{padding:38px 16px 26px}
}

/* ---------- сцена с героинями ---------- */
.stage{
  position:relative;
  border:2px solid var(--ink);border-radius:var(--radius-hand);
  background:
    radial-gradient(80% 60% at 50% 100%, rgba(228,87,46,.12), transparent 70%),
    linear-gradient(180deg, rgba(46,155,201,.10), rgba(255,255,255,0) 55%),
    var(--paper-2);
  padding:14px 10px 8px;display:flex;flex-direction:column;
}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:2px;flex:1;min-height:300px}
.char{width:48%;max-width:190px;height:auto;overflow:visible}
@media (max-width:860px){
  .duo{min-height:0}
  .char{max-width:132px}
}
.nameplates{display:flex;justify-content:center;gap:10px;margin-top:6px}
.plate{
  font-family:Caveat,cursive;font-size:18px;font-weight:700;
  padding:1px 12px;border-radius:var(--radius-hand-2);
  border:2px solid var(--ink);background:#fff;min-width:76px;text-align:center;
  outline:none;cursor:text;
}
.plate.v{color:var(--orange-deep)}
.plate.n{color:var(--blue-deep)}
.plate:focus{box-shadow:0 0 0 3px rgba(226,163,43,.55)}
.plate-hint{
  text-align:center;font-family:Caveat,cursive;color:var(--ink-soft);
  font-size:15px;margin:2px 0 2px;
}

/* реплики */
.bubble{
  position:absolute;max-width:150px;z-index:4;
  font-family:Caveat,cursive;font-size:18px;line-height:1.15;
  background:#fff;border:2px solid var(--ink);border-radius:var(--radius-hand-2);
  padding:7px 11px;box-shadow:0 3px 0 rgba(42,38,34,.55);
  opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;
  transition:opacity .22s ease, transform .22s cubic-bezier(.3,1.6,.5,1);
}
.bubble.show{opacity:1;transform:translateY(0) scale(1)}
.bubble.v{left:2px;top:6px}
.bubble.n{right:2px;top:44px}
.bubble::after{
  content:"";position:absolute;bottom:-11px;width:12px;height:12px;
  background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(35deg);
}
.bubble.v::after{left:26px}
.bubble.n::after{right:26px}

/* ---------- панель ---------- */
.panel{
  border:2px solid var(--ink);border-radius:var(--radius-hand-2);
  background:#fffdf7;padding:22px 22px 26px;
  box-shadow:6px 6px 0 rgba(42,38,34,.14);
  display:flex;flex-direction:column;gap:16px;min-height:420px;
}
.eyebrow{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
  color:var(--ink-soft);display:flex;align-items:center;gap:8px;
}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--orange)}
.q{
  font-family:Unbounded,Nunito,sans-serif;font-weight:500;
  font-size:clamp(17px,2.2vw,22px);line-height:1.45;margin:0;text-wrap:balance;
  max-width:34ch;
}
.q .mono{font-family:Nunito;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lead{font-size:16px;line-height:1.6;color:var(--ink-soft);margin:0;max-width:60ch}

.hearts{display:flex;gap:5px;margin-left:auto}
.hearts svg{width:22px;height:22px}
.hearts .h{fill:var(--orange)}
.hearts .h.off{fill:none;stroke:rgba(42,38,34,.35);stroke-width:2}

/* варианты */
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (max-width:680px){.opts{grid-template-columns:1fr!important}}
.opt{
  font:600 16px/1.35 Nunito,sans-serif;color:var(--ink);text-align:left;
  background:var(--paper);border:2px solid var(--ink);border-radius:14px 4px 14px 4px;
  padding:13px 15px;cursor:pointer;display:flex;gap:10px;align-items:center;
  box-shadow:0 4px 0 rgba(42,38,34,.75);transition:transform .1s, box-shadow .1s, background .15s;
}
.opt .mark{
  flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff;
}
.opt:hover{background:#fff}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 rgba(42,38,34,.75)}
.opt:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.opt.picked{background:#fff;border-color:var(--blue-deep);box-shadow:0 4px 0 var(--blue-deep)}
.opt.picked .mark{background:var(--blue);color:#fff;border-color:var(--blue-deep)}
.opt.right{background:#e8f5e9;border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.right .mark{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:#fdeceb;border-color:var(--orange-deep);box-shadow:0 4px 0 var(--orange-deep);opacity:.85}
.opt[disabled]{cursor:default}

/* поле ввода */
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer input{
  font:800 22px/1 Nunito,sans-serif;color:var(--ink);letter-spacing:.04em;
  padding:12px 16px;width:min(280px,100%);background:var(--paper);
  border:2px solid var(--ink);border-radius:12px 4px 12px 4px;outline:none;
}
.answer input:focus{box-shadow:0 0 0 3px rgba(226,163,43,.5)}
.suffix{font-weight:800;font-size:18px;color:var(--ink-soft)}

.btn{
  font:800 16px/1 Nunito,sans-serif;color:#fff;cursor:pointer;
  background:var(--ink);border:2px solid var(--ink);border-radius:14px 5px 14px 5px;
  padding:14px 22px;box-shadow:0 4px 0 rgba(42,38,34,.45);
  transition:transform .1s, box-shadow .1s, background .15s;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.btn--go{background:var(--orange);border-color:var(--orange-deep);box-shadow:0 4px 0 var(--orange-deep)}
.btn--calm{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(42,38,34,.75)}
.btn--blue{background:var(--blue);border-color:var(--blue-deep);box-shadow:0 4px 0 var(--blue-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:auto}

/* отклик */
.note{
  border-left:5px solid var(--amber);background:#fff8e8;
  padding:11px 14px;border-radius:0 12px 12px 0;font-size:15px;line-height:1.5;max-width:60ch;
}
.note b{font-family:Unbounded,Nunito,sans-serif;font-weight:500;font-size:13px;letter-spacing:.02em}
.note.good{border-color:var(--green);background:#eef7ef}
.note.hand{font-family:Caveat,cursive;font-size:19px;line-height:1.25}

/* карта глав */
.chapters{display:grid;gap:12px}
.ch{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  border:2px solid var(--ink);background:var(--paper);
  border-radius:16px 5px 16px 5px;padding:13px 16px;text-align:left;cursor:pointer;
  box-shadow:0 4px 0 rgba(42,38,34,.75);transition:transform .1s, box-shadow .1s;
}
.ch:active{transform:translateY(4px);box-shadow:0 0 0}
.ch:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.ch .num{
  font-family:Unbounded,sans-serif;font-weight:700;font-size:19px;
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--ink);background:#fff;
}
.ch .t{font-weight:800;font-size:17px}
.ch .s{font-size:14px;color:var(--ink-soft)}
.ch .st svg{width:30px;height:30px}
.ch.locked{opacity:.5;cursor:not-allowed;box-shadow:none}
.ch.done .num{background:var(--green);color:#fff;border-color:var(--green)}

.big{
  font-family:Unbounded,Nunito,sans-serif;font-weight:700;
  font-size:clamp(24px,4vw,38px);margin:0;line-height:1.15;text-wrap:balance;
}
.tally{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tally div{display:flex;flex-direction:column}
.tally b{font-family:Unbounded,sans-serif;font-size:26px;font-weight:700}
.tally span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}

.foot{
  margin:18px auto 0;max-width:1140px;text-align:center;
  font-family:Caveat,cursive;font-size:18px;color:rgba(255,255,255,.72);
}

canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ============================================================
   ГЕРОИНИ: анатомия и мимика
   ============================================================ */
.char .ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.char .hair{fill:var(--hair);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char .skin{fill:var(--skin);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char .fill-skin{fill:var(--skin)}
.char .ear-in{fill:#e6d6c6;stroke:var(--ink);stroke-width:2}
.char .tuft{fill:var(--hair);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.char .pants{fill:var(--jeans);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char .hoof{fill:var(--hoof);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char .belt{fill:#3a352f;stroke:var(--ink);stroke-width:2.5}
.char--vega .top{fill:var(--orange);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char--naya .top{fill:var(--blue);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.char .pupil{fill:#241f1d}
.char .glint{fill:#fff}
.char .iris{fill:none;stroke:#fff;stroke-width:3;opacity:.85}
.char .blush{fill:#e98d7a;opacity:.55}
.char .brow{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
.char .mouth{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.char .mouth.filled{fill:#5a2f2f}
.char .lid{fill:var(--skin);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;opacity:0}
.char .tear{fill:#8ecae6;stroke:var(--ink);stroke-width:2;opacity:0}
.char .sparks{opacity:0}
.char .sparks path{fill:var(--amber)}

/* мимика по состоянию сцены */
.m-open{display:block}
.m-joy,.m-skeptic,.m-sad,.m-fun{display:none}
.eyes-happy{display:none}

[data-mood="joy"] .m-open,[data-mood="fun"] .m-open,
[data-mood="skeptic"] .m-open,[data-mood="sad"] .m-open{display:none}
[data-mood="joy"] .m-joy{display:block}
[data-mood="fun"] .m-fun{display:block}
[data-mood="skeptic"] .m-skeptic{display:block}
[data-mood="sad"] .m-sad{display:block}

[data-mood="joy"] .eyes-open,[data-mood="fun"] .eyes-open{display:none}
[data-mood="joy"] .eyes-happy,[data-mood="fun"] .eyes-happy{display:block}
[data-mood="joy"] .blush,[data-mood="fun"] .blush{opacity:.85}
[data-mood="joy"] .sparks,[data-mood="fun"] .sparks{opacity:1}

[data-mood="skeptic"] .lid{opacity:1;transform:translateY(-7px)}
[data-mood="skeptic"] .brow-l{transform:translate(0,-7px) rotate(-13deg)}
[data-mood="skeptic"] .brow-r{transform:translate(0,3px) rotate(-4deg)}
[data-mood="skeptic"] .head-grp{transform:rotate(-5deg)}

[data-mood="sad"] .lid{opacity:1;transform:translateY(-3px) rotate(0deg)}
[data-mood="sad"] .brow-l{transform:translate(0,-2px) rotate(16deg)}
[data-mood="sad"] .brow-r{transform:translate(0,-2px) rotate(-16deg)}
[data-mood="sad"] .tear{opacity:1;animation:drop 1.9s ease-in infinite}
[data-mood="sad"] .head-grp{transform:translateY(6px) rotate(3deg)}
[data-mood="sad"] .ears{transform:translateY(6px) rotate(0);}
[data-mood="sad"] .ear-l{transform:rotate(24deg)}
[data-mood="sad"] .ear-r{transform:rotate(-24deg)}
[data-mood="sad"] .body-sway{transform:translateY(5px)}

.char .head-grp,.char .brow-l,.char .brow-r,.char .lid,
.char .ear-l,.char .ear-r,.char .ears,.char .body-sway{
  transform-box:fill-box;transform-origin:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.char .ear-l{transform-origin:80% 90%}
.char .ear-r{transform-origin:20% 90%}
.char .brow-l,.char .brow-r{transform-origin:center}

/* дыхание, моргание, покачивание */
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes twitch{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}96%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px)}55%{transform:translateY(0)}70%{transform:translateY(-8px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-14px) rotate(0)}50%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-14px) rotate(0)}}
@keyframes shakehead{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-1deg)}}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes sparkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(25deg);opacity:1}}

.char .body-sway{animation:breathe 4.2s ease-in-out infinite}
.char--naya .body-sway{animation-duration:5s;animation-delay:-1.4s}
.char .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 6.5s infinite}
.char--naya .eyes-open{animation-duration:8.2s;animation-delay:-2s}
.char .mane{transform-box:fill-box;transform-origin:top center;animation:sway 6s ease-in-out infinite}
.char--naya .mane{animation-duration:7.4s;animation-delay:-2.6s}
.char .ears{animation:twitch 9s ease-in-out infinite}
.char--naya .ears{animation-duration:11s;animation-delay:-3s}
.char .sparks path{transform-box:fill-box;transform-origin:center;animation:sparkle 1.2s ease-in-out infinite}
.char .sparks path:nth-child(2){animation-delay:-.4s}
.char .sparks path:nth-child(3){animation-delay:-.8s}

[data-mood="joy"] .char .body-sway{animation:hop .75s ease-out 1}
[data-mood="fun"] .char .body-sway{animation:dance 1.1s ease-in-out infinite}
[data-mood="fun"] .char--naya .body-sway{animation-delay:-.55s}
[data-mood="skeptic"] .char--vega .head-grp{animation:shakehead .9s ease-in-out 2}

@media (prefers-reduced-motion:reduce){
  .char *,.bubble,.opt,.btn,.ch{animation:none!important;transition:none!important}
}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<div class="sheet">
  <svg class="peg" viewBox="0 0 34 70" aria-hidden="true">
    <path d="M4 8c0-4 4-6 13-6s13 2 13 6v54c0 4-5 6-13 6S4 66 4 62Z" fill="#d9b071" stroke="#2a2622" stroke-width="2.4"/>
    <path d="M4 26h26M4 40h26" stroke="#2a2622" stroke-width="2" opacity=".5"/>
    <circle cx="17" cy="33" r="4.5" fill="#f7f1e4" stroke="#2a2622" stroke-width="2.2"/>
  </svg>

  <header class="head">
    <div class="brand">
      <h1>Головоломки <em>Веги</em> и <b>Наи</b></h1>
      <p>15 задачек на логику · для тех, кому 10–13</p>
    </div>
    <div class="head-right">
      <div class="stickers" id="stickers" aria-label="Собранные наклейки"></div>
      <button class="iconbtn" id="sound" aria-label="Звук" title="Звук вкл/выкл">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="grid">
    <!-- ================= СЦЕНА ================= -->
    <section class="stage" id="stage" data-mood="idle" aria-label="Вега и Ная">
      <div class="bubble v" id="bub-v"></div>
      <div class="bubble n" id="bub-n"></div>

      <div class="duo">
        <!-- ---------- ВЕГА ---------- -->
        <svg class="char char--vega" viewBox="0 0 240 380" role="img" aria-label="Вега — в оранжевом свитере">
          <defs>
            <path id="v-mane" class="hair" d="M114 42C72 42 40 76 40 124c0 34-10 76-24 120l28-20-2 34 22-26 6 32 18-28 8 24 10-46c-14-38-16-106 8-172Z"/>
            <g id="v-ear">

  const save = Object.assign({done:[], names:{v:'Вега', n:'Ная'}, muted:false}, load());
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }

  function tone(f, at, type, dur, vol){
    if (save.muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime + (at||0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || .16, t0 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || .16));
      o.start(t0); o.stop(t0 + (dur || .16) + .03);
    } catch(e){}
  }
  const sndRight = () => { tone(660,0,'triangle',.14); tone(880,.1,'triangle',.2); };
  const sndWrong = () => { tone(210,0,'square',.12,.1); tone(150,.1,'square',.18,.1); };
  const sndWin   = () => [523,659,784,1046].forEach((f,i)=>tone(f,i*.1,'triangle',.3));
  const sndSad   = () => [392,330,262].forEach((f,i)=>tone(f,i*.15,'sine',.35));

  /* ---------------- реплики ---------------- */
  const LINES = {
    idle:   [['Ну что, начнём?','Блокнот наготове.'], ['Задачки уже ждут.','Я всё записываю.']],

    skeptic:[['Хм. Точно?','Давай ещё разок.'], ['Я бы перепроверила.','Почти-почти.'], ['Не-а.','Смотри внимательнее.']],
    sad:    [['Задачки коварные…','Мы попробуем снова.'], ['Обидно.','Ничего, я запомнила ходы.']],
    fun:    [['МЫ ЭТО СДЕЛАЛИ!','Танцуем!'], ['Глава наша!','Наклейка заслужена.']]
  };
  let moodTimer = null;
  function mood(m, custom){
    clearTimeout(moodTimer);
    stage.dataset.mood = m;
    const pool = LINES[m] || LINES.idle;
    const pair = custom || pool[Math.floor(Math.random()*pool.length)];
    say(pair[0], pair[1]);
    if (m === 'joy' || m === 'skeptic'){
      moodTimer = setTimeout(()=>{ stage.dataset.mood = 'idle'; hide(); }, 2600);
    }
  }
  const bv = $('#bub-v'), bn = $('#bub-n');
  function say(a, b){
    bv.textContent = a; bn.textContent = b;
    bv.classList.add('show');
    setTimeout(()=>bn.classList.add('show'), 320);
  }
  function hide(){ bv.classList.remove('show'); bn.classList.remove('show'); }

  /* ---------------- конфетти ---------------- */
  const cvs = $('#confetti'), ctx = cvs.getContext('2d');
  let bits = [], raf = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){ cvs.width = innerWidth; cvs.height = innerHeight; }
  addEventListener('resize', fit); fit();
  function burst(n){
    if (reduce) return;
    const cols = ['#e4572e','#2e9bc9','#e2a32b','#4f9e63','#f7f1e4'];
    for (let i=0;i<n;i++) bits.push({
      x: innerWidth*(.25+Math.random()*.5), y: innerHeight*.35,
      vx:(Math.random()-.5)*11, vy:-6-Math.random()*9, r:4+Math.random()*6,
      a:Math.random()*6.3, s:(Math.random()-.5)*.3, c:cols[i%cols.length], life:150
    });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    bits = bits.filter(b => b.life-- > 0 && b.y < cvs.height + 40);
    bits.forEach(b => {
      b.vy += .28; b.x += b.vx; b.y += b.vy; b.a += b.s;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
      ctx.fillStyle = b.c; ctx.fillRect(-b.r,-b.r*.6,b.r*2,b.r*1.2); ctx.restore();
    });
    raf = bits.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,cvs.width,cvs.height), null);
  }

  /* ---------------- содержание ---------------- */

    scale:'<path d="M11 2h2v3.2l7 1.6-.4 2-2.2-.5 3.1 6.4c0 2-1.8 3.3-3.8 3.3s-3.8-1.3-3.8-3.3l3.1-6.6-3-.7V20h4v2H7v-2h4V7.4l-3 .7 3.1 6.6c0 2-1.8 3.3-3.8 3.3S3.5 16.7 3.5 14.7L6.6 8.3l-2.2.5-.4-2 7-1.6z"/>',

          a:['5'], suffix:'₽', ph:'число',

          why:'Ластик 5 ₽, карандаш 105 ₽. Разница ровно 100, сумма ровно 110.' },
        { type:'choice', q:'Ряд: <span class="mono">1, 1, 2, 3, 5, 8, 13, …</span>',
          o:['18','21','24','26'], a:1,
          hint:'Каждое число как-то связано с двумя предыдущими.',

    },
    {
      t:'Лишний в компании', s:'Найти того, кто выбивается из ряда', st:'leaf',
      tasks:[
        { type:'choice', q:'Кто здесь лишний?', o:['Кит','Дельфин','Акула','Касатка'], a:2,

          why:'Кит, дельфин и касатка — млекопитающие, они дышат лёгкими. Акула — рыба.' },

          o:['121','144','150','169'], a:2,
          hint:'Три из них — это какое-то число, умноженное само на себя.',
          why:'121 = 11², 144 = 12², 169 = 13². А 150 полным квадратом не является.' },

          a:['8'], suffix:'дней', ph:'число',
          hint:'В последний день сползать уже некуда — считай отдельно.',
          why:'За сутки прибавляется 1 м. К концу 7-го дня улитка на 7 м, на 8-й день поднимается ещё на 3 и выходит наружу.' }
      ]
    },
    {
      t:'Шифры и слова', s:'Буквы, которые притворяются другими', st:'cipher',
      tasks:[
        { type:'input', q:'Каждая буква сдвинута на одну вперёд по алфавиту. Расшифруй: <span class="mono">ЛПТНПТ</span>',
          a:['космос'], ph:'слово',
          hint:'Л → К, П → О. Дальше сама.',
          why:'Сдвигаем каждую букву назад: Л→К, П→О, Т→С, Н→М, П→О, Т→С. Получается КОСМОС.' },
        { type:'input', q:'Собери слово из букв <span class="mono">Т Е Л Е К С О П</span>. Через это смотрят на звёзды.',
          a:['телескоп'], ph:'слово',
          hint:'Все восемь букв нужны, ни одной лишней.',
          why:'ТЕЛЕСКОП — те же буквы, только в правильном порядке.' },
        { type:'input', q:'Продолжи ряд букв: <span class="mono">О, Д, Т, Ч, П, Ш, …</span>',
          a:['с'], ph:'одна буква',
          hint:'Произнеси вслух: один, два, три…',
          why:'Это первые буквы числительных: один, два, три, четыре, пять, шесть. Следующее — семь, буква С.' }
      ]
    }
  ];

  /* ---------------- состояние партии ---------------- */
  let ci = 0, ti = 0, hearts = 3, picked = null, multi = [], asked = false, hinted = false;

  /* ---------------- вспомогательное ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm = s => String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
  function heartsHTML(){
    let h = '<div class="hearts" aria-label="Осталось попыток: '+hearts+'">';
    for (let i=0;i<3;i++) h += '<svg viewBox="0 0 24 24"><path class="h'+(i<hearts?'':' off')+'" d="M12 21s-8-5-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 3.5C20 16 12 21 12 21z"/></svg>';
    return h + '</div>';
  }
  function sticker(name, on){
    return '<span class="slot'+(on?' on':'')+'" title="'+name+'"><svg viewBox="0 0 24 24" fill="#2a2622">'+ICONS[name]+'</svg></span>';
  }
  function drawStickers(){
    $('#stickers').innerHTML = CH.map((c,i)=>sticker(c.st, save.done.indexOf(i) >= 0)).join('');
  }

  /* ---------------- экраны ---------------- */
  function screenStart(){
    mood('idle');
    const n = save.done.length;
    panel.innerHTML =
      '<div class="eyebrow"><span class="dot"></span> Пять глав · 15 задач</div>' +
      '<h2 class="big">Привет! Мы ' + esc(NV()) + ' и ' + esc(NN()) + '.</h2>' +
      '<p class="lead">Мы собрали пятнадцать головоломок: ряды чисел, ловушки на внимание, логику с рассуждением, весы и шифры. ' +
      'В каждой главе три задачи и три жизни — ошибёшься трижды, главу начинаем заново. Прошёл главу — забираешь наклейку.</p>' +
      '<div class="note hand">' + esc(NV()) + ': «Подсказку можно попросить в любой момент — это не считается за ошибку, честное слово».</div>' +
      (n ? '<div class="tally"><div><b>' + n + ' / 5</b><span>наклеек собрано</span></div></div>' : '') +
      '<div class="row"><button class="btn btn--go" id="go">' + (n ? 'Продолжить' : 'Начать игру') + '</button>' +
      (n ? '<button class="btn btn--calm" id="reset">Сбросить прогресс</button>' : '') + '</div>';
    $('#go').onclick = screenMap;
    const r = $('#reset');
    if (r) r.onclick = () => { save.done = []; store(); drawStickers(); screenStart(); };
  }

  function screenMap(){
    mood('idle', [['Выбирай главу.','Заперты только те, до которых не дошли.']]);
    let html = '<div class="eyebrow"><span class="dot"></span> Карта глав</div>' +
               '<h2 class="big">Куда идём?</h2><div class="chapters">';
    CH.forEach((c,i) => {
      const done = save.done.indexOf(i) >= 0;
      const open = i === 0 || save.done.indexOf(i-1) >= 0 || done;
      html += '<button class="ch' + (done?' done':'') + (open?'':' locked') + '" data-i="' + i + '"' + (open?'':' disabled') + '>' +
        '<span class="num">' + (done ? '✓' : (i+1)) + '</span>' +
        '<span><span class="t">' + c.t + '</span><br><span class="s">' + c.s + '</span></span>' +
        '<span class="st"><svg viewBox="0 0 24 24" fill="' + (done ? '#4f9e63' : 'rgba(42,38,34,.18)') + '">' + ICONS[c.st] + '</svg></span></button>';
    });
    html += '</div><div class="row"><button class="btn btn--calm" id="back">На первую страницу</button></div>';
    panel.innerHTML = html;
    panel.querySelectorAll('.ch:not(.locked)').forEach(b => b.onclick = () => startChapter(+b.dataset.i));
    $('#back').onclick = screenStart;
  }

  function startChapter(i){ ci = i; ti = 0; hearts = 3; screenTask(); }

  function screenTask(){
    const c = CH[ci], t = c.tasks[ti];
    picked = null; multi = []; asked = false; hinted = false;
    if (stage.dataset.mood !== 'idle'){ stage.dataset.mood = 'idle'; hide(); }

    const cols = o => { const m = Math.max.apply(null, o.map(x => x.length));
      if (m > 22) return 1; if (o.length === 3) return 3; if (o.length === 5) return 1; return 2; };

    let body = '';
    if (t.type === 'choice'){
      body = '<div class="opts" style="grid-template-columns:repeat(' + cols(t.o) + ',1fr)">' + t.o.map((o,k) =>
        '<button class="opt" data-k="' + k + '"><span class="mark">' + 'АБВГД'[k] + '</span><span>' + o + '</span></button>').join('') + '</div>';
    } else if (t.type === 'multi'){
      body = '<div class="opts" style="grid-template-columns:repeat(' + cols(t.o) + ',1fr)">' + t.o.map((o,k) =>
        '<button class="opt" data-k="' + k + '"><span class="mark">·</span><span>' + o + '</span></button>').join('') + '</div>';
    } else {
      body = '<div class="answer"><input id="inp" type="text" autocomplete="off" placeholder="' + (t.ph||'ответ') + '" aria-label="Ответ">' +
             (t.suffix ? '<span class="suffix">' + t.suffix + '</span>' : '') + '</div>';
    }

    panel.innerHTML =
      '<div class="eyebrow"><span class="dot"></span> Глава ' + (ci+1) + ' · ' + c.t + ' · задача ' + (ti+1) + ' из 3' + heartsHTML() + '</div>' +
      '<p class="q">' + t.q + '</p>' + body +
      '<div id="fb"></div>' +
      '<div class="row">' +
        '<button class="btn btn--go" id="check">Проверить</button>' +
        '<button class="btn btn--calm" id="hint">Подсказка</button>' +
        '<button class="btn btn--calm" id="tomap">К главам</button>' +
      '</div>';

    panel.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (asked) return;
      const k = +b.dataset.k;
      if (t.type === 'multi'){
        const at = multi.indexOf(k);
        if (at >= 0) multi.splice(at,1); else multi.push(k);
        b.classList.toggle('picked');
        b.querySelector('.mark').textContent = b.classList.contains('picked') ? '✓' : '·';
      } else {
        picked = k;
        panel.querySelectorAll('.opt').forEach(x => x.classList.remove('picked'));
        b.classList.add('picked');
      }
      tone(440,0,'sine',.06,.06);
    });

    const inp = $('#inp');
    if (inp){ inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') check(); }; }
    $('#check').onclick = check;
    $('#tomap').onclick = screenMap;
    $('#hint').onclick = () => {
      hinted = true;
      $('#fb').innerHTML = '<div class="note"><b>' + esc(NN()) + ' подсказывает:</b><br>' + t.hint + '</div>';
      mood('idle', [['Подсказка — не поражение.','' + t.hint.slice(0,40) + '…']]);
    };
  }

  function check(){
    const t = CH[ci].tasks[ti];
    if (asked) return;
    let ok = false;
    if (t.type === 'choice'){
      if (picked === null){ nudge('Сначала выбери вариант.'); return; }
      ok = picked === t.a;
    } else if (t.type === 'multi'){
      if (!multi.length){ nudge('Отметь хотя бы один пункт.'); return; }
      ok = multi.length === t.a.length && t.a.every(k => multi.indexOf(k) >= 0);
    } else {
      const v = $('#inp').value;
      if (!norm(v)){ nudge('Впиши ответ в поле.'); return; }
      ok = t.a.some(a => norm(a) === norm(v));
    }
    ok ? right(t) : wrong(t);
  }

  function nudge(text){
    $('#fb').innerHTML = '<div class="note">' + text + '</div>';
  }

  function right(t){
    asked = true;
    sndRight(); mood('joy');
    if (t.type === 'choice'){
      panel.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (+b.dataset.k === t.a) b.classList.add('right'); });
    } else if (t.type === 'multi'){
      panel.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (t.a.indexOf(+b.dataset.k) >= 0) b.classList.add('right'); });
    } else {
      $('#inp').disabled = true;
    }
    $('#fb').innerHTML = '<div class="note good"><b>Верно.</b><br>' + t.why + '</div>';
    const row = panel.querySelector('.row');
    row.innerHTML = '<button class="btn btn--go" id="next">' + (ti === 2 ? 'Забрать наклейку' : 'Следующая задача') + '</button>';
    $('#next').onclick = () => { if (ti === 2) winChapter(); else { ti++; screenTask(); } };
  }

  function wrong(t){
    hearts--;
    sndWrong(); mood('skeptic');
    panel.querySelector('.hearts').outerHTML = heartsHTML();
    if (t.type === 'choice' && picked !== null){
      const b = panel.querySelector('.opt[data-k="' + picked + '"]');
      if (b) { b.classList.remove('picked'); b.classList.add('wrong'); b.disabled = true; }
      picked = null;
    } else if (t.type === 'multi'){
      panel.querySelectorAll('.opt.picked').forEach(b => { b.classList.remove('picked'); b.querySelector('.mark').textContent = '·'; });
      multi = [];
    } else {
      $('#inp').value = ''; $('#inp').focus();
    }
    if (hearts <= 0){ failChapter(); return; }
    $('#fb').innerHTML = '<div class="note"><b>Мимо.</b> Осталось попыток: ' + hearts + '.' +
      (hinted ? '' : '<br>' + t.hint) + '</div>';
    if (!hinted) hinted = true;
  }

  function winChapter(){
    if (save.done.indexOf(ci) < 0){ save.done.push(ci); store(); }
    drawStickers();
    sndWin(); burst(70); mood('fun');
    const all = save.done.length === CH.length;
    panel.innerHTML =
      '<div class="eyebrow"><span class="dot"></span> Глава ' + (ci+1) + ' пройдена</div>' +
      '<h2 class="big">Наклейка твоя!</h2>' +
      '<div style="display:flex;align-items:center;gap:16px">' +
        '<span class="slot on" style="width:74px;height:74px;border-radius:50%;border:2px solid #2a2622;background:#fff;display:grid;place-items:center">' +
        '<svg viewBox="0 0 24 24" width="44" height="44" fill="#e4572e">' + ICONS[CH[ci].st] + '</svg></span>' +
        '<p class="lead" style="margin:0">«' + CH[ci].t + '» — три задачи из трёх. ' + esc(NV()) + ' уже пляшет, ' + esc(NN()) + ' записывает результат в блокнот.</p>' +
      '</div>' +
      '<div class="tally"><div><b>' + save.done.length + ' / 5</b><span>наклеек</span></div><div><b>' + (save.done.length*3) + '</b><span>задач решено</span></div></div>' +
      '<div class="row">' + (all
        ? '<button class="btn btn--go" id="fin">Посмотреть финал</button>'
        : '<button class="btn btn--go" id="nextch">Следующая глава</button><button class="btn btn--calm" id="tomap">К главам</button>') + '</div>';
    if (all) $('#fin').onclick = screenFinal;
    else {
      $('#nextch').onclick = () => { const nx = CH.findIndex((c,i) => save.done.indexOf(i) < 0); startChapter(nx < 0 ? 0 : nx); };
      $('#tomap').onclick = screenMap;
    }
  }

  function failChapter(){
    sndSad(); mood('sad');
    panel.innerHTML =
      '<div class="eyebrow"><span class="dot"></span> Глава ' + (ci+1) + ' · попытки кончились</div>' +
      '<h2 class="big">Ничего страшного.</h2>' +
      '<p class="lead">Три ошибки — и глава начинается заново. Зато теперь ты знаешь, где ловушка. ' +
      esc(NN()) + ' успела записать все подсказки, а ' + esc(NV()) + ' обещает больше не подглядывать в ответ.</p>' +
      '<div class="note hand">Совет: сначала прочитай задачу до конца, потом смотри на варианты. Половина ловушек ловит именно на спешке.</div>' +
      '<div class="row"><button class="btn btn--go" id="again">Пройти главу заново</button><button class="btn btn--calm" id="tomap">К главам</button></div>';
    $('#again').onclick = () => startChapter(ci);
    $('#tomap').onclick = screenMap;
  }

  function screenFinal(){
    sndWin(); burst(140); mood('fun', [['ВСЕ ПЯТНАДЦАТЬ!','Пятнадцать из пятнадцати.']]);
    panel.innerHTML =
      '<div class="eyebrow"><span class="dot"></span> Финал</div>' +
      '<h2 class="big">Пятнадцать задач. Ни одной несданной.</h2>' +
      '<p class="lead">Ряды, классификация, логика с рассуждением, весы и шифры — полный набор. ' +
      esc(NV()) + ' и ' + esc(NN()) + ' официально признают тебя главной по головоломкам.</p>' +
      '<div class="stickers" style="gap:10px">' + CH.map(c => sticker(c.st, true)).join('') + '</div>' +
      '<div class="tally"><div><b>15</b><span>задач решено</span></div><div><b>5</b><span>глав пройдено</span></div></div>' +
      '<div class="row"><button class="btn btn--blue" id="replay">Пройти заново</button><button class="btn btn--calm" id="tomap">К главам</button></div>';
    $('#replay').onclick = () => { save.done = []; store(); drawStickers(); screenStart(); };
    $('#tomap').onclick = screenMap;
  }

  /* ---------------- имена ---------------- */
  function bindPlate(el, key, fallback){
    el.textContent = save.names[key] || fallback;
    el.addEventListener('blur', () => {
      const v = el.textContent.trim().slice(0,14) || fallback;
      el.textContent = v; save.names[key] = v; store();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  }
  bindPlate($('#name-v'), 'v', 'Вега');
  bindPlate($('#name-n'), 'n', 'Ная');

  /* ---------------- звук вкл/выкл ---------------- */
  const sb = $('#sound');
  const paintSound = () => { sb.style.opacity = save.muted ? .4 : 1; sb.title = save.muted ? 'Звук выключен' : 'Звук включён'; };
  sb.onclick = () => { save.muted = !save.muted; store(); paintSound(); if (!save.muted) tone(660,0,'triangle',.12); };
  paintSound();

  /* ---------------- старт ---------------- */
  drawStickers();
  screenStart();
})();
</script>
