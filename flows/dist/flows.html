<!doctype html>
<html lang="ru">
<title>Карта товарных потоков</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: судовой манифест — лента карточек-рынков (рейтинг поставщиков + досье страны с картой потоков), внизу две сводные таблицы и справка. */
:root{
  --paper:#eef1f2; --sheet:#fbfcfc; --ink:#14212b; --ink-2:#4a5a66; --ink-3:#7d8b95;
  --rule:#d5dde1; --bar:#6c8799; --bar-soft:#d9e3e8; --land:#dfe6ea;
  --signal:#b5560f; --signal-soft:#f6e3d3;
  --up:#1f7a4d; --down:#b3261e;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171d; --sheet:#16212a; --ink:#e4ebef; --ink-2:#a9b7c0; --ink-3:#74838d;
  --rule:#26343e; --bar:#7f9fb3; --bar-soft:#22313b; --land:#22303a;
  --signal:#f0954a; --signal-soft:#3a2716;
  --up:#5cc08a; --down:#f07a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171d; --sheet:#16212a; --ink:#e4ebef; --ink-2:#a9b7c0; --ink-3:#74838d;
  --rule:#26343e; --bar:#7f9fb3; --bar-soft:#22313b; --land:#22303a;
  --signal:#f0954a; --signal-soft:#3a2716;
  --up:#5cc08a; --down:#f07a70; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body)}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:18px 64px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
.note-s{font-size:12px;color:var(--ink-3)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}

/* шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1360px;margin:0 auto;padding:12px clamp(16px,3vw,32px) 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{font:700 clamp(18px,2.2vw,22px)/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand p{margin:0;color:var(--ink-2);font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow-x:auto;max-width:100%;background:var(--sheet);scrollbar-width:none}
.seg button{flex:0 0 auto;border:0;background:none;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.seg-l{font-size:12px;color:var(--ink-3)}
.stamp{font-size:12px;color:var(--ink-3)}

/* карточки */
.grid{display:grid;gap:18px;grid-template-columns:1fr}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;display:flex;flex-direction:column;min-width:0;scroll-margin-top:90px}
.c-head{padding:14px 18px 10px;display:grid;gap:5px;border-bottom:1px dashed var(--rule)}
.c-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.c-title h3{font:700 19px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hs{font:500 11px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:3px 5px}
.c-meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 14px}
.c-meta .k{color:var(--ink-3)}
.conc{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor}
.conc.hi{color:var(--signal)} .conc.mid{color:var(--ink-2)} .conc.lo{color:var(--ink-3)}
.ru-line{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ru-line strong{font-weight:600}
.ru-line .tag{color:var(--signal);font-weight:600}

.c-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:820px){.c-body{grid-template-columns:1fr}}
.rank{padding:8px 8px 12px;min-width:0}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
/* колонки таблицы рейтинга: № | страна+полоса | $ | тонны | доля | Δ */
.cols{display:grid;grid-template-columns:20px minmax(0,1fr) 54px 54px 44px 40px;gap:6px;align-items:center;padding:4px 8px}
.thead{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:3px}
.thead span{text-align:right;line-height:1.2}
.thead span:nth-child(2){text-align:left}
.row{border-radius:4px;cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left}
.row:hover{background:var(--paper)}
.row[aria-selected="true"]{border-color:var(--ink-3);background:var(--paper)}
.row .n{font:500 12px var(--f-mono);color:var(--ink-3);text-align:right}
.row .who{min-width:0;display:grid;gap:3px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .nm small{font-size:11px;color:var(--ink-3);margin-left:4px}
.track{height:4px;background:var(--bar-soft);border-radius:0 2px 2px 0}
.fill{height:100%;background:var(--bar);border-radius:0 2px 2px 0}
.row.ru .fill{background:var(--signal)}
.row.ru .nm{font-weight:600}
.row .c{font:13px var(--f-mono);text-align:right;white-space:nowrap}
.row .c.sec{color:var(--ink-2)}
.row .d{font:12px var(--f-mono);text-align:right}
.gap{font-size:11px;color:var(--ink-3);padding:3px 10px 1px 34px}
@media (max-width:440px){.cols{grid-template-columns:18px minmax(0,1fr) 48px 48px 40px 36px;gap:4px;padding:4px 4px}.row .c{font-size:12px}.row .nm{font-size:13px}}

.dossier{padding:12px 18px 16px;border-left:1px dashed var(--rule);display:grid;gap:12px;align-content:start;min-width:0}
@media (max-width:820px){.dossier{border-left:0;border-top:1px dashed var(--rule)}}
.dossier>div{display:grid;gap:12px;min-width:0}
.dossier h4{margin:0;font:600 15px/1.2 var(--f-body)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{display:grid;gap:1px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.fact .v{font:500 17px/1.2 var(--f-mono)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:440px){.charts{grid-template-columns:1fr}}
.charts .label{display:block;margin-bottom:2px}
.buyers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.buyer{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;font-size:13px;align-items:center}
.buyer .nmb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buyer .bt{height:3px;background:var(--bar-soft);margin-top:3px}
.buyer .bf{height:100%;background:var(--bar)}

.map svg{display:block;width:100%;height:auto;overflow:hidden}
.map .land{fill:var(--land);stroke:var(--sheet);stroke-width:.6}
.map .src{fill:var(--signal)}
.map .dst{fill:var(--bar)}
.map .arc{fill:none;stroke:var(--signal);stroke-linecap:round;opacity:.85}
.map .dot{fill:var(--signal);stroke:var(--sheet);stroke-width:1.5}

.spark{position:relative}
.spark svg{display:block;width:100%;height:auto;overflow:visible}
.spark .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--sheet);font:12px/1.3 var(--f-mono);padding:4px 7px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-115%);z-index:2}
.ax{fill:var(--ink-3);font:10.5px var(--f-mono)}
.grid-l{stroke:var(--rule);stroke-width:1}

.c-foot{border-top:1px dashed var(--rule);padding:10px 18px 14px;display:grid;gap:10px;margin-top:auto}
.pulse{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:6px 14px;align-items:center;font-size:13px}
.pulse .pv{font:500 15px var(--f-mono)}
.pulse .ps{font-size:11.5px;color:var(--ink-3)}
.event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;background:var(--signal-soft);border-radius:4px;padding:8px 10px}
.event .et{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--signal);padding-top:2px}
.event a{color:inherit}
.imp{font-size:12.5px;color:var(--ink-2)}
.src-l{font-size:11.5px;color:var(--ink-3)}
.src-l a{color:inherit}


/* аналитическая полоса карточки */
.ana{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.15fr) minmax(0,.85fr);border-bottom:1px dashed var(--rule)}
@media (max-width:1100px){.ana{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ana>.thesis{grid-column:1/-1;border-bottom:1px dashed var(--rule)}}
@media (max-width:700px){.ana{grid-template-columns:1fr}.ana>section+section{border-left:0!important;border-top:1px dashed var(--rule)}}
.ana>section{padding:12px 18px 14px;min-width:0;display:grid;gap:8px;align-content:start}
.ana>section+section{border-left:1px dashed var(--rule)}
@media (max-width:1100px){.ana>section.hist{border-left:0}}
.ana h4{margin:0;font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.thesis p{margin:0;font-size:14px;line-height:1.5;max-width:70ch}
.struct{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:2px 0 0}
.struct dt{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.struct dd{margin:0;color:var(--ink-2)}
.watch{font-size:12.5px;color:var(--ink-2)}
.watch b{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ht{width:100%;border-collapse:collapse;font-size:12px}
.ht th{font:500 10.5px var(--f-mono);color:var(--ink-3);text-align:right;padding:2px 4px;border-bottom:1px solid var(--rule)}
.ht th:first-child,.ht td:first-child{text-align:left}
.ht td{font:11.5px var(--f-mono);text-align:right;padding:3px 3px;white-space:nowrap}
.ht td:first-child{font-family:var(--f-body);font-size:12px;max-width:7.5rem;overflow:hidden;text-overflow:ellipsis}
.ht tr.tot td{color:var(--ink-2);border-bottom:1px solid var(--rule)}
.ht tr.ru td{font-weight:600}
.hist ul{margin:0;padding-left:16px;font-size:13px;display:grid;gap:3px;color:var(--ink-2)}
.hist .tw{overflow-x:auto}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.scale span{height:10px;border-radius:2px;background:var(--bar-soft)}
.scale span.on{background:var(--signal)}
.scale-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.level{font:700 15px/1.2 var(--f-display);color:var(--signal)}
.comp{display:grid;gap:6px}
.comp div{display:grid;gap:2px;font-size:12px;color:var(--ink-2)}
.comp i{display:block;height:3px;background:var(--bar-soft)}
.comp i b{display:block;height:100%;background:var(--ink-3)}
/* золото ЦБ */
#cbgold{grid-column:1/-1}
.gold-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.gold-cols{grid-template-columns:1fr}}
.gold-cols>section{padding:12px 14px;min-width:0}
.gold-cols>section+section{border-left:1px dashed var(--rule)}
@media (max-width:900px){.gold-cols>section+section{border-left:0;border-top:1px dashed var(--rule)}}
.gold-cols h4{margin:0 0 8px;font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.gold-cols ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.gcols{display:grid;grid-template-columns:20px minmax(0,1fr) 70px;gap:6px;align-items:center;padding:4px 8px}

/* сводки внизу */
.summary{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:980px){.summary{grid-template-columns:1fr}}
.sum{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px 12px;min-width:0}
.sum h2{font:700 16px/1.2 var(--f-display);margin:0 0 4px}
.sum p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.st{display:grid;gap:1px}
.srow{display:grid;grid-template-columns:minmax(0,9rem) 34px minmax(0,1fr) 48px 44px;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;text-decoration:none;color:inherit;font-size:13.5px}
.srow:hover{background:var(--paper)}
.srow .mk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rk{font:600 13px var(--f-mono);text-align:right}
.srow .rk.top{color:var(--signal)}
.srow .r{font:12.5px var(--f-mono);text-align:right;white-space:nowrap}
.srow .who{min-width:0;display:grid;gap:3px}
.srow .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.shead{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:2px}
.shead span:nth-child(n+4),.shead span:nth-child(2){text-align:right}
.lrow{grid-template-columns:minmax(0,9rem) minmax(0,1fr) 48px 92px}
@media (max-width:440px){.srow{grid-template-columns:minmax(0,6.5rem) 28px minmax(0,1fr) 42px 40px;gap:5px;font-size:12.5px}.lrow{grid-template-columns:minmax(0,6.5rem) minmax(0,1fr) 42px 56px}}

.empty{padding:40px 0;color:var(--ink-2)}
footer.end{margin-top:24px;font-size:12.5px;color:var(--ink-3);max-width:90ch;display:grid;gap:8px}
footer.end a{color:inherit}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Карта товарных потоков</h1>
      <p>Кто физически снабжает мир сырьём и как меняются потоки</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Раздел" id="groups"></div>
      <span class="seg-l">доли по</span>
      <div class="seg" role="group" aria-label="Считать доли" id="units">
        <button type="button" data-u="usd" aria-pressed="true">стоимости</button>
        <button type="button" data-u="t" aria-pressed="false">объёму</button>
      </div>
      <span class="stamp" id="stamp"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="summary">
    <section class="sum" aria-labelledby="ru-h"><h2 id="ru-h">Россия на мировых рынках</h2><p>Место России среди экспортёров и её доля мирового экспорта</p><div class="st" id="ru-table"></div></section>
    <section class="sum" aria-labelledby="ld-h"><h2 id="ld-h">Лидеры отраслей</h2><p>Крупнейший экспортёр каждого рынка и его доля</p><div class="st" id="lead-table"></div></section>
  </div>
  <footer class="end" id="foot"></footer>

, Россия и Индия. Экспорт дизеля особенно сосредоточен у США, России, Индии и стран Залива.","buyer":"Хронический дефицит дизеля у Европы и Латинской Америки; растёт спрос Африки.","dependence":"Европа до 2023 года получала до половины импортного дизеля из России, теперь — из США, Индии и Саудовской Аравии.","thesis":"Эмбарго ЕС 2023 года перенаправило российский дизель в Турцию, Бразилию и Африку. С 2025 года экспорт России сдерживают атаки дронов на НПЗ и временные запреты экспорта, поэтому даже частичный уход России заметен в маржах переработки по всему миру.","substitution":3,"sub_note":"Мощностей переработки в мире мало, новые заводы на Ближнем Востоке и в Африке закрывают разрыв постепенно.","watch":["запреты экспорта топлива в России","маржа дизеля в Европе (crack spread)","загрузка НПЗ в США и Индии"]},"lng":{"producer":"США стали экспортёром №1 в 2023 году; за ними Катар и Австралия. Россия — №4 (Ямал СПГ), Арктик СПГ 2 под санкциями.","buyer":"Китай, Япония и Южная Корея; с 2022 года Европа стала крупным покупателем вместо трубного газа.","dependence":"Европа всё больше зависит от американского СПГ, Азия — от Катара и Австралии.","thesis":"Рынок стоит на пороге волны предложения: новые заводы в США и расширение катарского North Field в 2026–2028 годах способны перевести его из дефицита в профицит. ЕС поэтапно сворачивает импорт российского СПГ, его объёмы уходят в Азию.","substitution":2,"sub_note":"Танкеры можно перенаправить за недели, но регазификационных мощностей и долгосрочных контрактов не всегда хватает.","watch":["запуск новых заводов в США и Катаре","ограничения ЕС на российский СПГ","заполненность хранилищ ЕС"]},"pipegas":{"producer":"Россия и США — крупнейшие добытчики газа; в трубной торговле главные поставщики — Норвегия и Россия, дальше Алжир и Туркменистан.","buyer":"Европа, Китай, Турция; внутри Европы газ многократно пересекает границы транзитом.","dependence":"Европа после 2022 года держится на Норвегии; Китай наращивает трубный импорт из России и Центральной Азии.","thesis":"Трубный рынок — самый негибкий: маршрут не перенаправить. Транзит через Украину прекращён с 1 января 2025 года; российский трубный экспорт держится на «Силе Сибири» и «Турецком потоке». Карта потоков здесь меняется не сезонно, а политическими решениями на десятилетия.","substitution":5,"sub_note":"Трубу не развернуть: выпадающий объём можно заменить только СПГ, а это дороже и требует терминалов.","watch":["переговоры по «Силе Сибири 2»","прокачка «Турецкого потока»","норвежские ремонты"]},"coal":{"producer":"Китай добывает около половины угля мира и почти весь сжигает сам; Индия — №2.","buyer":"Китай, Индия, Япония, Южная Корея; Европа почти ушла с рынка.","dependence":"Азиатская энергетика зависит от Индонезии (по тоннам) и Австралии (по деньгам, коксующийся уголь).","thesis":"После эмбарго ЕС в августе 2022 года российский уголь развернулся в Азию, но упирается в пропускную способность железной дороги на восток и большие дисконты. Цены вернулись с пиков 2022 года, поэтому экспорт в деньгах падает быстрее, чем в тоннах.","substitution":2,"sub_note":"Поставщиков много, уголь легко замещается, но коксующийся уголь заменить сложнее энергетического.","watch":["импортные квоты и выработка ГЭС в Китае","тарифы РЖД и пропуск на восток","спрос индийской энергетики"]},"ironore":{"producer":"Австралия и Бразилия дают около трёх четвертей мирового экспорта.","buyer":"Китай покупает около 70% морской железной руды.","dependence":"Взаимная зависимость: Китай не может обойтись без Австралии, Австралия — без Китая.","thesis":"Это прямой индикатор китайской стройки и металлургии. Новый фактор — запуск гигантского месторождения Симанду в Гвинее, которое даёт Китаю альтернативу австралийской руде и может давить на цены во второй половине десятилетия.","substitution":4,"sub_note":"Объёмы Австралии и Бразилии быстро не заменить никем, кроме выходящей на рынок Гвинеи.","watch":["выплавка стали в Китае","темпы выхода Симанду","отношения Австралии и Китая"]},"copper":{"producer":"Китай выплавляет около половины рафинированной меди мира, но в основном для себя. Среди экспортёров лидируют Чили и ДР Конго.","buyer":"Китай — крупнейший потребитель; дальше Европа и США.","dependence":"Энергопереход делает рынок зависимым от нескольких стран: Чили, Перу, ДР Конго.","thesis":"Медь — металл электрификации: сети, электромобили, дата-центры. В 2025 году угроза американских пошлин вызвала массовый завоз меди в США и рекордный разрыв цен Нью-Йорка и Лондона. ДР Конго быстро растёт и уже соперничает с Чили.","substitution":3,"sub_note":"Сырьё добывается в немногих странах, новые рудники строятся 10–15 лет.","watch":["пошлины США на медь","экспортная политика ДР Конго","складские запасы LME и COMEX"]},"copperore":{"producer":"Чили и Перу — крупнейшие горнодобытчики, дальше ДР Конго, Китай, США.","buyer":"Китай покупает большую часть мирового медного концентрата, дальше Япония и Южная Корея.","dependence":"Горняки Чили и Перу зависят от китайских плавильных заводов.","thesis":"Плавильных мощностей в Китае построили больше, чем есть концентрата: плата за переработку в 2025 году упала до нуля и ниже. Это сигнал дефицита сырья, который будет подталкивать цены на медь вверх.","substitution":3,"sub_note":"Концентрат производят несколько стран, перебои на крупном руднике сразу видны в мировом балансе.","watch":["забастовки и аварии на рудниках Чили и Перу","ставки TC/RC","экспортная политика Индонезии"]},"aluminium":{"producer":"Китай производит около 60% алюминия мира, но первичного металла почти не экспортирует. Среди экспортёров — Россия, ОАЭ, Канада, Индия.","buyer":"Европа, США, Япония, Турция; в последние годы Китай сам стал импортёром.","dependence":"США зависят от Канады, Европа — от Ближнего Востока и Индии, Китай — от России.","thesis":"Рынок раскалывается на блоки. США подняли пошлины на алюминий до 50%, ЕС поэтапно запрещает российский металл, биржи LME и CME не принимают новый российский алюминий с 2024 года. Российский металл уходит в Китай и Турцию, а производство в Китае упёрлось в государственный потолок мощностей.","substitution":3,"sub_note":"Производство энергоёмко: новые мощности появляются только там, где дешёвая электроэнергия.","watch":["пошлины США","потолок производства в Китае","санкции ЕС против российского металла"]},"nickel":{"producer":"Индонезия добывает больше половины никеля мира и перерабатывает его у себя. Россия («Норникель») — ключевой поставщик чистого никеля.","buyer":"Китай (нержавеющая сталь и аккумуляторы), Европа, США, Япония.","dependence":"Мир зависит от Индонезии, которую контролируют китайские инвесторы.","thesis":"Индонезия завалила рынок дешёвым никелем, цены упали, закрылись рудники в Австралии и Новой Каледонии. Рынок стал заложником индонезийских квот на добычу; батарейный спрос растёт медленнее ожиданий из-за LFP-аккумуляторов без никеля.","substitution":2,"sub_note":"На рынке профицит: выпадение одного поставщика заменяется, кроме Индонезии.","watch":["квоты на добычу в Индонезии","доля LFP-батарей","санкции против «Норникеля»"]},"wheat":{"producer":"Китай и Индия — крупнейшие производители, но почти не экспортируют. Россия — крупнейший экспортёр по тоннам, дальше ЕС, Канада, Австралия, США.","buyer":"Египет, Турция, Индонезия, Алжир, страны Африки и Ближнего Востока.","dependence":"Северная Африка и Ближний Восток критически зависят от черноморской пшеницы.","thesis":"Россия задаёт мировые цены: экспортная пошлина и квоты работают как регулятор рынка. В таблице Россия ниже, чем по тоннам: многие её покупатели в Африке и на Ближнем Востоке не сдают статистику, поэтому зеркальная оценка занижена. Урожай 2025 года и снижение экспорта видны в динамике.","substitution":2,"sub_note":"Поставщиков много, но для бедных импортёров важны цена и логистика Чёрного моря.","watch":["экспортная пошлина и квоты России","урожай в России, ЕС, Австралии","закупки Египта"]},"corn":{"producer":"США — крупнейший производитель и экспортёр, дальше Бразилия, Аргентина, Украина.","buyer":"Мексика, Япония, Южная Корея, ЕС; Китай резко сократил импорт в 2024–2025 годах.","dependence":"Мексика почти полностью зависит от американской кукурузы.","thesis":"Рынок связан с биотопливом и кормами. Китай перешёл на собственное зерно и сократил закупки, поэтому конкуренция США и Бразилии за остальных покупателей обостряется. Украина остаётся крупным поставщиком, несмотря на войну.","substitution":2,"sub_note":"Поставщиков несколько, урожаи в Северном и Южном полушарии сменяют друг друга.","watch":["торговые отношения США с Мексикой и Китаем","урожай Бразилии (сафринья)","квоты на этанол в США"]},"soy":{"producer":"Бразилия даёт около 60% мирового экспорта, США — около четверти, дальше Аргентина и Парагвай.","buyer":"Китай покупает около 60% мировых соевых бобов.","dependence":"Взаимная: Бразилия и американские фермеры зависят от Китая, Китай — от Бразилии.","thesis":"Один из самых политизированных рынков: торговые войны США и Китая напрямую перекладывают поток между Америкой и Бразилией. Бразилия с каждым годом укрепляет позицию, американская соя становится разменной монетой в переговорах.","substitution":3,"sub_note":"Кроме Бразилии и США, крупных поставщиков нет: потерю одного закрывает только другой.","watch":["переговоры США и Китая","урожай Бразилии","свиноводство в Китае"]},"fert":{"producer":"Россия — крупнейший экспортёр удобрений в целом; Канада лидирует по калию, Китай и Марокко — по фосфатам, Катар и Саудовская Аравия — по карбамиду.","buyer":"Бразилия, Индия, США, ЕС, Китай.","dependence":"Аграрная Бразилия и Индия сильно зависят от российских и белорусских удобрений.","thesis":"Удобрения выведены из большинства западных санкций ради продовольственной безопасности, поэтому российский экспорт растёт. Но ЕС с июля 2025 года вводит возрастающие пошлины на российские и белорусские удобрения, а Китай ограничивает экспорт карбамида и фосфатов, чтобы держать внутренние цены.","substitution":4,"sub_note":"Калий добывают несколько стран, азотные удобрения зависят от дешёвого газа: заменить Россию быстро трудно.","watch":["пошлины ЕС","экспортные ограничения Китая","цены на газ в Европе"]},"gold":{"producer":"Китай, Россия и Австралия — крупнейшие добытчики. Торговля идёт через хабы: Швейцарию (аффинаж), Лондон, Гонконг, ОАЭ.","buyer":"Индия, Китай, Турция, центробанки и ETF через лондонские хранилища.","dependence":"Торговые потоки отражают не нужду, а цену и арбитраж между биржами.","thesis":"Физическое золото мечется за ценой: в начале 2025 года угроза американских пошлин вызвала вывоз сотен тонн из Лондона в Нью-Йорк. Рекордные цены снижают ювелирный спрос в Индии и Китае, но инвестиционный и центробанковский спрос перекрывает это.","substitution":1,"sub_note":"Золото взаимозаменяемо и хранится в огромных запасах: перебои быстро гасятся.","watch":["пошлины США","цена золота","импорт Индии и Китая"]},"cbgold":{"thesis":"С 2022 года центробанки покупают более тысячи тонн золота в год — вдвое больше, чем в предыдущее десятилетие. Главный мотив — заморозка российских резервов: золото в собственных хранилищах нельзя арестовать. Россия, наоборот, продаёт золото из ФНБ, чтобы закрывать дефицит бюджета."}}}</script>

<script>
(function(){
"use strict";
var GROUPS=[["all","Все"],["energy","Энергия"],["metals","Металлы"],["food","Продовольствие"],["precious","Золото"]];
var state={group:"all",unit:"usd",sel:{}};
var WORLD=null;
try{var saved=JSON.parse(localStorage.getItem("flows-ui")||"{}");if(saved.group)state.group=saved.group;if(saved.unit)state.unit=saved.unit}catch(e){}
function save(){try{localStorage.setItem("flows-ui",JSON.stringify({group:state.group,unit:state.unit}))}catch(e){}}

var names;try{names=new Intl.DisplayNames(["ru"],{type:"region"})}catch(e){names=null}
var FIX={TW:"Тайвань",HK:"Гонконг",US:"США",AE:"ОАЭ",GB:"Великобритания",KR:"Южная Корея",CD:"ДР Конго",CG:"Конго",CZ:"Чехия"};
function cname(iso){if(!iso)return"—";if(FIX[iso])return FIX[iso];try{return names?names.of(iso):iso}catch(e){return iso}}
function flag(iso){if(!iso||iso.length!==2)return"";return String.fromCodePoint.apply(null,iso.toUpperCase().split("").map(function(c){return 127397+c.charCodeAt(0)}))}
function nf(d){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:d,minimumFractionDigits:d})}
var nf0=nf(0),nf1=nf(1);
function money(v){if(v==null)return"—";var a=Math.abs(v);if(a>=1e9)return"$"+nf1.format(v/1e9)+" млрд";if(a>=1e6)return"$"+nf0.format(v/1e6)+" млн";return"$"+nf0.format(v)}
function tons(t){if(t==null||!t)return"—";var a=Math.abs(t);if(a>=1e6)return nf1.format(t/1e6)+" млн т";if(a>=1e3)return nf0.format(t/1e3)+" тыс. т";return nf0.format(t)+" т"}
function pct(x){if(x==null)return"—";return nf1.format(x*100)+"%"}
function delta(x){if(x==null||!isFinite(x))return'<span class="flat">—</span>';var c=x>0.005?"up":x<-0.005?"down":"flat";var s=(x>0?"+":x<0?"−":"")+nf0.format(Math.abs(x*100))+"%";return'<span class="'+c+'">'+s+"</span>"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function pLabel(p){p=String(p);return MON[+p.slice(4,6)-1]+" "+p.slice(2,4)}

/* Единицы колонок выбираются один раз на карточку по максимуму. */
function scaleUsd(max){
  if(max>=5e9)return{h:"млрд $",f:function(v){return v==null?"—":nf1.format(v/1e9)}};
  if(max>=5e6)return{h:"млн $",f:function(v){return v==null?"—":nf0.format(v/1e6)}};
  return{h:"тыс. $",f:function(v){return v==null?"—":nf0.format(v/1e3)}};
}
function scaleT(max){
  if(max>=5e6)return{h:"млн т",f:function(v){return v?nf1.format(v/1e6):"—"}};
  if(max>=5e3)return{h:"тыс. т",f:function(v){return v?nf0.format(v/1e3):"—"}};
  return{h:"т",f:function(v){return v?nf0.format(v):"—"}};
}
function share(r){return state.unit==="usd"?r.share:r.share_t}
function yoy(r){return state.unit==="usd"?r.yoy:r.yoy_kg}
function val(r){return state.unit==="usd"?r.usd:r.t}

/* спарклайн: area + линия + крупная последняя точка + наведение */
function spark(points,opts){
  var W=opts.w||340,H=opts.h||92,pl=4,pr=4,pt=10,pb=18;
  var vals=points.map(function(p){return p[1]});
  var max=Math.max.apply(null,vals),min=0;
  if(opts.zeroBased===false){min=Math.min.apply(null,vals);var pad=(max-min)*0.15||1;min-=pad;max+=pad}
  if(max===min)max=min+1;
  var n=points.length;
  var x=function(i){return pl+(n===1?0:(W-pl-pr)*i/(n-1))};
  var y=function(v){return pt+(H-pt-pb)*(1-(v-min)/(max-min))};
  var d=points.map(function(p,i){return(i?"L":"M")+x(i).toFixed(1)+","+y(p[1]).toFixed(1)}).join("");
  var area=d+"L"+x(n-1).toFixed(1)+","+(H-pb)+"L"+x(0).toFixed(1)+","+(H-pb)+"Z";
  var last=points[n-1];
  var ticks=[0,n-1];
  var svg='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(opts.aria||"")+'">'+
    '<line class="grid-l" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>'+
    '<path d="'+area+'" fill="'+opts.color+'" fill-opacity=".12"/>'+
    '<path d="'+d+'" fill="none" stroke="'+opts.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(n-1)+'" cy="'+y(last[1])+'" r="4" fill="'+opts.color+'" stroke="var(--sheet)" stroke-width="2"/>'+
    ticks.map(function(i){var a=i===0?"start":"end";return'<text class="ax" x="'+x(i)+'" y="'+(H-3)+'" text-anchor="'+a+'">'+esc(opts.lab(points[i][0]))+"</text>"}).join("")+
    '<line class="hx" x1="0" x2="0" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/>'+
    '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent"/></svg><div class="tip" hidden></div>';
  var el=document.createElement("div");el.className="spark";el.innerHTML=svg;
  var s=el.querySelector("svg"),tip=el.querySelector(".tip"),hx=el.querySelector(".hx");
  function move(ev){var r=s.getBoundingClientRect();var px=(ev.clientX-r.left)/r.width*W;var i=Math.round((px-pl)/((W-pl-pr)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
    hx.setAttribute("x1",x(i));hx.setAttribute("x2",x(i));hx.setAttribute("visibility","visible");
    tip.hidden=false;tip.style.left=Math.min(85,Math.max(15,x(i)/W*100))+"%";tip.style.top=(y(points[i][1])/H*100)+"%";tip.textContent=opts.lab(points[i][0])+" · "+opts.fmt(points[i][1])}
  s.addEventListener("pointermove",move);s.addEventListener("pointerdown",move);
  s.addEventListener("pointerleave",function(){tip.hidden=true;hx.setAttribute("visibility","hidden")});
  return el;
}

/* Мини-карта: страна-экспортёр и дуги к покупателям; толщина дуги — доля. */
function flowMap(iso,buyers,aria){
  if(!WORLD||!WORLD.centers[iso])return null;
  var W=WORLD.w,H=WORLD.h,C=WORLD.centers,src=C[iso];
  var dst=buyers.filter(function(b){return C[b[0]]&&b[0]!==iso});
  var fills={};fills[iso]="src";dst.forEach(function(b){fills[b[0]]="dst"});
  var land=Object.keys(WORLD.countries).map(function(k){return'<path class="land'+(fills[k]?" "+fills[k]:"")+'" d="'+WORLD.countries[k]+'"/>'}).join("");
  var arcs=dst.map(function(b){
    var t=C[b[0]],dx=t[0]-src[0],dy=t[1]-src[1],len=Math.sqrt(dx*dx+dy*dy)||1;
    var k=Math.min(0.35,60/len+0.15);
    var cx=(src[0]+t[0])/2-dy*k,cy=(src[1]+t[1])/2+dx*k;
    if(cy>(src[1]+t[1])/2){cx=(src[0]+t[0])/2+dy*k;cy=(src[1]+t[1])/2-dx*k}
    var w=(1.2+b[1]*14).toFixed(1);
    return'<path class="arc" d="M'+src[0]+","+src[1]+"Q"+cx.toFixed(1)+","+cy.toFixed(1)+" "+t[0]+","+t[1]+'" stroke-width="'+w+'" marker-end="url(#ah)"><title>'+esc(cname(b[0]))+" "+pct(b[1])+"</title></path>";
  }).join("");
  var el=document.createElement("div");el.className="map";
  el.innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(aria)+'"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--signal)"/></marker></defs>'+land+arcs+
    '<circle class="dot" cx="'+src[0]+'" cy="'+src[1]+'" r="6"/></svg>';
  return el;
}


var RISK={RU:1,IR:1,VE:1,BY:1,KP:1,SY:1};
var RISK_N={RU:"Россия",IR:"Иран",VE:"Венесуэла",BY:"Беларусь",KP:"КНДР",SY:"Сирия"};
var SUB_L=["","легко","скорее легко","с трудом","трудно","почти невозможно"];
function clamp(x){return Math.max(0,Math.min(1,x))}
function sensitivity(m,ins){
  var ex=m.exporters||[];
  var hhi=m.hhi||0,s1=clamp(hhi/2500);
  var imp=(m.importers||[]).slice(0,3).reduce(function(a,x){return a+x[2]},0),s2=clamp((imp-0.25)/0.5);
  var rk=ex.filter(function(r){return RISK[r.iso]}),risk=rk.reduce(function(a,r){return a+r.share},0),s3=clamp(risk/0.25);
  var sub=ins&&ins.substitution||3,s4=(sub-1)/4;
  var score=0.3*s1+0.2*s2+0.2*s3+0.3*s4;
  var lvl=Math.min(5,1+Math.floor(score*5));
  return{lvl:lvl,score:score,parts:[
    ["Концентрация поставщиков: топ-3 дают "+pct(m.top3_share),s1],
    ["Зависимость от покупателей: топ-3 импортёра берут "+pct(imp),s2],
    ["Под санкциями: "+pct(risk)+" экспорта"+(rk.length?" ("+rk.map(function(r){return RISK_N[r.iso]}).join(", ")+")":""),s3],
    ["Заменить выпавшего поставщика: "+SUB_L[sub],s4]]};
}
var LVL=["","низкая","умеренная","заметная","высокая","критическая"];
function sensBlock(m,ins){
  var s=sensitivity(m,ins);
  return'<h4>Чувствительность к шокам</h4><div><div class="level">'+LVL[s.lvl]+' <span class="num" style="font:500 12px var(--f-mono);color:var(--ink-3)">'+s.lvl+'/5</span></div></div>'+
   '<div><div class="scale" role="img" aria-label="Уровень '+s.lvl+' из 5">'+[1,2,3,4,5].map(function(i){return'<span'+(i<=s.lvl?' class="on"':"")+' style="opacity:'+(i<=s.lvl?0.35+0.13*i:1)+'"></span>'}).join("")+'</div><div class="scale-l"><span>санкции и пошлины почти не заметны</span><span>цены реагируют резко</span></div></div>'+
   '<div class="comp">'+s.parts.map(function(p){return'<div>'+esc(p[0])+'<i><b style="width:'+Math.round(p[1]*100)+'%"></b></i></div>'}).join("")+'</div>'+
   (ins&&ins.sub_note?'<div class="note-s">'+esc(ins.sub_note)+"</div>":"");
}
function histBlock(m){
  var h=m.history;if(!h||!h.years)return'<h4>Рынок за 4 года</h4><div class="note-s">История ещё собирается.</div>';
  var y=h.years,su=scaleUsd(Math.max.apply(null,h.usd)),st=scaleT(Math.max.apply(null,h.t.map(function(v){return v||0})));
  var okT=h.cov_t>0.6&&h.t[0]>0;
  function big(sc,v){var x=parseFloat(sc.f(v).replace(/\s/g,"").replace(",","."));return isFinite(x)&&x>=100?nf0.format(x):sc.f(v)}
  var rows='<tr class="tot"><td>Экспорт, '+su.h+'</td>'+h.usd.map(function(v){return"<td>"+big(su,v)+"</td>"}).join("")+"<td>"+delta(h.usd[3]/h.usd[0]-1)+"</td></tr>";
  if(okT)rows+='<tr class="tot"><td>Объём, '+st.h+'</td>'+h.t.map(function(v){return"<td>"+big(st,v)+"</td>"}).join("")+"<td>"+delta(h.t[3]/h.t[0]-1)+"</td></tr>";
  var keys=Object.keys(h.shares);
  keys.sort(function(a,b){return h.shares[b][3]-h.shares[a][3]});
  keys=keys.slice(0,5).concat(keys.indexOf("RU")>4?["RU"]:[]);
  rows+=keys.map(function(k){var v=h.shares[k],d=(v[3]-v[0])*100;return'<tr'+(k==="RU"?' class="ru"':"")+'><td>'+flag(k)+" "+esc(cname(k))+"</td>"+v.map(function(x){return"<td>"+nf1.format(x*100)+"</td>"}).join("")+'<td><span class="'+(d>0.3?"up":d<-0.3?"down":"flat")+'">'+(d>0?"+":d<0?"−":"")+nf1.format(Math.abs(d))+"</span></td></tr>"}).join("");
  var tbl='<div class="tw"><table class="ht"><thead><tr><th></th>'+y.map(function(v){return"<th>"+v+"</th>"}).join("")+'<th>Δ</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="note-s">Доли — % мирового экспорта в деньгах; Δ доли — в процентных пунктах. Сопоставимый круг: '+h.n+" стран, "+Math.round(h.cov*100)+"% экспорта "+y[3]+".</div>";
  var pts=[];
  var dv=h.usd[3]/h.usd[0]-1;
  if(okT){var dt=h.t[3]/h.t[0]-1;
    if(dv<dt-0.1)pts.push("Деньги отстают от тонн: товар подешевел, а физический поток "+(dt>=0.03?"вырос на "+nf0.format(dt*100)+"%":dt<=-0.03?"сократился на "+nf0.format(-dt*100)+"%":"почти не изменился")+".");
    else if(dv>dt+0.1)pts.push("Рост в деньгах обгоняет тонны: рынок дорожает, а не расширяется.");
    else pts.push("Деньги и тонны идут вместе: изменения в основном физические.");}
  if(h.gainers&&h.gainers.length)pts.push("Нарастил долю: "+h.gainers.map(function(g){return cname(g[0])+" ("+nf1.format(g[1]*100)+"→"+nf1.format(g[2]*100)+"%)"}).join(", ")+".");

  return'<h4>Рынок за 4 года</h4>'+tbl+(pts.length?"<ul>"+pts.map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+"</ul>":"");
}

function pulseBlock(p){
  var s=p.series;if(!s||s.length<5)return null;
  var last=s[s.length-1],avg=s.slice(-5,-1).reduce(function(a,b){return a+b[1]},0)/4;
  var yago=s.length>=53?s[s.length-53][1]:null;
  var el=document.createElement("div");el.className="pulse";
  var fmt=p.unit==="%"?function(v){return nf1.format(v)+"%"}:function(v){return nf0.format(v)};
  var dd=new Date(last[0]+"T00:00:00");
  el.innerHTML='<div><div class="label">'+esc(p.label)+" · "+esc(p.freq)+'</div><span class="pv">'+fmt(last[1])+'</span> <span class="ps">'+esc(p.unit)+", "+dd.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+'</span><br><span class="ps">'+
    (p.unit==="%"?"":"к средней за 4 недели "+delta(last[1]/avg-1)+(yago?" · к году назад "+delta(last[1]/yago-1):""))+
    ' · <a href="'+p.url+'" target="_blank" rel="noopener">'+esc(p.source)+"</a></span></div>";
  el.appendChild(spark(s.slice(-26).map(function(q){return[q[0],q[1]]}),{color:"var(--ink-2)",lab:function(d){var t=new Date(d+"T00:00:00");return t.getDate()+"."+String(t.getMonth()+1).padStart(2,"0")},fmt:fmt,aria:p.label}));
  return el;
}

  var up=new Date(data.updated);document.getElementById("stamp").textContent="Обновлено "+up.toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  var grid=document.getElementById("grid");grid.innerHTML="";
  (data.markets||[]).forEach(function(m){if(state.group==="all"||m.group===state.group)grid.appendChild(marketCard(m,data))});
  if(data.cbgold&&(state.group==="all"||state.group==="precious"))grid.appendChild(goldCard(data.cbgold));
  if(!grid.children.length)grid.innerHTML='<p class="empty">В этом разделе пока нет рынков.</p>';
  summaries(data);
  document.getElementById("foot").innerHTML=
   '<div>Рейтинг экспортёров собран по таможенной статистике ООН за последний полный год. Россия и ещё несколько стран не сдают данные с 2022 года, поэтому их экспорт восстановлен по импорту стран-покупателей (отмечен знаком ≈). Помесячные ряды и недельные данные EIA показывают текущий импульс. Нажмите на страну в рейтинге, чтобы открыть её досье и карту поставок.</div>'+
   '<div>Источники. Структурный слой: <a href="https://comtradeplus.un.org/" target="_blank" rel="noopener">UN Comtrade</a> (годовые и месячные данные, задержка 2–6 месяцев). Быстрый слой: <a href="https://www.eia.gov/petroleum/supply/weekly/" target="_blank" rel="noopener">EIA</a> (неделя), <a href="https://data.imf.org/" target="_blank" rel="noopener">IMF IRFCL</a> (месяц)'+(data.pulses&&data.pulses.gie_storage?", GIE AGSI (сутки)":"")+'. Карта: Natural Earth.</div>'+
   '<div>Стоимость — в долларах США по данным отчитавшейся стороны: экспорт в ценах FOB, зеркальные оценки в ценах CIF, поэтому они выше на 3–8% за счёт фрахта и страховки. Объём — масса нетто; часть стран её не указывает.</div>';
}

function boot(data){
  if(data)window.__INS=data.insights||{};
  if(!data||!data.markets){document.getElementById("grid").innerHTML='<p class="empty">Данные ещё не собраны. Запустите <code>python3 flows/fetch/update.py</code>.</p>';return}
  render(data);
  document.getElementById("groups").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;state.group=b.dataset.g;save();render(data)});
  document.getElementById("units").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;state.unit=b.dataset.u;save();render(data)});
}
function inline(id){try{return JSON.parse(document.getElementById(id).textContent)}catch(e){return null}}
var D=inline("flows-data");WORLD=inline("world-data");
var jobs=[];
if(!D)jobs.push(fetch("data/flows.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){D=x}));
if(!WORLD)jobs.push(fetch("data/world.json").then(function(r){return r.json()}).then(function(x){WORLD=x}).catch(function(){}));
Promise.all(jobs).then(function(){boot(D)}).catch(function(){boot(D)});
})();
</script>
